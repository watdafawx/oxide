title = "Print the status line"
summary = "Print `play.example.net: 3/20 online` and format server TPS with two decimals."

[[objectives]]
test = "printsStatusLine"
label = "printStatus(out, \"play.example.net\", 3, 20) prints \"play.example.net: 3/20 online\" and a newline"

[[objectives]]
test = "formatsTpsWithTwoDecimals"
label = "formatTps(19.9766) returns \"19.98\""

[[hints]]
text = "Print to the stream you are given, not `System.out`: `out.printf(...)`. That is how the test captures the output."

[[hints]]
text = "`%s` is a slot for text, `%d` for a whole number, `%n` for a newline."

[[hints]]
text = "`out.printf(\"%s: %d/%d online%n\", server, online, max);`"

[[hints]]
text = "`String.format` builds text with the same slots instead of printing. `%.2f` means a decimal with 2 digits."

[[hints]]
text = "`return String.format(Locale.ROOT, \"%.2f\", tps);`"
