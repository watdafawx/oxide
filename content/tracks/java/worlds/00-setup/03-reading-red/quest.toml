title = "Reading red"
summary = "A failing test tells you exactly what to fix. Learn to read it."
kind = "read"
xp = 15
minutes = 3
tags = ["setup", "tests"]

[[quiz]]
question = "In `expected: \"Hello, Ada!\"` / `but was: \"Hello, Ada\"`, what did YOUR code return?"
choices = ["\"Hello, Ada!\"", "\"Hello, Ada\"", "Nothing"]
answer = 1

[[quiz]]
question = "Where does the failure tell you which test line failed?"
choices = ["In the Gradle version number", "It never tells you that", "At the end, as `file:line`"]
answer = 2

[[quiz]]
question = "A red objective says `but was: null` and you have not touched that method yet. What does it mean?"
choices = ["It is not written yet", "Java itself is broken", "The test itself is wrong"]
answer = 0
