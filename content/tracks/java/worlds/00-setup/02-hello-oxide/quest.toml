title = "Hello, Oxide"
summary = "Make greeting() return \"Hello, Oxide!\": your first green tick."
kind = "exercise"
xp = 30
minutes = 4
tags = ["setup", "return"]

[[objectives]]
test = "greetingSaysHello"
label = "greeting() returns \"Hello, Oxide!\""

[[hints]]
text = "The method is `greeting`. Replace `return null;` with a line that returns your text."
[[hints]]
text = "Text goes in double quotes: `return \"Hello, Oxide!\";`"

[[points]]
after = 2
prompt = "What does `but was: null` tell you?"
pick = ["The method gave back nothing yet", "The checker is broken", "Java is not installed", "The text has a typo"]
answer = 0
[[points]]
after = 4
prompt = "Fill the body so it returns the text."
code = "public static String farewell() {\n    ___\n}"
blank = "return \"Bye, Oxide!\";"
