title = "Hello, Oxide"
summary = "Make greeting() return \"Hello, Oxide!\": your first green tick."
kind = "exercise"
xp = 30
minutes = 4
tags = ["setup", "strings"]

[[objectives]]
test = "greetingSaysHello"
label = "greeting() returns \"Hello, Oxide!\""

[[hints]]
text = "A method ends with `return something;`. Right now it returns `null`, which means \"nothing\"."

[[hints]]
text = "Text goes in double quotes: `return \"Hello, Oxide!\";`"

[[points]]
after = 4
prompt = "Which word hands the value back?"
pick = ["void", "return", "String", "static"]
answer = 1

[[points]]
after = 5
prompt = "Fill the body so it returns the text."
code = "public static String farewell() {\n    ___\n}"
blank = "return \"Bye, Oxide!\";"
