title = "Boss: Status report"
summary = "Parse the server's raw `12/20`, work out how full it is, and print the report line."

[[objectives]]
test = "parsesPlayerCounts"
label = "parseCounts(\"12/20\") returns [12, 20]"

[[objectives]]
test = "computesFillPercent"
label = "fillPercent(12, 20) returns 60"

[[objectives]]
test = "serversNeededRoundsUp"
label = "serversNeeded(45, 20) returns 3"

[[objectives]]
test = "reportIsFormatted"
label = "report(\"survival\", \"12/20\") is \"survival: 12/20 online (60%)\""

[[hints]]
text = "Four small methods, each one a tick. `report` at the end just calls `parseCounts` and `fillPercent`, so do them in order."

[[hints]]
text = "`raw.split(\"/\")` cuts \"12/20\" into two pieces. Call `.trim()` on each piece, then `Integer.parseInt(piece)`."

[[hints]]
text = "Percent is `online * 100 / max`. Multiply **before** dividing, or integer division rounds everything to 0. If `max` is 0, return 0."

[[hints]]
text = "Servers needed is a division that rounds **up**: `(players + perServer - 1) / perServer`. 45 players at 20 per server is 3, not 2."

[[hints]]
text = "`report`: `int[] counts = parseCounts(raw);` then `fillPercent(counts[0], counts[1])`."

[[hints]]
text = "`return String.format(Locale.ROOT, \"%s: %d/%d online (%d%%)\", name, counts[0], counts[1], percent);` (`%%` prints a literal percent sign)."

[[points]]
after = 6
prompt = "Cut the text at the slash."
code = "String[] parts = \"12/20\".split(___);"
blank = "\"/\""

[[points]]
after = 7
prompt = "Which prints a literal percent sign in a format?"
pick = ["%d", "%%", "%s", "%n"]
answer = 1
