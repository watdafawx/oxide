title = "Boss: Tip calculator"
summary = "Parse a bill, add a tip, split it, and print a tidy receipt."
kind = "boss"
xp = 300
minutes = 35
tags = ["setup", "boss", "strings", "printf"]

[[objectives]]
test = "parsesAmount"
label = "parseAmount(\"42.50\") returns 42.5"

[[objectives]]
test = "appliesTipPercent"
label = "withTip(40.0, 15) returns 46.0"

[[objectives]]
test = "splitsEvenly"
label = "splitEvenly(46.0, 4) returns 11.5"

[[objectives]]
test = "receiptIsFormatted"
label = "receipt(\"40.00\", 15, 4) is the four-line receipt"

[[hints]]
text = "Four small methods, each one a tick. `receipt` at the end just calls the other three, so do them in order."

[[hints]]
text = "`Double.parseDouble(text)` turns \"42.50\" into 42.5. Call `.trim()` on the text first so spaces do not break it."

[[hints]]
text = "Tip is `amount * percent / 100.0`; the total is the amount plus the tip. Use `100.0`, not `100`: `100` would round to a whole number."

[[hints]]
text = "Splitting is one division: `total / people`. The test compares decimals with a small tolerance."

[[hints]]
text = "`receipt`: `double amount = parseAmount(raw);` then `double total = withTip(amount, percent);` and `double tip = total - amount;`."

[[hints]]
text = "Build the four lines with `String.format(Locale.ROOT, \"Bill: $%.2f\", amount)` and so on, then join them with `String.join(\"\\n\", ...)`. `%%` prints a literal percent sign in a format string."

[[points]]
after = 3
prompt = "Turn the text into a double."
code = "double amount = Double.___(clean);"
blank = "parseDouble"

[[points]]
after = 8
prompt = "Which prints a literal percent sign in a format?"
pick = ["%d", "%%", "%s", "%n"]
answer = 1
