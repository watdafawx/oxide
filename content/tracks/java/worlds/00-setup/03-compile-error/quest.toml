title = "Fix the compile error"
summary = "The compiler tells you exactly what is wrong. Fix a missing semicolon."
kind = "exercise"
xp = 30
minutes = 3
tags = ["setup", "compiler"]
starter_fails_to_compile = true

[[objectives]]
test = "welcomeLineBuilds"
label = "Greeter compiles and welcome() returns \"Welcome to Oxide!\""

[[hints]]
text = "Read the first error: it names the line, and the `^` points just after the end of the `return` line."
[[hints]]
text = "A statement ends with `;`. Add it after the closing quote."

[[points]]
after = 3
prompt = "Which part of the message tells you the line number?"
pick = ["The `7` after `Greeter.java:`", "The word `error`", "The word `expected`", "The `^` on the last line"]
answer = 0
[[points]]
after = 4
prompt = "Finish the line."
code = "return \"Welcome to Oxide!\"___"
blank = ";"
