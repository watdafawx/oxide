title = "Pick the server"
summary = "Run the bot as `java StatusCommand <server>` and read the address from args."

[[objectives]]
test = "headerUsesFirstArgAsServer"
label = "header([\"play.example.net\"]) returns \"Status of play.example.net\""
[[objectives]]
test = "compareHeaderUsesTwoServers"
label = "compareHeader([\"a\", \"b\"]) returns \"Status of a and b\""

[[hints]]
text = "Both methods are in `StatusCommand`. `args[0]` is the first word, `args[1]` the second."
[[hints]]
text = "`return \"Status of \" + args[0];`, and for two servers `return \"Status of \" + args[0] + \" and \" + args[1];`"

[[points]]
after = 3
prompt = "Which one is the FIRST word the user typed?"
pick = ["args[0]", "args[1]", "args[-1]", "args"]
answer = 0
[[points]]
after = 4
prompt = "Take the second word."
code = "return \"Status of \" + ___;"
blank = "args[1]"
