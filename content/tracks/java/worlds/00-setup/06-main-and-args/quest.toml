title = "main and args"
summary = "Programs start in main. Read the first word typed after the program name."
kind = "exercise"
xp = 40
minutes = 5
tags = ["setup", "main", "arrays"]

[[objectives]]
test = "bannerUsesFirstArg"
label = "banner([\"Ada\"]) returns \"Hello, Ada!\""
[[objectives]]
test = "pairBannerUsesTwoArgs"
label = "pairBanner([\"Ada\", \"Bo\"]) returns \"Hello, Ada and Bo!\""

[[hints]]
text = "Both methods are in `Banner`. `args[0]` is the first word, `args[1]` the second."
[[hints]]
text = "`return \"Hello, \" + args[0] + \"!\";`, and for two words `return \"Hello, \" + args[0] + \" and \" + args[1] + \"!\";`"

[[points]]
after = 3
prompt = "Which one is the FIRST word the user typed?"
pick = ["args[0]", "args[1]", "args[-1]", "args"]
answer = 0
[[points]]
after = 4
prompt = "Take the second word."
code = "return \"Hello, \" + ___ + \"!\";"
blank = "args[1]"
