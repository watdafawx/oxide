[[hints]]
text = "Read the first error: it names the file and line, and `^` points at the spot. It says `';' expected`."

[[hints]]
text = "Add the missing `;` at the end of the `String total = a + b` line. Save and read the next error."

[[hints]]
text = "Now javac complains it cannot convert `int` to `String`. `a + b` is a number, so the variable should be an `int`."

[[hints]]
text = "Final line: `int total = a + b;`"
