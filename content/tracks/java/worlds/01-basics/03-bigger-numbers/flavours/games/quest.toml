title = "Bigger numbers"
summary = "Use long for totals that pass 2.1 billion."

[[objectives]]
test = "bytesSentNeedsLongLiteral"
label = "bytesSentLastYear() returns 6_000_000_000L"
[[objectives]]
test = "playerSecondsFitInLong"
label = "playerSeconds returns the true product as a long"

[[hints]]
text = "Both methods are in `StatusStats`. A number past 2.1 billion must end in `L`."
[[hints]]
text = "`return 6_000_000_000L;` and `return (long) players * seconds;`"

[[points]]
after = 2
prompt = "What must a literal bigger than an int end with?"
pick = ["L", "B", "int", "0"]
answer = 0
[[points]]
after = 4
prompt = "Cast the first number before the multiplication."
code = "long total = ___ players * seconds;"
blank = "(long)"
