title = "Flip it round"
summary = "Reverse a MOTD and spot palindromes."

[[objectives]]
test = "flipsMotdBackwards"
label = "flip returns the characters in the opposite order"
[[objectives]]
test = "palindromeMotdIgnoresCaseAndSpaces"
label = "isPalindrome ignores case and spaces"

[[hints]]
text = "Both methods are in `Motd`. Write `flip` first: `isPalindrome` can use it."
[[hints]]
text = "`return new StringBuilder(motd).reverse().toString();` and `String clean = motd.replace(\" \", \"\").toLowerCase(); return clean.equals(flip(clean));`"

[[points]]
after = 2
prompt = "Which call turns the builder back into a String?"
pick = ["toString()", "reverse()", "append()", "length()"]
answer = 0
[[points]]
after = 3
prompt = "Remove all spaces."
code = "String tight = text.replace(\" \", ___);"
blank = "\"\""
