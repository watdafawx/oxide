title = "Ramp-up and color codes"
summary = "Loop to total a growing player count, and to count color codes in a MOTD."

[[objectives]]
test = "playerMinutesAddsInclusive"
label = "playerMinutes(minutes) adds 1 through minutes, the last minute included"

[[objectives]]
test = "countsColorCodesInMotd"
label = "countColorCodes counts every section sign in a MOTD"

[[hints]]
text = "`playerMinutes`: `int total = 0; for (int m = 1; m <= minutes; m++) { total += m; } return total;`. Note `<=`: the last minute counts."

[[hints]]
text = "`countColorCodes`: loop over `motd.toCharArray()` with `for (char c : ...)`."

[[hints]]
text = "The color-code character is `'\\u00a7'` (a section sign). Compare with `c == '\\u00a7'` and `count++`."

[[points]]
after = 1
prompt = "Which test includes the last minute?"
pick = ["m < minutes", "m <= minutes", "m != minutes", "m > minutes"]
answer = 1

[[points]]
after = 3
prompt = "Add m to total."
code = "total ___ m;"
blank = "+="
