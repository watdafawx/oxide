title = "Any number of values"
summary = "Add up any number of ints."
kind = "exercise"
xp = 35
minutes = 4
tags = ["methods", "varargs"]

[[objectives]]
test = "howManyCountsTheNumbers"
label = "howMany(3, 8, 0) returns 3"
[[objectives]]
test = "sumAddsAnyNumber"
label = "sum adds any number of values, including none"

[[hints]]
text = "Both methods are in `Numbers`. Inside, `nums` is an `int[]`."
[[hints]]
text = "`return nums.length;` and `int total = 0; for (int n : nums) { total += n; } return total;`"

[[points]]
after = 1
prompt = "What does `int... nums` accept?"
pick = ["Zero or more ints", "Exactly one int", "An int and a text", "Only an array"]
answer = 0
[[points]]
after = 3
prompt = "What is `nums` inside the method?"
pick = ["An int[]", "An int", "A String", "Nothing"]
answer = 0
