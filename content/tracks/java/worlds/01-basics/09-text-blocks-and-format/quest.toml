title = "Text blocks and format"
summary = "Build a table with StringBuilder and a JSON snippet with a text block."
kind = "exercise"
xp = 35
minutes = 6
tags = ["strings", "format"]

[[objectives]]
test = "buildsTableWithStringBuilder"
label = "table builds one formatted row per name, joined with newlines"

[[objectives]]
test = "textBlockKeepsIndent"
label = "jsonBlock returns an indented JSON text block with the values filled in"

[[hints]]
text = "`table`: make a `StringBuilder`, loop with an index `i`, and `append(String.format(\"%-6s|%4d\\n\", names[i], scores[i]))`. Return `sb.toString()`."

[[hints]]
text = "`%-6s` pads text to 6 characters on the right, `%4d` right-aligns an int in 4 characters."

[[hints]]
text = "`jsonBlock`: a text block starts with `\"\"\"` and a newline. Put `%s` and `%d` inside, end with `\"\"\".formatted(status, count)`."

[[hints]]
text = "The closing `\"\"\"` on its own line decides how much indentation is stripped, and adds the final newline."
