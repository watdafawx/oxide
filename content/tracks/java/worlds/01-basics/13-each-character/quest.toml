title = "Each character"
summary = "Count the spaces in a text, one character at a time."
kind = "exercise"
xp = 40
minutes = 5
tags = ["loops", "char"]

[[objectives]]
test = "countsSpacesInText"
label = "countSpaces counts every space in a text"

[[hints]]
text = "The method is in `Scan`. Make a counter first, then loop over `text.toCharArray()`."
[[hints]]
text = "`int count = 0; for (char c : text.toCharArray()) { if (c == ' ') { count++; } } return count;`"

[[points]]
after = 3
prompt = "Which loop visits every character?"
pick = ["for (char c : text.toCharArray())", "for (char c = text)", "while (text)", "for (c in text)"]
answer = 0
[[points]]
after = 4
prompt = "Is c the letter a?"
code = "if (c ___ 'a') {"
blank = "=="
