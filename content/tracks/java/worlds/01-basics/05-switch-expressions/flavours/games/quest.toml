title = "Uptime months and ping grades"
summary = "Use arrow switches for month lengths (monthly uptime) and ping bands."

[[objectives]]
test = "monthLengthHandlesLeapYear"
label = "daysInMonth knows 28/29/30/31, including leap years, and throws IllegalArgumentException for month 13"

[[objectives]]
test = "pingGradeMapsBands"
label = "pingGrade maps ping bands to great/good/ok/poor"

[[hints]]
text = "`switch` as an expression: `return switch (month) { case 4, 6, 9, 11 -> 30; ... };`. Several labels share one arm with commas."

[[hints]]
text = "February: `case 2 -> isLeap(year) ? 29 : 28;`. Leap = divisible by 4, except centuries, except every 400."

[[hints]]
text = "`pingGrade`: switch on `pingMs / 50`, so 0..49 is `case 0`. `case 2, 3 -> \"ok\"`, `default -> \"poor\"`."
