title = "Switch expressions"
summary = "Arrow switch that returns a value: month lengths and letter grades."
kind = "exercise"
xp = 50
minutes = 8
tags = ["control-flow", "switch"]

[[objectives]]
test = "daysInMonthHandlesLeapYear"
label = "daysInMonth knows 28/29/30/31, including leap years, and throws IllegalArgumentException for month 13"

[[objectives]]
test = "gradeForMapsBands"
label = "gradeFor maps score bands to letters"

[[hints]]
text = "`switch` as an expression: `return switch (month) { case 4, 6, 9, 11 -> 30; ... };`. Several labels share one arm with commas."

[[hints]]
text = "February: `case 2 -> isLeap(year) ? 29 : 28;`. Leap = divisible by 4, except centuries, except every 400."

[[hints]]
text = "`gradeFor`: switch on `score / 10`, so 100 and 90..99 both land in `case 10, 9 -> \"A\"`. `default -> \"F\"`."
