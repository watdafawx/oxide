title = "Sane player counts and trend arrows"
summary = "Clamp a player count into range and report if the server is filling or emptying."

[[objectives]]
test = "clampKeepsPlayerCountInRange"
label = "clampPlayerCount returns min below the range, max above it, and the count inside it"

[[objectives]]
test = "trendReturnsMinusOneZeroOne"
label = "trend returns -1 (leaving), 0 (steady) or 1 (joining)"

[[hints]]
text = "`clampPlayerCount`: below `min` return `min`; above `max` return `max`; otherwise return the count."

[[hints]]
text = "`return playerCount < min ? min : (playerCount > max ? max : playerCount);` is the one-line form."

[[hints]]
text = "`trend`: `if (delta < 0) return -1;` then `if (delta > 0) return 1;` then `return 0;`."

[[points]]
after = 1
prompt = "Which operator means \"and\"?"
pick = ["||", "&&", "!", "=="]
answer = 1

[[points]]
after = 3
prompt = "Write the ternary."
code = "String label = ___;"
blank = "playerCount == 1 ? \"player\" : \"players\""
