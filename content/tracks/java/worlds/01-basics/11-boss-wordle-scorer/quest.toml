title = "Boss: Wordle scorer"
summary = "Score a guess against a target word: green, yellow or gray, with duplicate letters handled right."
kind = "boss"
xp = 350
minutes = 45
tags = ["boss", "strings", "arrays", "loops"]

[[objectives]]
test = "allGreenOnExactMatch"
label = "score returns GGGGG when the guess is the target"

[[objectives]]
test = "yellowForWrongPosition"
label = "a letter in the word but in the wrong place is Y, a missing letter is ."

[[objectives]]
test = "duplicateLettersScoredOnce"
label = "a repeated letter is only Y as many times as the target has it"

[[objectives]]
test = "rendersEmojiRow"
label = "render turns G/Y/. into a row of green, yellow and black squares"

[[hints]]
text = "Start with the easy win: if `guess.equals(target)`, return `\"GGGGG\"`. That alone turns the first objective green."

[[hints]]
text = "For the general case, make a `char[] result` of five `'.'` (`Arrays.fill`). First pass: for every position `i`, if `guess.charAt(i) == target.charAt(i)`, set `result[i] = 'G'`."

[[hints]]
text = "Yellow needs to know which target letters are still *unclaimed*. Make `int[] remaining = new int[26]` and, in the first pass, count every target letter that was **not** green: `remaining[target.charAt(i) - 'a']++`."

[[hints]]
text = "Second pass over the guess: for every position that is not green, if `remaining[guess.charAt(i) - 'a'] > 0` the letter is yellow: set `'Y'` and decrement that count."

[[hints]]
text = "Why two passes? Greens must claim their letters first. In \"eerie\" vs \"crane\" the last `e` is green, so the first two `e`s find nothing left and stay gray."

[[hints]]
text = "`render`: loop over the score string with a `StringBuilder` and `switch` on each char: `'G'` -> `GREEN`, `'Y'` -> `YELLOW`, anything else -> `GRAY`. The constants are already in the starter."

[[points]]
after = 9
prompt = "Which index holds letter c in the tally?"
pick = ["c - 'a'", "c + 'a'", "'a' - c", "c"]
answer = 0

[[points]]
after = 12
prompt = "Fill every slot with a dot."
code = "Arrays.fill(row, ___);"
blank = "'.'"
