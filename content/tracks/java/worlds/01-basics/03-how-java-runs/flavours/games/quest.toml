title = "How the status bot runs"
summary = "Source to bytecode to JVM, with a bot that has to stay up."

[[quiz]]
question = "The status bot's `.java` files get compiled by `javac`. Into what?"
choices = ["Bytecode in .class files", "Machine code for your CPU only", "A Discord token"]
answer = 0

[[quiz]]
question = "The bot is slow right after start and fast after a minute. Why?"
choices = ["Discord throttles brand new bots", "The JIT speeds up hot methods", "javac optimises the bytecode later"]
answer = 1

[[quiz]]
question = "The bot builds a new `StatusLine` every ten seconds. What about the old ones?"
choices = ["You must delete each one by hand, one at a time", "They pile up until the bot restarts", "The garbage collector frees them"]
answer = 2
