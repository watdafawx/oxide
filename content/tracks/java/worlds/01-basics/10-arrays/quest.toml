title = "Arrays"
summary = "Find the largest, reverse in place, and flip a grid."
kind = "exercise"
xp = 60
minutes = 12
tags = ["arrays"]

[[objectives]]
test = "maxFindsLargest"
label = "max returns the largest element, even when all are negative"

[[objectives]]
test = "reverseInPlaceMutates"
label = "reverseInPlace changes the array it was given"

[[objectives]]
test = "transposeSwapsRowsAndCols"
label = "transpose swaps rows and columns of a 2D array"

[[hints]]
text = "`max`: start with `int best = values[0];`, not 0, then loop and keep the larger one."

[[hints]]
text = "`reverseInPlace`: swap `values[i]` with `values[values.length - 1 - i]`, for `i` only up to half the length."

[[hints]]
text = "A swap needs a temp: `int tmp = values[i]; values[i] = values[j]; values[j] = tmp;`."

[[hints]]
text = "`transpose`: result is `new int[cols][rows]` where `rows = grid.length` and `cols = grid[0].length`; copy `result[c][r] = grid[r][c]`."
