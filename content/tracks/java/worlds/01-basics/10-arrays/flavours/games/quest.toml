title = "Player history"
summary = "Find the peak, put newest samples first, and flip a servers-by-hours grid."

[[objectives]]
test = "peakFindsLargestSample"
label = "peak returns the highest player count, even when every sample is negative"

[[objectives]]
test = "newestFirstReversesInPlace"
label = "newestFirst reverses the array it was given"

[[objectives]]
test = "hourlyGridSwapsRowsAndCols"
label = "byHour swaps servers and hours in a 2D array"

[[hints]]
text = "`peak`: start with `int best = samples[0];`, not 0, then loop and keep the larger one."

[[hints]]
text = "`newestFirst`: swap `samples[i]` with `samples[samples.length - 1 - i]`, for `i` only up to half the length."

[[hints]]
text = "A swap needs a temp: `int tmp = samples[i]; samples[i] = samples[j]; samples[j] = tmp;`."

[[hints]]
text = "`byHour`: result is `new int[hours][servers]`, where `servers = grid.length` and `hours = grid[0].length`; copy `result[h][s] = grid[s][h]`."
