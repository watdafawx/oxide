title = "MOTD tricks"
summary = "Flip a MOTD, spot palindromes, and only announce a MOTD that really changed."

[[objectives]]
test = "flipsMotdBackwards"
label = "flip returns the characters in the opposite order"

[[objectives]]
test = "palindromeMotdIgnoresCaseAndSpaces"
label = "isPalindrome ignores case and spaces"

[[objectives]]
test = "sameMotdComparesContent"
label = "sameMotd compares content, not identity"

[[hints]]
text = "`flip`: `new StringBuilder(motd).reverse().toString()` is the short way. A loop from `length() - 1` down to 0 works too."

[[hints]]
text = "`isPalindrome`: build a cleaned copy with `motd.replace(\" \", \"\").toLowerCase()`, then compare it with its own flip (use `equals`)."

[[hints]]
text = "`sameMotd`: `a.equals(b)`. `==` asks \"same object?\", `equals` asks \"same characters?\"."

[[points]]
after = 1
prompt = "Keep the upper-cased result."
code = "motd = ___;"
blank = "motd.toUpperCase()"

[[points]]
after = 2
prompt = "Which method compares text?"
pick = ["==", "equals", "substring", "replace"]
answer = 1
