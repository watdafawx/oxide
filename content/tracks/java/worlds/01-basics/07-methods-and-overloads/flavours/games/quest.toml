title = "Small methods for the status line"
summary = "Overload show() for counts, flags and text; total players over any number of servers."

[[objectives]]
test = "showPicksByArgumentType"
label = "show(int), show(boolean) and show(String) each format their own value"

[[objectives]]
test = "totalPlayersSumsAnyNumberOfServers"
label = "totalPlayers(int...) adds any number of counts, including none"

[[hints]]
text = "Three methods can share the name `show` if their parameter lists differ. Java picks by the argument you pass."

[[hints]]
text = "`show(int playerCount)`: `playerCount + \" online\"`. `show(boolean online)`: `online ? \"ONLINE\" : \"OFFLINE\"`. `show(String motd)`: `\"MOTD: \" + motd`."

[[hints]]
text = "`int... perServer` behaves like an `int[]` inside: loop over it with `for (int n : perServer)`."
