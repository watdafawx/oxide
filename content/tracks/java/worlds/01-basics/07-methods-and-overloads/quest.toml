title = "Overloads and varargs"
summary = "Same method name, different parameters; and a method that takes any number of ints."
kind = "exercise"
xp = 45
minutes = 8
tags = ["methods", "overloads"]

[[objectives]]
test = "overloadPicksByType"
label = "area(int), area(int, int) and area(double) each do their own thing"

[[objectives]]
test = "varargsSumsAny"
label = "sum(int...) adds any number of values, including none"

[[hints]]
text = "Three methods can share the name `area` if their parameter lists differ. Java picks by the arguments you pass."

[[hints]]
text = "`area(int side)`: `side * side`. `area(int w, int h)`: `w * h`. `area(double radius)`: `Math.PI * radius * radius`."

[[hints]]
text = "`int... nums` behaves like an `int[]` inside: loop over it with `for (int n : nums)`."

[[points]]
after = 3
prompt = "What is nums inside int... nums?"
pick = ["int", "int[]", "List", "String"]
answer = 1

[[points]]
after = 3
prompt = "Declare the varargs parameter."
code = "static int sum(___ nums) {"
blank = "int..."
