title = "equals, not =="
summary = "Compare two texts by their characters."
kind = "exercise"
xp = 35
minutes = 4
tags = ["strings", "equals"]

[[objectives]]
test = "sameTextComparesContent"
label = "sameText compares content, not identity"
[[objectives]]
test = "sameIgnoringCaseSkipsCapitals"
label = "sameIgnoringCase treats Java and JAVA as the same"

[[hints]]
text = "Both methods are in `TextCompare`. The first one uses `==`, which is the bug."
[[hints]]
text = "`return a.equals(b);` and `return a.equalsIgnoreCase(b);`"

[[points]]
after = 2
prompt = "Which asks \"same characters?\""
pick = ["a.equals(b)", "a == b", "a = b", "a.same(b)"]
answer = 0
[[points]]
after = 4
prompt = "Compare ignoring capitals."
code = "return a.___(b);"
blank = "equalsIgnoreCase"
