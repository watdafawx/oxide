title = "Sets: no duplicates"
summary = "Turn a sentence into its distinct words with a HashSet."
kind = "exercise"
xp = 30
minutes = 4
tags = ["set", "hashset"]

[[objectives]]
test = "uniqueWordsDropsDuplicates"
label = "uniqueWords returns each lowercase word once"

[[hints]]
text = "Lowercase first so \"The\" and \"the\" match: `text.toLowerCase()`."
[[hints]]
text = "`split(\" \")` gives a `String[]`. `Arrays.asList(array)` turns it into a list."
[[hints]]
text = "`return new HashSet<>(Arrays.asList(text.toLowerCase().split(\" \")));` The set drops the repeats for you."

[[points]]
after = 2
prompt = "Which type holds each value at most once?"
pick = ["List", "Set", "Map", "Stream"]
answer = 1

[[points]]
after = 3
prompt = "Dedupe the list in one go."
code = "Set<String> unique = ___;"
blank = "new HashSet<>(list)"
