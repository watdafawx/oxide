title = "Boss: The Update Report"
summary = "Parse a modpack file, then answer questions with streams: mods per loader, most downloaded, outdated per loader."
kind = "boss"
xp = 350
minutes = 50
tags = ["stream", "collectors", "boss"]

[[objectives]]
test = "parsesModLine"
label = "parseMod splits \"sodium,Sodium,fabric,9500,0.5.3\" into a Mod"
[[objectives]]
test = "countsModsPerLoader"
label = "countsPerLoader counts how many mods each loader has"
[[objectives]]
test = "topModsRanked"
label = "topDownloaded lists the n most downloaded mod names, most first, ties A-Z"
[[objectives]]
test = "outdatedPerLoaderSorted"
label = "outdatedPerLoader counts outdated mods per loader, loaders in A-Z order"

[[hints]]
text = "parseMod: `line.split(\",\")` gives 5 parts. Downloads is a number: `Integer.parseInt(parts[3])`. Then `new Mod(parts[0], parts[1], parts[2], downloads, parts[4])`."
[[hints]]
text = "countsPerLoader: `mods.stream().collect(groupingBy(Mod::loader, counting()))`."
[[hints]]
text = "topDownloaded, step 1: you only need a sorted stream: `mods.stream().sorted(...)`."
[[hints]]
text = "topDownloaded, step 2: the comparator is `Comparator.comparingInt(Mod::downloads).reversed().thenComparing(Mod::name)`."
[[hints]]
text = "topDownloaded, step 3: `.limit(n).map(Mod::name).toList()`."
[[hints]]
text = "outdatedPerLoader: `filter` the outdated mods (`!m.version().equals(latest.get(m.id()))`), then `groupingBy(Mod::loader, TreeMap::new, counting())`. The middle argument picks a TreeMap, which keeps the loaders sorted."
