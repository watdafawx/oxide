title = "Boss: Log Analyzer"
summary = "Parse server log lines, then answer questions about them with streams: levels, noisiest sources, errors per minute."
kind = "boss"
xp = 350
minutes = 50
tags = ["stream", "collectors", "boss"]

[[objectives]]
test = "parsesLine"
label = "parse splits \"10:15:30 ERROR db Connection refused\" into time, level, source and message"
[[objectives]]
test = "countsPerLevel"
label = "countsPerLevel counts how many lines each level has"
[[objectives]]
test = "topSourcesRanked"
label = "topSources lists the n noisiest sources, most lines first, ties A-Z"
[[objectives]]
test = "errorsPerMinuteBucketed"
label = "errorsPerMinute counts ERROR lines per HH:mm, in time order"

[[hints]]
text = "parse: `line.split(\" \", 4)` cuts into at most 4 parts, so the message keeps its spaces. Build `new LogLine(parts[0], parts[1], parts[2], parts[3])`."
[[hints]]
text = "countsPerLevel: `lines.stream().collect(groupingBy(LogLine::level, counting()))`."
[[hints]]
text = "topSources, step 1: count per source with the same `groupingBy(LogLine::source, counting())`. You get a `Map<String, Long>`."
[[hints]]
text = "topSources, step 2: stream the map's `entrySet()` and sort. `Comparator<Map.Entry<String, Long>> byCount = Map.Entry.comparingByValue();` then `.sorted(byCount.reversed().thenComparing(Map.Entry::getKey))`."
[[hints]]
text = "topSources, step 3: `.limit(n).map(Map.Entry::getKey).toList()`."
[[hints]]
text = "errorsPerMinute: `filter` level ERROR, then `groupingBy(l -> l.time().substring(0, 5), TreeMap::new, counting())`. The middle argument picks a TreeMap, which keeps the minutes sorted."
