title = "flatMap, reduce, and Optional max"
summary = "Flatten lists of lists, fold numbers into one with reduce, and handle max on an empty stream."
kind = "exercise"
xp = 65
minutes = 12
tags = ["stream", "flatmap", "reduce", "optional"]

[[objectives]]
test = "flattensNestedLists"
label = "flatten turns a list of lists into one list"
[[objectives]]
test = "reducesProduct"
label = "product(n) multiplies 1 * 2 * ... * n with IntStream.rangeClosed and reduce"
[[objectives]]
test = "maxOfEmptyIsEmpty"
label = "largest returns an Optional: the biggest number, or empty for an empty list"

[[hints]]
text = "flatten: each inner list becomes a stream, and `flatMap` glues them together: `lists.stream().flatMap(List::stream).toList()`"
[[hints]]
text = "product: `IntStream.rangeClosed(1, n)` is 1..n inclusive. `reduce(1, (a, b) -> a * b)` starts at 1 and multiplies each number in."
[[hints]]
text = "Why start at 1? It is the identity for multiplication, so product(0) is 1 (an empty range just returns the start value)."
[[hints]]
text = "largest: `nums.stream().max(Comparator.naturalOrder())` returns an `Optional<Integer>`. Empty stream, empty Optional."
