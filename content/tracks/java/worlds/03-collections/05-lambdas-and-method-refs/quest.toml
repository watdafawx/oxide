title = "Lambdas and method references"
summary = "Pass behaviour around: a Predicate you build, and the same Function as a lambda and a method reference."
kind = "exercise"
xp = 45
minutes = 8
tags = ["lambda", "functional"]

[[objectives]]
test = "appliesPredicate"
label = "longerThan(n) returns a Predicate that is true for words longer than n"
[[objectives]]
test = "methodRefEqualsLambda"
label = "lengthByLambda and lengthByMethodRef both map a word to its length"

[[hints]]
text = "A `Predicate<String>` is just a function from String to boolean. A lambda looks like `s -> s.length() > 3`."
[[hints]]
text = "longerThan(n) returns the lambda: `return s -> s.length() > n;` (it can use `n`, which does not change)."
[[hints]]
text = "lengthByLambda: `return s -> s.length();`"
[[hints]]
text = "lengthByMethodRef: `return String::length;` Same thing, shorter, because the lambda only calls one method."
