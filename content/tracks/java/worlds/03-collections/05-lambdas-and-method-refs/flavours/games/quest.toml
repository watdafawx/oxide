title = "Is this mod outdated?"
summary = "Build an outdated-mod Predicate, and write a name Function as a lambda and as a method reference."

[[objectives]]
test = "appliesOutdatedPredicate"
label = "isOutdated(latest) is true for mods whose version differs from the latest one"
[[objectives]]
test = "methodRefEqualsLambdaForModNames"
label = "nameByLambda and nameByMethodRef both map a Mod to its name"

[[hints]]
text = "A `Predicate<Mod>` is a function from Mod to boolean. A lambda looks like `mod -> mod.version().equals(\"1.0\")`."
[[hints]]
text = "Look the latest version up in the map by id: `latestById.get(mod.id())`."
[[hints]]
text = "isOutdated: `return mod -> !mod.version().equals(latestById.get(mod.id()));`"
[[hints]]
text = "nameByLambda: `return mod -> mod.name();`  nameByMethodRef: `return Mod::name;` Same thing, shorter."
