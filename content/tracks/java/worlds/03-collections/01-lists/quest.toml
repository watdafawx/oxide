title = "Lists that grow"
summary = "Remove from an ArrayList by index and by value, and watch it grow past its first size."
kind = "exercise"
xp = 40
minutes = 4
tags = ["list", "arraylist"]
requires = []

[[objectives]]
test = "removesByIndexAndValue"
label = "removeIndexAndValue drops the element at an index and the first element equal to a value"
[[objectives]]
test = "listGrowsPastInitialSize"
label = "labels(100) builds a list of 100 labels in a loop"

[[hints]]
text = "Input lists may be read-only (`List.of`). Start with `List<Integer> copy = new ArrayList<>(nums);` and change the copy."
[[hints]]
text = "`copy.remove(index)` removes the element AT that position."
[[hints]]
text = "For a value, `copy.remove(value)` would be read as an index. Box it: `copy.remove(Integer.valueOf(value));`"
[[hints]]
text = "labels: `List<String> out = new ArrayList<>(2);` then `for (int i = 0; i < count; i++) out.add(\"item\" + i);` and return `out`."

[[points]]
after = 2
prompt = "Which method appends to a list?"
pick = ["add", "put", "push", "append"]
answer = 0

[[points]]
after = 3
prompt = "Create an empty list."
code = "List<String> names = ___;"
blank = "new ArrayList<>()"
