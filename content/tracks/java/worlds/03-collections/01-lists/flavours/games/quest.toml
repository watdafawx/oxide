title = "Remove mods by slot or by id"
summary = "Drop a mod from the list by slot and by project id, and grow the list past its first size."

[[objectives]]
test = "dropsModBySlotAndByProjectId"
label = "dropMods removes the mod in a slot and the mod with a project id"
[[objectives]]
test = "modListGrowsPastInitialSize"
label = "placeholderNames(100) builds a list of 100 mod names in a loop"

[[hints]]
text = "The input may be `List.of(...)`, which is read-only. Start with `List<Integer> copy = new ArrayList<>(projectIds);`."
[[hints]]
text = "`copy.remove(slot)` removes the mod AT that slot."
[[hints]]
text = "For an id, `copy.remove(projectId)` would be read as a slot. Box it: `copy.remove(Integer.valueOf(projectId));`"
[[hints]]
text = "placeholderNames: `List<String> out = new ArrayList<>(2);` then `for (int i = 0; i < count; i++) out.add(\"mod\" + i);` and return `out`."
