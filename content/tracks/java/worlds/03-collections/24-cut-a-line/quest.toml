title = "Cut a line"
summary = "split cuts text at a separator into an array; a limit keeps the rest of the line in one piece."
kind = "exercise"
xp = 35
minutes = 5
tags = ["string", "split", "parsing"]

[[objectives]]
test = "wordsCutsAtSpaces"
label = "words cuts a sentence at its spaces into a list of words"
[[objectives]]
test = "messageKeepsItsSpaces"
label = "messageOf returns the fourth part of a log line, spaces and all"

[[hints]]
text = "words: `text.split(\" \")` gives a `String[]`; `List.of(...)` turns it into a list. messageOf: `split` with a limit of 4, then the part at index 3."
[[hints]]
text = "`return List.of(text.split(\" \"));` and `return line.split(\" \", 4)[3];`"

[[points]]
after = 1
prompt = "What type does split hand back?"
pick = ["List<String>", "String[]", "Set<String>", "String"]
answer = 1
[[points]]
after = 3
prompt = "Cut into at most 4 parts."
code = "String[] parts = line.split(\" \", ___);"
blank = "4"
