title = "Lock the mod list"
summary = "List.of is read-only, and List.copyOf snapshots the pack before an update touches it."

[[objectives]]
test = "lockedLoaderListIsReadOnly"
label = "supportedLoaders returns a list that throws when you add to it"
[[objectives]]
test = "snapshotDetachesFromLiveList"
label = "snapshot copies the mod list so later changes to the live list do not show up"

[[hints]]
text = "`List.of(\"fabric\", \"forge\", \"neoforge\", \"quilt\")` makes a read-only list. Return it directly."
[[hints]]
text = "snapshot: `return List.copyOf(live);` It copies the elements, so the snapshot no longer follows the live list."
