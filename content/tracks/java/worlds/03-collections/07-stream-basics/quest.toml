title = "Your first stream"
summary = "Filter, map and collect a list in one pipeline, then add numbers with mapToInt."
kind = "exercise"
xp = 50
minutes = 8
tags = ["stream", "filter", "map"]

[[objectives]]
test = "filtersEvenSquares"
label = "evenSquares keeps the even numbers and squares them"
[[objectives]]
test = "sumsWithMapToInt"
label = "totalLength adds up the lengths of all words"

[[hints]]
text = "Start from the list: `nums.stream()`. End with `.toList()`."
[[hints]]
text = "`.filter(n -> n % 2 == 0)` keeps evens, `.map(n -> n * n)` squares them."
[[hints]]
text = "evenSquares: `return nums.stream().filter(n -> n % 2 == 0).map(n -> n * n).toList();`"
[[hints]]
text = "totalLength: turn each word into an int with `.mapToInt(String::length)` and finish with `.sum()`."

[[points]]
after = 3
prompt = "Which step keeps matching items?"
pick = ["map", "filter", "limit", "count"]
answer = 1

[[points]]
after = 5
prompt = "Turn each word into its length as an IntStream."
code = "int letters = words.stream().___(String::length).sum();"
blank = "mapToInt"
