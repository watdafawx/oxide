title = "Which mods are outdated?"
summary = "Filter outdated mods and map them to names in one pipeline, then total downloads with mapToInt."

[[objectives]]
test = "filtersOutdatedModNames"
label = "outdatedNames lists the names of mods that are not on the latest version"
[[objectives]]
test = "sumsDownloadsWithMapToInt"
label = "totalDownloads adds up the downloads of every mod"

[[hints]]
text = "Start from the list: `mods.stream()`. End with `.toList()`."
[[hints]]
text = "Outdated means `!mod.version().equals(latest.get(mod.id()))`. Put that in `.filter(...)`."
[[hints]]
text = "outdatedNames: `return mods.stream().filter(m -> !m.version().equals(latest.get(m.id()))).map(Mod::name).toList();`"
[[hints]]
text = "totalDownloads: turn each mod into an int with `.mapToInt(Mod::downloads)` and finish with `.sum()`."
