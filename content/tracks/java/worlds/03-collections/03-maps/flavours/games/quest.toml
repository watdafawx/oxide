title = "Downloads by mod id"
summary = "Count downloads per mod id with merge, and index mod names by first letter with computeIfAbsent."

[[objectives]]
test = "countsDownloadsPerModId"
label = "countDownloads returns how many downloads each mod id got"
[[objectives]]
test = "indexesModNamesByFirstLetter"
label = "indexByLetter maps each first letter to its mod names, in input order"

[[hints]]
text = "`Map<String, Integer> counts = new HashMap<>();` then loop over the log."
[[hints]]
text = "Old way: `counts.put(id, counts.getOrDefault(id, 0) + 1);`"
[[hints]]
text = "Better: `counts.merge(id, 1, Integer::sum);` (put 1 if absent, otherwise combine old and new with `sum`)."
[[hints]]
text = "indexByLetter: `Map<Character, List<String>> index = new HashMap<>();` and per name `index.computeIfAbsent(name.charAt(0), k -> new ArrayList<>()).add(name);`"
