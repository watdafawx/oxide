title = "Change each item"
summary = "Turn every mod into its name with map, and keep only the top few with limit."

[[objectives]]
test = "namesTurnsModsIntoNames"
label = "names turns every mod into its name, in order"
[[objectives]]
test = "topThreeKeepsTheFirstThreeNames"
label = "topThree returns the names of the first three mods, or fewer when there are fewer"

[[hints]]
text = "names: `mods.stream().map(Mod::name).toList()`. topThree: the same pipeline with `.limit(3)` before the `map`."
[[hints]]
text = "`return ranked.stream().limit(3).map(Mod::name).toList();`"

[[points]]
after = 1
prompt = "Which step turns every item into something else?"
pick = ["map", "filter", "limit", "toList"]
answer = 0
[[points]]
after = 3
prompt = "Keep the first five."
code = "mods.stream().___(5).toList();"
blank = "limit"
