title = "Sorting with comparators"
summary = "Sort by length then alphabet, and by score high to low, with Comparator.comparing."
kind = "exercise"
xp = 50
minutes = 8
tags = ["sort", "comparator"]

[[objectives]]
test = "sortsByLengthThenAlpha"
label = "byLengthThenAlpha sorts by length, ties broken alphabetically"
[[objectives]]
test = "sortsDescendingByScore"
label = "byScoreDescending puts the highest score first"

[[hints]]
text = "Never sort the caller's list. Copy it first: `List<String> copy = new ArrayList<>(words);` then `copy.sort(...)`."
[[hints]]
text = "`Comparator.comparingInt(String::length)` orders by length."
[[hints]]
text = "Add the tie-break with `.thenComparing(Comparator.naturalOrder())`."
[[hints]]
text = "Players: `Comparator.comparingInt(Player::score).reversed()` flips the order to high-to-low."
