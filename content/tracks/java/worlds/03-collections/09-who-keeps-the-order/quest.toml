title = "Who keeps the order?"
summary = "HashMap, LinkedHashMap and TreeMap loop in different orders. Know which promise you get, and how hashing finds a key."
kind = "read"
xp = 15
minutes = 4
tags = ["map", "set", "hashing"]

[[quiz]]
question = "You put words into a `HashMap` and loop over it. What order do the keys come out in?"
choices = ["Insertion order, as you put them in", "No order is promised", "Sorted order, A to Z"]
answer = 1

[[quiz]]
question = "A menu must print in the order the dishes were added. Which map keeps that?"
choices = ["HashMap", "TreeMap", "LinkedHashMap"]
answer = 2

[[quiz]]
question = "Two keys are `equals`. What must be true of their `hashCode()`?"
choices = ["They must be equal too", "Nothing: the two are unrelated", "They must differ"]
answer = 0
