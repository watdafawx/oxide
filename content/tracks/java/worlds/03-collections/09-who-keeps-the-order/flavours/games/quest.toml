title = "Who keeps the pack order?"
summary = "HashMap, LinkedHashMap and TreeMap loop in different orders. Know which promise you get, and how hashing finds a mod."

[[quiz]]
question = "You keep a `HashMap` from mod id to version and loop over it to print the pack. What order do the ids come out in?"
choices = ["Install order, as you added them", "No order is promised", "Alphabetical by mod id"]
answer = 1

[[quiz]]
question = "The update report must list mods in the order they appear in the pack file. Which map keeps that?"
choices = ["HashMap", "TreeMap", "LinkedHashMap"]
answer = 2

[[quiz]]
question = "Two mod ids are `equals`. What must be true of their `hashCode()`?"
choices = ["They must be equal too", "Nothing: the two are unrelated", "They must differ"]
answer = 0
