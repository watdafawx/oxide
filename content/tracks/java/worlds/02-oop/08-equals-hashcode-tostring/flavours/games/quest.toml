title = "Positions that compare by value"
summary = "Write equals, hashCode and toString for BlockPos so a HashSet finds the same block twice."

[[objectives]]
test = "samePositionIsEqual"
label = "Two BlockPos with the same x, y, z are equal; any difference makes them unequal"

[[objectives]]
test = "hashSetFindsEqualPosition"
label = "Equal positions have equal hash codes, so a HashSet and a HashMap find them"

[[objectives]]
test = "toStringReadsLikeAChatCoordinate"
label = "toString() prints (10, 64, -3), not BlockPos@1b2c3d"

[[hints]]
text = "In `equals`: `if (this == o) return true; if (!(o instanceof BlockPos other)) return false;` then compare the three ints with `==`."

[[hints]]
text = "`return x == other.x && y == other.y && z == other.z;`"

[[hints]]
text = "`hashCode` must use the same fields as `equals`: `return Objects.hash(x, y, z);`"

[[hints]]
text = "`toString`: `\"(\" + x + \", \" + y + \", \" + z + \")\"`."
