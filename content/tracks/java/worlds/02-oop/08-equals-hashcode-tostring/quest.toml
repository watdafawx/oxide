title = "Same value, same object"
summary = "Write equals, hashCode and toString for Money so a HashSet finds equal amounts."
kind = "exercise"
xp = 65
minutes = 12
tags = ["equals", "hashcode", "tostring"]

[[objectives]]
test = "equalsComparesFields"
label = "Two Money objects with the same cents and currency are equal; different ones are not"

[[objectives]]
test = "hashCodeMatchesEquals"
label = "Equal Money objects have equal hash codes, so a HashSet finds them"

[[objectives]]
test = "toStringIsReadable"
label = "toString() prints 12.50 EUR, not Money@1b2c3d"

[[hints]]
text = "In `equals`: `if (this == o) return true; if (!(o instanceof Money other)) return false;` then compare the fields."

[[hints]]
text = "Compare `cents` with `==` and `currency` with `currency.equals(other.currency)` (or `Objects.equals`)."

[[hints]]
text = "`hashCode` must use the same fields as `equals`: `return Objects.hash(cents, currency);`"

[[hints]]
text = "`toString`: `String.format(\"%d.%02d %s\", cents / 100, cents % 100, currency)`. `%02d` pads with a zero: 5 cents becomes `05`."
