title = "Text you can read"
summary = "Override toString so a Money prints as 12.50 EUR, not Money@1b2c3d."
kind = "exercise"
xp = 35
minutes = 4
tags = ["tostring", "object"]

[[objectives]]
test = "toStringIsReadable"
label = "toString() is \"12.50 EUR\", and 5 cents is \"0.05 USD\""
[[objectives]]
test = "joiningTextUsesToString"
label = "\"Total: \" + price reads \"Total: 9.90 EUR\""

[[hints]]
text = "Whole euros are `cents / 100`, the rest is `cents % 100`. `String.format` with `%02d` pads the cents to two digits."
[[hints]]
text = "`return String.format(\"%d.%02d %s\", cents / 100, cents % 100, currency);`"

[[points]]
after = 1
prompt = "What does an object print as before you override toString?"
pick = ["Its fields", "Its class name and a number", "Nothing", "An error"]
answer = 1
[[points]]
after = 3
prompt = "Pad 5 to \"05\"."
code = "String.format(\"___\", 5)"
blank = "%02d"
