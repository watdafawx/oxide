title = "One counter for the whole class"
summary = "Hand out unique ticket ids with a static counter and a static factory Ticket.of(...)."
kind = "exercise"
xp = 45
minutes = 8
tags = ["static", "factory"]

[[objectives]]
test = "staticFactoryBuildsInstance"
label = "Ticket.of(\"Fix login\") returns a Ticket with that title"

[[objectives]]
test = "idsAreUniquePerInstance"
label = "Every Ticket gets the next id: 1, 2, 3..."

[[hints]]
text = "`of` is a normal `return new Ticket(title);`. The constructor is private, so callers must use `of`."

[[hints]]
text = "`static int nextId = 1;` belongs to the class, not to one Ticket: every ticket sees the same variable."

[[hints]]
text = "In the constructor: `this.id = nextId++;` uses the current value and then adds one."

[[points]]
after = 2
prompt = "Which keyword gives one copy for the whole class?"
pick = ["final", "static", "private", "new"]
answer = 1

[[points]]
after = 3
prompt = "Add one first, then hand out the number."
code = "number = ___issued;"
blank = "++"
