title = "Entity ids and Mob.spawn"
summary = "Give every mob a unique entity id from a static counter, built through Mob.spawn(kind)."

[[objectives]]
test = "spawnBuildsNamedMob"
label = "Mob.spawn(\"zombie\") returns a Mob of that kind"

[[objectives]]
test = "everyMobGetsItsOwnEntityId"
label = "Every spawned mob gets the next entity id: 1, 2, 3..."

[[hints]]
text = "`spawn` is a normal `return new Mob(kind);`. The constructor is private, so callers must use `spawn`."

[[hints]]
text = "`static int nextId = 1;` belongs to the class, not to one Mob: every mob sees the same variable."

[[hints]]
text = "In the constructor: `this.id = nextId++;` uses the current value and then adds one."
