title = "A switch the compiler checks"
summary = "Seal Shape to Circle, Rectangle and Triangle records, then switch over them with guards and record patterns."
kind = "exercise"
xp = 70
minutes = 12
tags = ["sealed", "pattern-matching", "switch"]

[[objectives]]
test = "exhaustiveSwitchComputesArea"
label = "Shapes.area handles Circle, Rectangle and Triangle with no default branch"

[[objectives]]
test = "guardedPatternHandlesZero"
label = "Shapes.describe says \"a dot\" for a Circle of radius 0, and names every other shape"

[[objectives]]
test = "recordPatternDeconstructs"
label = "Shapes.isSquare unpacks a Rectangle(w, h) right in the case label"

[[hints]]
text = "`area`: `return switch (shape) { case Circle c -> Math.PI * c.radius() * c.radius(); case Rectangle r -> r.width() * r.height(); case Triangle t -> t.base() * t.height() / 2; };`"

[[hints]]
text = "Do not add `default`: `Shape` is sealed, so the compiler knows the three cases are all of them."

[[hints]]
text = "`describe`: put the guarded case first: `case Circle c when c.radius() == 0 -> \"a dot\";` then `case Circle c -> \"a circle\";` and the other two. The other order is a compile error (the first case would swallow the guard)."

[[hints]]
text = "`isSquare`: `case Rectangle(double w, double h) -> w == h;` takes the record apart; the other two cases return `false`."

[[hints]]
text = "Record pattern variables can be `var`: `case Rectangle(var w, var h) -> w == h;`."
