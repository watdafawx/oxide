title = "Keep your fields private"
summary = "Why fields are private and how a getter can still leak the object's insides."
kind = "read"
xp = 15
minutes = 4
tags = ["encapsulation"]

[[quiz]]
question = "A class has `private int count;` and a getter `getCount()`, but no setter. Who can change `count` from outside the class?"
choices = ["Any class, with `c.count = 5;`", "Nobody: only methods of the class itself can", "Only subclasses"]
answer = 1

[[quiz]]
question = "`public List<String> getTags() { return tags; }` hands out the real `tags` list. What can a caller do?"
choices = ["Nothing: lists are copied on return in Java", "Call `getTags().add(\"x\")` and change the object behind its back", "Only read it, because the field is private"]
answer = 1

[[quiz]]
question = "Which version of that getter stops the leak?"
choices = ["`return tags;` but rename the method", "`return List.copyOf(tags);`", "`return (List<String>) tags;`"]
answer = 1
