title = "Keep your fields private"
summary = "Why fields are private and how a getter can still leak the object's insides."
kind = "read"
xp = 15
minutes = 4
tags = ["encapsulation"]

[[quiz]]
question = "A class has `private int count;` and a getter `getCount()`, but no setter. Who can change `count` from outside the class?"
choices = ["Only the class's own methods", "Any class, with `c.count = 5;`", "Only subclasses and nearby classes"]
answer = 0

[[quiz]]
question = "`public List<String> getTags() { return tags; }` hands out the real `tags` list. What can a caller do?"
choices = ["Nothing: Java copies lists on return", "Change it with `getTags().add(\"x\")`", "Only read it, since the field is private"]
answer = 1

[[quiz]]
question = "Which version of that getter stops the leak?"
choices = ["`return tags;` but rename the method", "`return (List<String>) tags;`", "`return List.copyOf(tags);`"]
answer = 2
