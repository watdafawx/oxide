title = "Pay everyone, ask nobody's type"
summary = "Abstract Employee.monthlyPay(), two subtypes, and a Payroll that sums a mixed list without instanceof."
kind = "exercise"
xp = 60
minutes = 10
tags = ["polymorphism", "abstract"]

[[objectives]]
test = "abstractMethodImplementedBySubtypes"
label = "Salaried pays yearly / 12 and Hourly pays rate * hours"

[[objectives]]
test = "payrollSumsAllSubtypes"
label = "Payroll.total adds up a mixed list, including a subtype it has never seen"

[[hints]]
text = "`Salaried.monthlyPay()` is `yearlyPay / 12`; `Hourly.monthlyPay()` is `hourlyRate * hours`."

[[hints]]
text = "`Payroll.total` is a loop: `int sum = 0; for (Employee e : staff) { sum += e.monthlyPay(); } return sum;`"

[[hints]]
text = "Do not ask `e instanceof Salaried`. Just call `e.monthlyPay()`: Java runs the right version for each object."

[[hints]]
text = "The test slips in a new kind of Employee that Payroll has never heard of. Only the loop-and-call version survives that."
