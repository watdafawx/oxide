title = "Thirty lines in one"
summary = "Turn the Parcel class into a record: equals, hashCode, toString for free, plus validation and a with-method."
kind = "exercise"
xp = 55
minutes = 8
tags = ["records", "immutability"]

[[objectives]]
test = "recordEqualsByValue"
label = "Parcel is a record: equal by value, toString shows the fields"

[[objectives]]
test = "compactConstructorRejectsNegative"
label = "new Parcel(label, -1) throws IllegalArgumentException"

[[objectives]]
test = "withMethodReturnsCopy"
label = "withGrams(n) returns a new Parcel and leaves the original alone"

[[hints]]
text = "Change `public final class Parcel { ... }` to `public record Parcel(String label, int grams) { ... }` and delete the fields, constructor and accessors: the record writes them for you."

[[hints]]
text = "The compact constructor has no parameter list: `public Parcel { if (grams < 0) throw new IllegalArgumentException(...); }`. It runs before the fields are set."

[[hints]]
text = "`public Parcel withGrams(int grams) { return new Parcel(label, grams); }`: inside a record you can read the fields directly."

[[hints]]
text = "Records are immutable: there is no setter, so \"changing\" a value means building a new record."
