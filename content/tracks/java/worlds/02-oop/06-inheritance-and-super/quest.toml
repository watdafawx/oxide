title = "A Dog is an Animal"
summary = "Extend Animal with Dog: override sound() and extend describe() with super."
kind = "exercise"
xp = 55
minutes = 10
tags = ["inheritance", "super"]

[[objectives]]
test = "dogOverridesSound"
label = "A Dog's sound() is \"Woof\""

[[objectives]]
test = "superCallKeepsBaseBehaviour"
label = "Dog.describe() is the Animal text plus \" and wags its tail\", built with super.describe()"

[[hints]]
text = "Add `@Override public String sound() { return \"Woof\"; }` to `Dog`."

[[hints]]
text = "`Animal.describe()` already builds \"Rex says ...\" from `name()` and `sound()`: it will pick up the Dog's sound by itself."

[[hints]]
text = "In `Dog`, override `describe()` and start from the parent: `return super.describe() + \" and wags its tail\";`."

[[points]]
after = 2
prompt = "Which keyword means \"is a\"?"
pick = ["implements", "extends", "super", "this"]
answer = 1

[[points]]
after = 4
prompt = "Run the parent constructor first."
code = "public Car(String name) { ___(name); }"
blank = "super"
