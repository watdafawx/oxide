title = "Anything that can be hurt"
summary = "Finish the Damageable interface: a default status(), plus Zombie and ArmorStand."

[[objectives]]
test = "zombieLosesHealthWhenDamaged"
label = "Zombie is named \"Zombie\", starts at 20 hp and damage(7) leaves 13"

[[objectives]]
test = "armorStandTakesHalfDamage"
label = "ArmorStand is named \"Armor stand\", starts at 6 hp and takes half of each hit, rounded down"

[[objectives]]
test = "defaultStatusUsesNameAndHealth"
label = "status() is \"<name>: <health> hp\" (\"Zombie: 20 hp\"), or \"<name>: dead\" at 0 hp"

[[hints]]
text = "Zombie: `health = Math.max(0, health - amount);` and `name()` returns `\"Zombie\"`."

[[hints]]
text = "ArmorStand: the same, but subtract only `amount / 2`. `name()` returns `\"Armor stand\"`."

[[hints]]
text = "A `default` method has a body inside the interface. Write it once; every implementation inherits it."

[[hints]]
text = "`if (health() <= 0) return name() + \": dead\"; return name() + \": \" + health() + \" hp\";` in `Damageable.status()`."

[[points]]
after = 1
prompt = "Which keyword fills in an interface?"
pick = ["extends", "implements", "interface", "default"]
answer = 1

[[points]]
after = 2
prompt = "Give label a shared body."
code = "    ___ String label() {\n        return name() + \" burns for \" + fuelTicks() + \" ticks\";\n    }"
blank = "default"
