title = "A hash that matches equals"
summary = "Override hashCode with the same fields as equals, so a HashSet finds equal amounts."
kind = "exercise"
xp = 40
minutes = 5
tags = ["hashcode", "equals"]

[[objectives]]
test = "equalMoneyHasEqualHashCodes"
label = "Equal Money objects have equal hash codes"
[[objectives]]
test = "hashSetFindsEqualMoney"
label = "A HashSet finds an equal Money and holds it only once"

[[hints]]
text = "`hashCode` must use exactly the fields `equals` compares. `Objects.hash(...)` takes them all and mixes them into one number."
[[hints]]
text = "`return Objects.hash(cents, currency);`"

[[points]]
after = 2
prompt = "If a.equals(b), what must also match?"
pick = ["toString()", "hashCode()", "the variable names", "nothing else"]
answer = 1
[[points]]
after = 4
prompt = "Mix the fields into one hash number."
code = "return Objects.___(x, y);"
blank = "hash"
