title = "The parent's version"
summary = "super: hand values to the parent's constructor and build on the parent's method."
kind = "exercise"
xp = 40
minutes = 5
tags = ["inheritance", "super"]

[[objectives]]
test = "dogPassesItsNameUp"
label = "new Dog(\"Rex\").name() is Rex"
[[objectives]]
test = "describeExtendsTheParentText"
label = "Dog's describe() is Animal's text plus \" and wags its tail\""

[[hints]]
text = "In the constructor, pass the parameter instead of the fixed text. For `describe`, write an `@Override` method that starts from `super.describe()`."
[[hints]]
text = "`super(name);` and `@Override public String describe() { return super.describe() + \" and wags its tail\"; }`."

[[points]]
after = 1
prompt = "Run the parent's constructor first."
code = "public Car(String name) {\n    ___(name);\n}"
blank = "super"
[[points]]
after = 3
prompt = "What does super.describe() run?"
pick = ["The child's describe again", "The parent's describe", "Every describe in the program", "Nothing, it is only a name"]
answer = 1
