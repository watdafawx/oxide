title = "Technologies"
summary = "Lock kit-alloy behind a technology: effects, prerequisites and research cost."
kind = "exercise"
xp = 70
minutes = 12
tags = ["technology", "unlock-recipe"]

[[objectives]]
test = "tech_unlocks_the_recipe"
label = "kit-metallurgy has an unlock-recipe effect for kit-alloy"
[[objectives]]
test = "prerequisites_exist"
label = "its only prerequisite is the vanilla technology automation"
[[objectives]]
test = "unit_uses_valid_science_packs"
label = "research costs 30 units of 15 s, each 1 automation-science-pack"
[[objectives]]
test = "recipe_starts_disabled"
label = "the kit-alloy recipe has enabled = false so only research unlocks it"

[[hints]]
text = "`effects = { { type = \"unlock-recipe\", recipe = \"kit-alloy\" } }` and `prerequisites = { \"automation\" }`."
[[hints]]
text = "`unit = { count = 30, time = 15, ingredients = { { \"automation-science-pack\", 1 } } }`: the ingredient pair is `{ name, amount }`, no `type`."
[[hints]]
text = "A recipe is craftable from the start unless it says `enabled = false`. A technology that unlocks it then makes it available."
