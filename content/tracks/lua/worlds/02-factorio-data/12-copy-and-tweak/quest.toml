title = "Copy and tweak"
summary = "Clone vanilla's gear and its recipe with table.deepcopy without touching the originals."
kind = "exercise"
xp = 45
minutes = 6
tags = ["deepcopy", "tables", "references"]

[[objectives]]
test = "copy_is_independent"
label = "kit-gear and its recipe are new tables, not the vanilla ones"

[[objectives]]
test = "original_is_untouched"
label = "iron-gear-wheel (item and recipe) is exactly as vanilla left it"

[[objectives]]
test = "new_name_is_unique"
label = "one new kit-gear item and recipe; no prototype was overwritten"

[[hints]]
text = "Only the first two lines change: each must hand back a copy of the vanilla table instead of the table itself."

[[hints]]
text = "`local item = table.deepcopy(data.raw.item[\"iron-gear-wheel\"])`, and the same for `data.raw.recipe[\"iron-gear-wheel\"]`."

[[points]]
after = 1
prompt = "After `local item = data.raw.item[\"iron-gear-wheel\"]` and `item.stack_size = 200`, what is vanilla's gear stack size?"
pick = ["100, unchanged", "200", "nil"]
answer = 1

[[points]]
after = 3
prompt = "Which call makes a safe copy of a prototype?"
pick = ["pairs", "table.insert", "table.deepcopy", "setmetatable"]
answer = 2
