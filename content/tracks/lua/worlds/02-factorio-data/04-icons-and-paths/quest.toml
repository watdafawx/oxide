title = "Icons and paths"
summary = "Point at a mod file with __modname__/, then stack tinted icon layers."
kind = "exercise"
xp = 30
minutes = 5
tags = ["icons", "paths", "quick-win"]

[[objectives]]
test = "icon_path_uses_mod_prefix"
label = "the first icon layer is __kit-mod__/graphics/icons/kit-alloy.png"
[[objectives]]
test = "tints_with_icons_layer"
label = "icons holds a second layer that reuses the base plate icon with a tint"
[[objectives]]
test = "tint_is_a_valid_color"
label = "the tint is a real colour that is not plain white"

[[hints]]
text = "Switch from `icon = \"...\"` to `icons = { { icon = \"...\" }, { icon = \"...\" } }`: a list of layers drawn bottom to top."
[[hints]]
text = "Layer 1 is your own file: `__kit-mod__/graphics/icons/kit-alloy.png`. Layer 2: `__base__/graphics/icons/iron-plate.png` with a `tint`."
[[hints]]
text = "`tint = { r = 0.9, g = 0.5, b = 0.2, a = 0.8 }`. Channels are 0 to 1; plain white `{1, 1, 1}` changes nothing."
