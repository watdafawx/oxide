title = "A chest of your own"
summary = "Define the kit-crate container, the item that places it, and what mining returns."
kind = "exercise"
xp = 70
minutes = 12
tags = ["entity", "container", "place_result"]

[[objectives]]
test = "entity_is_defined"
label = "a container named kit-crate with 48 slots, an icon and placeable-neutral flag"
[[objectives]]
test = "item_places_the_entity"
label = "the kit-crate item has place_result = \"kit-crate\" and the entity exists"
[[objectives]]
test = "minable_returns_the_item"
label = "mining takes 0.2 s and gives back the kit-crate item"
[[objectives]]
test = "box_is_symmetric"
label = "collision_box is centred and inside selection_box"

[[hints]]
text = "A `container` needs `inventory_size`. Give it `icon = ...` and `flags = { \"placeable-neutral\", \"player-creation\" }` so it can be placed."
[[hints]]
text = "The item points at the entity: `place_result = \"kit-crate\"`. The entity points back at the item: `minable = { mining_time = 0.2, result = \"kit-crate\" }`."
[[hints]]
text = "Boxes are `{ { left, top }, { right, bottom } }`. A centred one mirrors itself: `{ { -0.35, -0.35 }, { 0.35, 0.35 } }`, with the selection box a little bigger."

[[points]]
after = 2
prompt = "Which item field links to the entity?"
pick = ["minable", "place_result", "flags", "result"]
answer = 1

[[points]]
after = 3
prompt = "Give the item back when mined."
code = "minable = { mining_time = 0.5, result = ___ },"
blank = "\"kit-bin\""
