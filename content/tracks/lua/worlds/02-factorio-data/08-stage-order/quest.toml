title = "Stage order"
summary = "data, data-updates, data-final-fixes: touch other mods' prototypes at the right moment."
kind = "exercise"
xp = 45
minutes = 8
tags = ["stages", "data-updates", "data-final-fixes"]

[[objectives]]
test = "updates_run_after_data"
label = "data-updates.lua moves other-widget into your kit-parts subgroup"
[[objectives]]
test = "final_fixes_sees_other_prototypes"
label = "data-final-fixes.lua halves other-widget's stack size (100 to 50)"
[[objectives]]
test = "change_is_applied_once"
label = "every vanilla stack above 50 is halved exactly once; stacks of 50 stay"

[[hints]]
text = "`other` loads after `mod`, so in `mod/data.lua` its items do not exist yet. In `data-updates.lua` they do: `data.raw.item[\"other-widget\"].subgroup = \"kit-parts\"`."
[[hints]]
text = "In `data-final-fixes.lua` loop `for _, item in pairs(data.raw.item) do ... end` and set `item.stack_size = item.stack_size / 2` when it is above 50."
[[hints]]
text = "Do the halving in exactly one stage. If it also runs in data-updates, other-widget ends at 25 and vanilla plates at 25 too."
