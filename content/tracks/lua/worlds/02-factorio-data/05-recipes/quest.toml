title = "Recipes in the 2.0 format"
summary = "Turn the old {name, amount} recipe into ingredients and results tables."
kind = "exercise"
xp = 55
minutes = 10
tags = ["recipes", "factorio-2.0"]

[[objectives]]
test = "recipe_ingredients_use_2_0_format"
label = "ingredients are {type, name, amount} tables: 2 iron-plate and 1 copper-plate"
[[objectives]]
test = "recipe_result_is_the_item"
label = "results gives one kit-alloy and the old `result` field is gone"
[[objectives]]
test = "crafting_time_is_two_seconds"
label = "energy_required is 2 and the whole recipe passes the field check"

[[hints]]
text = "Each ingredient is `{ type = \"item\", name = \"iron-plate\", amount = 2 }`. The old `{ \"iron-plate\", 2 }` pair is rejected in 2.0."
[[hints]]
text = "Replace `result = \"kit-alloy\"` with `results = { { type = \"item\", name = \"kit-alloy\", amount = 1 } }`."
[[hints]]
text = "`energy_required = 2` is seconds at crafting speed 1. The default is 0.5. `enabled` defaults to true, `category` to \"crafting\"."
