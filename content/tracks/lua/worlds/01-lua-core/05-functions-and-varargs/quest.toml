title = "Functions and varargs"
summary = "Multiple returns, defaults with `or`, and `...`."
kind = "exercise"
xp = 50
minutes = 10
tags = ["functions", "varargs"]

[[objectives]]
test = "returns_min_and_max"
label = "min_max(list) returns two values: smallest, then biggest"
[[objectives]]
test = "default_arg_with_or"
label = "ingredient_count(n) gives 1 when n is missing"
[[objectives]]
test = "sum_varargs"
label = "total(...) adds any number of arguments"
[[objectives]]
test = "keeps_false_argument"
label = "option(value, default) uses the default for nil only, not false"

[[hints]]
text = "`return lo, hi` returns two values. Start both from `list[1]` and walk the rest."
[[hints]]
text = "`n or 1` works for nil, but it also replaces `false`. For booleans test `value == nil` instead."
[[hints]]
text = "`for _, v in ipairs({...}) do` loops over the varargs. `select(\"#\", ...)` is how many there are."
