title = "Halves and floors"
summary = "7 plates divided by 2 is 3.5. You cannot craft half a gear."

[[objectives]]
test = "seven_plates_make_three_and_a_half"
label = "gears_exact(7) gives 3.5"

[[objectives]]
test = "whole_gears_round_down"
label = "whole_gears(7) gives 3, not 3.5"

[[hints]]
text = "In `gears_exact`, divide with `/`: `plates / 2`."

[[hints]]
text = "In `whole_gears`, wrap the division: `math.floor(plates / 2)`."

[[points]]
after = 2
prompt = "What is 7 / 2 in Lua 5.2?"
pick = ["3", "3.5", "4", "an error"]
answer = 1

[[points]]
after = 4
prompt = "Round the division down."
code = "local whole = math.___(plates / 2)"
blank = "floor"
