title = "Defaults"
summary = "When nobody says how many crafts, make one. But keep a real false."

[[objectives]]
test = "missing_crafts_means_one"
label = "crafts_wanted(n) gives 1 when n is missing"

[[objectives]]
test = "false_is_a_real_answer"
label = "option(value, default) falls back for nil only, never for false"

[[hints]]
text = "A missing argument is `nil`, so `crafts_wanted` can reuse it: `return n or 1`."

[[hints]]
text = "`option` cannot use `or`. Check `if value == nil then return default end`, then `return value`."

[[points]]
after = 2
prompt = "What is `nil or 5`?"
pick = ["nil", "5", "false", "an error"]
answer = 1

[[points]]
after = 3
prompt = "What does `false or true` give?"
pick = ["false", "true", "nil", "an error"]
answer = 1
