title = "Walk the list"
summary = "Visit every count on a shopping list and add them up."
kind = "exercise"
xp = 40
minutes = 5
tags = ["loops", "ipairs"]

[[objectives]]
test = "totals_every_count"
label = "total_items(counts) adds up every count"

[[objectives]]
test = "counts_the_bulk_buys"
label = "bulk_items(counts, limit) counts how many are above the limit"

[[hints]]
text = "Make `local total = 0` above a `for _, count in ipairs(counts) do` loop, and add each `count` to it inside."

[[hints]]
text = "`total = total + count` adds. For `bulk_items`, count up by 1 inside an `if count > limit then`."

[[points]]
after = 2
prompt = "What is `_` for?"
pick = ["a name for a value you do not need", "an error", "the first item", "a comment"]
answer = 0

[[points]]
after = 3
prompt = "Start the running value at zero."
code = "local biggest = ___\nfor _, count in ipairs(counts) do\n  if count > biggest then\n    biggest = count\n  end\nend"
blank = "0"
