title = "Coroutines"
summary = "Pausable functions: generators, two-way values and a round-robin scheduler."
kind = "exercise"
xp = 70
minutes = 12
tags = ["coroutines", "generators"]

[[objectives]]
test = "generator_yields_in_order"
label = "range(a, b) is a generator you can use in a for loop"
[[objectives]]
test = "passes_values_both_ways"
label = "accumulator() receives numbers via resume and yields the running total"
[[objectives]]
test = "round_robin_runs_tasks"
label = "round_robin(tasks) runs yielding tasks one step at a time, in turn"

[[hints]]
text = "`coroutine.wrap(function() for i = a, b do coroutine.yield(i) end end)` already is an iterator: `for v in range(1, 3) do`."
[[hints]]
text = "`coroutine.resume(co, x)` passes `x` in. The first time it becomes the function's argument, afterwards it is the return value of `coroutine.yield`."
[[hints]]
text = "Make a coroutine per task with `coroutine.create`. Loop over them, `resume` each once per round, and drop it when `coroutine.status(co) == \"dead\"`."
