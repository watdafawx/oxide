title = "Arrays start at 1"
summary = "Tables as lists: insert, remove, sort, join."
kind = "exercise"
xp = 45
minutes = 8
tags = ["tables", "arrays"]

[[objectives]]
test = "sum_one_based"
label = "sum({1, 2, 3}) walks every element with ipairs"
[[objectives]]
test = "append_and_pop"
label = "append adds at the end, pop removes and returns the last"
[[objectives]]
test = "sort_descending"
label = "sort_desc sorts in place, biggest first"
[[objectives]]
test = "join_with_commas"
label = "join({\"a\", \"b\"}) gives \"a, b\""

[[hints]]
text = "`for i, v in ipairs(xs) do ... end` visits 1..#xs in order. `xs[#xs + 1] = v` appends."
[[hints]]
text = "`table.remove(xs)` removes and returns the last element. `table.sort(xs, function(a, b) return a > b end)` sorts descending."
[[hints]]
text = "`table.concat(xs, \", \")` joins strings; it errors on non-strings, so convert with `tostring` first if needed."
