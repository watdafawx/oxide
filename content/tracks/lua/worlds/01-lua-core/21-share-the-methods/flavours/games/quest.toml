title = "Share the methods"
summary = "One copy of each method, shared by every chest."

[[objectives]]
test = "chests_share_their_methods"
label = "every Chest finds count_of through __index, with no copy inside the object"

[[objectives]]
test = "adding_changes_only_this_chest"
label = "chest:add(item, n) changes that chest and no other"

[[hints]]
text = "Two lines are missing: one that sets `Chest.__index = Chest`, and one in `Chest.new` that uses `setmetatable`."

[[hints]]
text = "`Chest.new` is `return setmetatable({items = items}, Chest)`. `add` is `self.items[item] = (self.items[item] or 0) + n`."

[[points]]
after = 3
prompt = "When does Lua look in `__index`?"
pick = ["when a key is missing", "on every read", "on every write", "when the table is made"]
answer = 0

[[points]]
after = 4
prompt = "Point missing keys at `Recipe`."
code = "Recipe.___ = Recipe"
blank = "__index"
