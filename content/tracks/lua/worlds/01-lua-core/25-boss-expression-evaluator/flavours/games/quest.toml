title = "Boss: Expression evaluator"
summary = "Tokenizer, parser and evaluator for formulas like 2 * (plates + 3) ^ 2."

[[objectives]]
test = "tokenizes_a_cost_formula"
label = "tokenize splits \"12 + 3.5\" into number and operator tokens with positions"

[[objectives]]
test = "multiplies_before_adding"
label = "eval gets 2 + 3 * 4 = 14, left-to-right minus, and right-to-left ^"

[[objectives]]
test = "handles_brackets_and_negatives"
label = "(1 + 2) * 3, -(1 + 2) and 2 * -3 all work"

[[objectives]]
test = "reads_item_counts"
label = "eval(\"plates * 2\", {plates = 3}) = 6, unknown names raise an error"

[[objectives]]
test = "points_at_the_bad_character"
label = "bad input raises \"syntax error at position N: ...\""

[[objectives]]
test = "refuses_to_divide_by_zero"
label = "1 / 0 raises \"division by zero\" instead of returning inf"

[[hints]]
text = "Stage 1: add two `elseif` branches in `scan`. For `+ - * / ^` yield `{kind = \"op\", text = c, pos = i}` and advance `i`; parentheses use `kind = c`."

[[hints]]
text = "Each grammar rule is one function. `expr` = `term` then a loop: while the next token is `+` or `-`, take it and parse another `term`, wrapping the left side in a `bin` node."

[[hints]]
text = "`power` is right-associative: `2 ^ 3 ^ 2` is `2 ^ (3 ^ 2)`. After the atom, if the next token is `^`, take it and parse the right side with `unary` (not a loop)."

[[hints]]
text = "Unary minus: `unary` sees `-`, takes it and returns `{type = \"neg\", expr = unary()}`; otherwise it calls `power`. That makes `-2 ^ 2` equal `-4`."

[[hints]]
text = "In the evaluator, `/` must check `b == 0` and `error(\"division by zero\", 0)`. In Lua `1 / 0` is `inf`, not an error."

[[points]]
after = 2
prompt = "What makes the tokenizer a generator?"
pick = ["coroutine.wrap", "pcall", "setmetatable", "table.sort"]
answer = 0

[[points]]
after = 5
prompt = "Raise the divide-by-zero error."
code = "if op == \"/\" and b == 0 then error(___, 0) end"
blank = "\"division by zero\""
