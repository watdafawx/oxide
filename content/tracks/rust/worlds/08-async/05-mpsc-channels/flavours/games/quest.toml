title = "Downloads report progress"
summary = "Download tasks send progress to the UI task through a tokio mpsc channel."

[[objectives]]
test = "drain_log_collects_until_closed"
label = "drain_log reads every progress line until the channel closes"
[[objectives]]
test = "gather_progress_hears_every_download"
label = "gather_progress spawns one download task per id; each sends id * 10 (percent)"
[[objectives]]
test = "gather_progress_ends_with_no_downloads"
label = "gather_progress finishes (does not hang) when there are no downloads"

[[hints]]
text = "`while let Some(line) = rx.recv().await { ... }` ends when every sender is gone."
[[hints]]
text = "Each task needs its own `tx.clone()`. Move the clone into the `async move` block."
[[hints]]
text = "With zero workers the original `tx` is the only sender left. `drop(tx)` after the loop, or `recv()` waits forever."
