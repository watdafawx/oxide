title = "JSON into a struct"
summary = "serde's derive(Deserialize) writes the code that reads the modpack's JSON into your own struct, and checks every field."

[[objectives]]
test = "fetch_modpack_reads_every_file"
label = "fetch_modpack reads the server's JSON list into Vec<ModFile> (extra fields are skipped)"
[[objectives]]
test = "a_missing_field_is_an_error"
label = "A mod file without a size is an Err, not a made-up 0"

[[hints]]
text = "Add `Deserialize` to the `#[derive(..)]` list above `ModFile` (the `use serde::Deserialize;` is already there). In `fetch_modpack`, the request part is the last quest's; then `.json::<Vec<ModFile>>().await` reads the list."
[[hints]]
text = "`#[derive(Debug, PartialEq, Deserialize)]`, and in `fetch_modpack`: `let response = client.get(url).send().await?.error_for_status()?; response.json::<Vec<ModFile>>().await`."

[[points]]
after = 1
prompt = "Let serde read this struct from JSON."
code = "#[derive(Debug, ___)]\npub struct Loader {\n    pub name: String,\n}"
blank = "Deserialize"
[[points]]
after = 3
prompt = "The JSON has a field the struct doesn't. What happens by default?"
pick = ["parsing fails", "it is skipped", "it panics", "it becomes a String"]
answer = 1
