title = "Do two things at once"
summary = "tokio::join! runs futures side by side instead of one after another."
kind = "exercise"
xp = 45
minutes = 8
tags = ["async", "join", "concurrency"]

[[objectives]]
test = "greet_twice_awaits_both"
label = "greet_twice awaits two greetings in sequence and joins them"
[[objectives]]
test = "double_both_returns_both_results"
label = "double_both(a, b) returns both doubled numbers"
[[objectives]]
test = "double_both_runs_concurrently"
label = "Both slow calls overlap in time (about 300 ms, not 600 ms)"
[[objectives]]
test = "sum_of_both_adds_results"
label = "sum_of_both joins the two calls and adds the results"

[[hints]]
text = "`greet_twice` is the slow way on purpose: `let a = greet(name).await;`, then the same again, then `format!(\"{a} {b}\")`."
[[hints]]
text = "`let (x, y) = tokio::join!(slow_double(a), slow_double(b));` with no `.await` on each future inside the macro."
[[hints]]
text = "`join!` itself is awaited for you: it evaluates to a tuple of the results."
[[hints]]
text = "`sum_of_both`: destructure the tuple from `join!`, then return `x + y`."

[[points]]
after = 3
prompt = "Run both futures together."
code = "tokio::___!(fetch_jar(1), fetch_jar(2))"
blank = "join"

[[points]]
after = 6
prompt = "Which waits without freezing the thread?"
pick = ["sleep(..).await", "std::thread::sleep", "loop {}", "join()"]
answer = 0
