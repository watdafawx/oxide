title = "Shared download counter and version cache"
summary = "Share a counter and a mod-version cache between download tasks with tokio's Mutex and RwLock."

[[objectives]]
test = "counter_reaches_the_full_total"
label = "finish_downloads: 10 tasks x 20 steps = 200, no lost updates"
[[objectives]]
test = "cache_insert_then_get"
label = "VersionCache::insert and VersionCache::get work (RwLock)"
[[objectives]]
test = "cache_is_shared_between_tasks"
label = "Many tasks can write to one Arc<VersionCache> and the count adds up"

[[hints]]
text = "`let mut guard = steps.lock().await;` Read `*guard`, then `yield_now().await`, then write `*guard = current + 1`. The guard must stay alive over the `.await`."
[[hints]]
text = "`Arc::new(Mutex::new(0usize))`, an `Arc::clone` per task, await every handle, then `Arc::try_unwrap(..).unwrap().into_inner()`."
[[hints]]
text = "`self.inner.write().await.insert(..)` to write, `self.inner.read().await.get(..).cloned()` to read."
