title = "Slow mirrors and the Cancel button"
summary = "Give up on a slow download with timeout, race two mirrors with select!, and stop on Cancel."

[[objectives]]
test = "download_with_timeout_gives_up_in_time"
label = "download_with_timeout returns Some(\"done\") when fast enough, None when too slow"
[[objectives]]
test = "fastest_mirror_returns_the_quicker_one"
label = "fastest_mirror races two mirrors and returns \"mirror-a\" or \"mirror-b\", whichever ends first"
[[objectives]]
test = "download_or_cancel_obeys_cancel"
label = "download_or_cancel returns \"cancelled\" as soon as the cancel signal arrives"
[[objectives]]
test = "download_or_cancel_finishes_normally"
label = "...and \"done\" when the download ends first"

[[hints]]
text = "`tokio::time::timeout(Duration::from_millis(limit_ms), download(work_ms)).await` is `Err` when time ran out. `.ok()` makes it an `Option`."
[[hints]]
text = "`tokio::select! { _ = sleep(a) => \"mirror-a\", _ = sleep(b) => \"mirror-b\" }` runs the first branch that completes and drops the rest."
[[hints]]
text = "Race `&mut cancel` (a `oneshot::Receiver` is a future) against `download(work_ms)` inside `select!`."
