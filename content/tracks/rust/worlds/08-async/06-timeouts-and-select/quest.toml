title = "Timeouts and select"
summary = "Give up after a deadline with timeout, or race futures with select!."
kind = "exercise"
xp = 60
minutes = 10
tags = ["async", "timeout", "select"]

[[objectives]]
test = "with_deadline_gives_up_in_time"
label = "with_deadline returns Some(\"done\") when fast enough, None when too slow"
[[objectives]]
test = "first_of_returns_the_faster_one"
label = "first_of races two sleeps and returns \"a\" or \"b\", whichever ends first"
[[objectives]]
test = "work_or_cancel_obeys_cancel"
label = "work_or_cancel returns \"cancelled\" as soon as the cancel signal arrives"
[[objectives]]
test = "work_or_cancel_finishes_normally"
label = "...and \"done\" when the work ends first"

[[hints]]
text = "`tokio::time::timeout(Duration::from_millis(limit), work).await` returns `Result<T, Elapsed>`. `.ok()` makes it an Option."
[[hints]]
text = "`tokio::select! { _ = sleep_a => \"a\", _ = sleep_b => \"b\" }` returns the value of the branch that finished first."
[[hints]]
text = "`select! { _ = &mut cancel => \"cancelled\", _ = work => \"done\" }`: a oneshot Receiver is a future, so you can wait on it in a branch."

[[points]]
after = 2
prompt = "Give up after 50 ms."
code = "let r = ___(Duration::from_millis(50), slow_download()).await;"
blank = "timeout"

[[points]]
after = 4
prompt = "Which macro runs the first future to finish?"
pick = ["select!", "join!", "timeout", "spawn"]
answer = 0
