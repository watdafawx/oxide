title = "Ask the mod API about a mod"
summary = "Fetch a Modrinth-style JSON document with reqwest: parse it, reject 404s, read the title."

[[objectives]]
test = "fetch_mod_json_parses_the_body"
label = "fetch_mod_json(url) returns the parsed JSON value"
[[objectives]]
test = "fetch_mod_json_rejects_http_errors"
label = "A 404 response becomes an Err, not a JSON value"
[[objectives]]
test = "mod_title_reads_a_field"
label = "mod_title(url) returns the \"title\" string from the JSON, or None if missing"

[[hints]]
text = "`reqwest::get(url).await?` sends the request. `.error_for_status()?` turns 4xx/5xx into an `Err`. `.json().await` parses the body."
[[hints]]
text = "Put it in one chain: `reqwest::get(url).await?.error_for_status()?.json().await`."
[[hints]]
text = "`value[\"title\"].as_str()` is `Some(&str)` only when the field exists and is a string. `.map(str::to_string)` makes it owned."
