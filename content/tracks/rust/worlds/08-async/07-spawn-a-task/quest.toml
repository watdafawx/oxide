title = "A task of its own"
summary = "tokio::spawn hands a future to the runtime as a task. async move gives it its own data."
kind = "exercise"
xp = 45
minutes = 6
tags = ["async", "spawn", "task", "async-block"]

[[objectives]]
test = "spawn_file_name_runs_in_its_own_task"
label = "spawn_file_name(\"daily\", 3) runs in a task whose result is \"daily-3.mp3\""
[[objectives]]
test = "all_sizes_spawns_first_then_awaits"
label = "all_sizes spawns one task per episode first, then awaits them in order (under 800 ms for 5)"

[[hints]]
text = "`spawn_file_name` is one line: `tokio::spawn` around an `async move { .. }` block that builds the name with `format!`. In `all_sizes`, `tokio::spawn(episode_size(id))` works as is, because the future owns its `id`."
[[hints]]
text = "`tokio::spawn(async move { format!(\"{show}-{id}.mp3\") })`. Then `let mut handles = Vec::new(); for id in ids { handles.push(tokio::spawn(episode_size(id))); }` and a second loop that does `sizes.push(handle.await.unwrap());`."

[[points]]
after = 2
prompt = "What does tokio::spawn give back straight away?"
pick = ["the task's result", "a JoinHandle", "a new thread", "a Mutex"]
answer = 1
[[points]]
after = 3
prompt = "Let the task own the name."
code = "let cover = tokio::spawn(___ {\n    format!(\"{show}/cover.jpg\")\n});"
blank = "async move"
