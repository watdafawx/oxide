title = "Spawn tasks"
summary = "tokio::spawn starts a task in the background and hands you a JoinHandle."
kind = "exercise"
xp = 50
minutes = 8
tags = ["async", "spawn", "send"]

[[objectives]]
test = "spawn_square_returns_a_handle"
label = "spawn_square(n) spawns a task that computes n * n"
[[objectives]]
test = "square_all_keeps_order"
label = "square_all spawns one task per number and returns results in order"
[[objectives]]
test = "safe_div_survives_a_panic"
label = "safe_div returns None when the task panics (division by zero)"

[[hints]]
text = "`tokio::spawn(async move { n * n })` returns a `JoinHandle<u64>`. `move` hands `n` to the task."
[[hints]]
text = "`square_all`: first `.map(spawn_square).collect::<Vec<_>>()` to start them all, then loop over the handles and `.await` each one."
[[hints]]
text = "`handle.await` gives `Result<T, JoinError>`: `Err` if the task panicked. `.ok()` turns that into an Option."

[[points]]
after = 2
prompt = "What does tokio::spawn return?"
pick = ["JoinHandle", "Future", "Result", "Mutex"]
answer = 0

[[points]]
after = 4
prompt = "Give the task its own data."
code = "tokio::spawn(___ {\n    format!(\"hello {name}\")\n});"
blank = "async move"
