title = "Read: a Download that nobody awaits"
summary = "A future does nothing until it is polled, and a blocking call freezes every other download."

[[quiz]]
question = "You call `download(jar)` (an async fn), store the result in a variable, and never .await it. What happens?"
choices = ["Nothing runs: the future is never polled", "The download still runs in the background, just a bit later", "The launcher panics when the variable goes out of scope"]
answer = 0

[[quiz]]
question = "Inside an async fn that downloads a jar you call std::thread::sleep(Duration::from_secs(5)) to wait before a retry. What is the problem?"
choices = ["It does not compile, because std::thread::sleep is not allowed in async fn", "It is fine: the runtime swaps downloads automatically while this one sleeps", "It blocks the thread, so other downloads on it freeze"]
answer = 2
