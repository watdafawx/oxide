title = "Nothing happens until you await"
summary = "A future does nothing until it is polled. What polling and waking mean, and the bug of a forgotten .await."
kind = "read"
xp = 15
minutes = 3
tags = ["async", "futures", "poll"]

[[quiz]]
question = "You call `save_episode(3)` (an async fn), keep the result in a variable, and never .await it. What happens?"
choices = [
  "The episode is saved in the background, a little later",
  "Nothing: the future is never polled, so its body never runs",
  "The program panics when the variable goes out of scope",
]
answer = 1

[[quiz]]
question = "A polled future reaches `.await` on a download that has no answer yet. What does it do?"
choices = [
  "It holds the thread and checks the network in a loop until the bytes arrive",
  "It throws away its progress and starts again from its first line on the next poll",
  "It answers \"not ready\" and is polled again once its waker says the answer arrived",
]
answer = 2
