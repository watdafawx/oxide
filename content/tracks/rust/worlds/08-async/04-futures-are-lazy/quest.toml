title = "Futures are lazy"
summary = "Nothing runs until something polls it. Two-minute read."
kind = "read"
xp = 15
minutes = 3
tags = ["async", "futures", "blocking"]

[[quiz]]
question = "You call an async fn, store the result in a variable, and never .await it. What happens?"
choices = ["Nothing runs: the future is never polled", "The work still runs in the background, just a bit later", "The program panics when the variable goes out of scope"]
answer = 0

[[quiz]]
question = "Inside an async fn you call std::thread::sleep(Duration::from_secs(5)). What is the problem?"
choices = ["It does not compile, because std::thread::sleep is not allowed in async fn", "It is fine: the runtime swaps tasks automatically while this one sleeps", "It blocks the thread, so other tasks on it stall"]
answer = 2
