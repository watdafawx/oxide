title = "Your first async download step"
summary = "An async fn returns a future that runs when you .await it. The downloader's first two steps."

[[objectives]]
test = "announce_download_names_the_jar"
label = "announce_download(jar) returns \"Downloading <jar>\""
[[objectives]]
test = "total_size_adds_two_files"
label = "total_size(a, b) returns a + b"

[[hints]]
text = "An `async fn` body is ordinary code. `format!(\"Downloading {jar}\")` is the whole answer."
[[hints]]
text = "Tests call `announce_download(\"sodium.jar\").await`: the function returns a future, `.await` runs it."
