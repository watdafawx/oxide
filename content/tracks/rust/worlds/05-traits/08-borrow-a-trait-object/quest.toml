title = "Look, don't box"
summary = "A function that only reads a shape takes &dyn Shape."
kind = "exercise"
xp = 25
minutes = 3
tags = ["trait-objects", "dyn", "references"]

[[objectives]]
test = "describe_takes_a_loose_shape"
label = "describe(&rect) returns \"rect with area 6.0\""
[[objectives]]
test = "describe_takes_shapes_from_the_list"
label = "describe works on every Box<dyn Shape> in a list"

[[hints]]
text = "`shape` is a `&dyn Shape`, so you can call `shape.name()` and `shape.area()` on it."
[[hints]]
text = "`format!(\"{} with area {:.1}\", shape.name(), shape.area())`."

[[points]]
after = 1
prompt = "Borrow any shape, type forgotten."
code = "fn label(s: ___) -> String {"
blank = "&dyn Shape"
[[points]]
after = 4
prompt = "The canvas must own its shapes. Which type?"
pick = ["&dyn Shape", "Vec<Box<dyn Shape>>", "Vec<&Shape>", "Shape"]
answer = 1
