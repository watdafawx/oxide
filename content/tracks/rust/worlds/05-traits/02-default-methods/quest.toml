title = "Methods that come free"
summary = "Give a trait method a default body, then override it for one type."
kind = "exercise"
xp = 40
minutes = 6
tags = ["traits", "default-methods"]

[[objectives]]
test = "default_greet_uses_name"
label = "Default greet() returns \"Hello, <name>!\""
[[objectives]]
test = "shout_builds_on_greet"
label = "Default shout() is greet() in uppercase"
[[objectives]]
test = "parrot_overrides_greet"
label = "Parrot overrides greet() with its own line"

[[hints]]
text = "A default body is an ordinary method body inside the trait. It can call `self.name()` even though each type writes `name` itself."
[[hints]]
text = "`greet`: `format!(\"Hello, {}!\", self.name())`. `shout`: `self.greet().to_uppercase()`. Parrot: `format!(\"Squawk! {} wants a cracker!\", self.name())`."

[[points]]
after = 1
prompt = "A trait method that already has a body is..."
pick = ["required", "private", "a default", "an override"]
answer = 2
[[points]]
after = 2
prompt = "Call the trait's other method."
code = "format!(\"{} says hi\", self.___())"
blank = "name"
