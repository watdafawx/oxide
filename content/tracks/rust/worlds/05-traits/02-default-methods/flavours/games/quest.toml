title = "Peaceful unless told otherwise"
summary = "Give Entity default methods, then override them for the zombie."

[[objectives]]
test = "default_announce_uses_mob_name"
label = "Default announce() says \"A wild <name> appears!\" and is_hostile() is false"
[[objectives]]
test = "alert_is_announce_in_caps"
label = "Default alert() is announce() in uppercase"
[[objectives]]
test = "zombie_overrides_announce"
label = "Zombie overrides announce() and is_hostile()"

[[hints]]
text = "A default body is an ordinary method body inside the trait. It can call `self.name()` even though each mob writes `name` itself."
[[hints]]
text = "`is_hostile`: `false`. `announce`: `format!(\"A wild {} appears!\", self.name())`. `alert`: `self.announce().to_uppercase()`. Zombie: `true` and `format!(\"{} groans at you!\", self.name())`."

[[points]]
after = 1
prompt = "A trait method that already has a body is..."
pick = ["required", "private", "a default", "an override"]
answer = 2
[[points]]
after = 2
prompt = "Call the trait's other method."
code = "format!(\"[{}]\", self.___())"
blank = "name"
