title = "A sensible default"
summary = "Default: derive it when zeros are right, write it when they are not."

[[objectives]]
test = "drops_default_to_nothing"
label = "no_drops() gives 0 xp and no items"
[[objectives]]
test = "mob_stats_default_to_twenty_health"
label = "MobStats::default() has 20 health and 0 armor, even through unwrap_or_default"

[[hints]]
text = "`Drops` only needs `Default` added to its derive line; then `no_drops` can return `Drops::default()`. `MobStats` already has an `impl Default`: change the value it returns."
[[hints]]
text = "`#[derive(Debug, PartialEq, Default)]` on `Drops`. In `MobStats::default`: `MobStats { health: 20, armor: 0 }`."

[[points]]
after = 1
prompt = "Make one from nothing."
code = "let stats = MobStats::___();"
blank = "default"
[[points]]
after = 2
prompt = "What does a derived Default put in a u32 field?"
pick = ["1", "nothing, it must be written", "0", "u32::MAX"]
answer = 2
