title = "The traits everyone has"
summary = "Derive Debug, Clone, PartialEq, Default. Implement Display and From."
kind = "exercise"
xp = 60
minutes = 10
tags = ["derive", "display", "from", "std-traits"]

[[objectives]]
test = "debug_and_equality_derive"
label = "Player prints with {:?} and compares with =="
[[objectives]]
test = "clone_and_default_derive"
label = "Player can be cloned and has a Default"
[[objectives]]
test = "display_formats_player"
label = "Display prints \"Ann (30 hp)\""
[[objectives]]
test = "from_str_builds_player"
label = "Player::from(\"Ann\") gives 100 hp"

[[hints]]
text = "Put `#[derive(Debug, Clone, PartialEq, Default)]` on the line above `pub struct Player`."
[[hints]]
text = "Then the four small functions are one-liners: `format!(\"{p:?}\")`, `a == b`, `p.clone()`, `Player::default()`."
[[hints]]
text = "Display: `write!(f, \"{} ({} hp)\", self.name, self.hp)`. From: `Player { name: name.to_string(), hp: 100 }`."
