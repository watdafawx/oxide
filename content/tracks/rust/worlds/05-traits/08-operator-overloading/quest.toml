title = "Make + work on your type"
summary = "Implement Add, Neg, Mul and PartialOrd for a 2D vector."
kind = "exercise"
xp = 60
minutes = 10
tags = ["operators", "add", "neg", "partialord"]

[[objectives]]
test = "add_vectors"
label = "Vec2 + Vec2 adds each component"
[[objectives]]
test = "negate_vector"
label = "-Vec2 flips both components"
[[objectives]]
test = "scale_by_number"
label = "Vec2 * f64 scales both components"
[[objectives]]
test = "vectors_compare_by_length"
label = "a < b compares vector lengths"

[[hints]]
text = "`Add` has `type Output = Vec2;` and `fn add(self, other: Vec2) -> Vec2`. Build `Vec2 { x: self.x + other.x, y: ... }`."
[[hints]]
text = "`Neg`: `Vec2 { x: -self.x, y: -self.y }`. `Mul<f64>`: multiply both fields by `k`."
[[hints]]
text = "`partial_cmp`: compare squared lengths, `self.len_sq().partial_cmp(&other.len_sq())`. The helper `len_sq` is given."
