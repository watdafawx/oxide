title = "Zombies only, or every mob?"
summary = "Generics copy code per mob type, dyn looks it up at runtime. Know which to pick."

[[quiz]]
question = "What does the compiler do with `fn strongest<T: Entity>(mobs: &[T])` when you call it with a slice of Zombies and a slice of Creepers?"
choices = ["Generates one copy of the function per mob type, resolved at compile time", "Generates a single function that looks the method up in a table at runtime, whatever the mob", "Refuses to compile: a function can only ever take one mob type, so you need one function per type"]
answer = 0

[[quiz]]
question = "You want one `Vec` holding a Zombie, a Creeper and a Villager, all `Entity`, so the tick loop can walk them. What do you need?"
choices = ["Vec<T> where T: Entity", "Vec<Box<dyn Entity>>", "Vec<impl Entity>"]
answer = 1
