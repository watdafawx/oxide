title = "Boss: shape renderer"
summary = "A Shape trait, three shapes, an ASCII canvas, generic helpers and a Scaled wrapper."
kind = "boss"
xp = 400
minutes = 50
tags = ["traits", "generics", "trait-objects", "dyn", "boss"]

[[objectives]]
test = "rect_area_and_name"
label = "Rect: area() is w * h and name() is \"rect\""
[[objectives]]
test = "rect_contains_is_inclusive"
label = "Rect::contains includes its edges"
[[objectives]]
test = "circle_is_a_shape"
label = "Circle: area, bounds, name and contains"
[[objectives]]
test = "triangle_is_a_shape"
label = "Triangle: area, bounds, name and contains"
[[objectives]]
test = "canvas_renders_shapes"
label = "Canvas::render draws # where a shape contains the cell centre"
[[objectives]]
test = "totals_and_largest"
label = "total_area and largest work for any T: Shape"
[[objectives]]
test = "sort_by_area_orders_shapes"
label = "sort_by_area sorts smallest to largest"
[[objectives]]
test = "scaled_wraps_any_shape"
label = "Scaled<S> is itself a Shape, even inside a Canvas"

[[hints]]
text = "Start with `Rect`: `area` is `self.w * self.h`, `name` is `\"rect\".to_string()`. `contains` is four comparisons: `x >= self.x && x <= self.x + self.w && ...`."
[[hints]]
text = "Circle: `contains` is `dx * dx + dy * dy <= r * r`. Triangle (right angle at x, y): with `dx = px - x` and `dy = py - y`, it contains the point when `dx >= 0.0 && dy >= 0.0 && dx / base + dy / height <= 1.0`."
[[hints]]
text = "`render`: for each row `y` in `0..h`, build a `String` over `x` in `0..w`. Test the centre `(x as f64 + 0.5, y as f64 + 0.5)` with `shapes.iter().any(|s| s.contains(px, py))`. Join the rows with `\"\\n\"`."
[[hints]]
text = "Generic helpers: `shapes.iter().map(|s| s.area()).sum()`, `shapes.iter().max_by(|a, b| a.area().total_cmp(&b.area()))`, `shapes.sort_by(|a, b| a.area().total_cmp(&b.area()))`."
[[hints]]
text = "`Scaled`: area times `factor * factor`, bounds keep `x`, `y` and scale `w`, `h`. For `contains`, map the point back into the inner shape: `inner.contains(b.x + (px - b.x) / f, b.y + (py - b.y) / f)` where `b = self.inner.bounds()`."

[[points]]
after = 6
prompt = "Which bound makes total_area generic over shapes?"
pick = ["T: Shape", "T = Shape", "Shape<T>", "dyn Shape"]
answer = 0

[[points]]
after = 8
prompt = "Pick the biggest by an f64 key."
code = "items.iter().___(|a, b| a.weight.total_cmp(&b.weight))"
blank = "max_by"
