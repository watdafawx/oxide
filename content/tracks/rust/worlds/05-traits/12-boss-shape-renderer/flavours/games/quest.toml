title = "Boss: hitbox renderer"
summary = "A Hitbox trait, three hitbox shapes, an ASCII canvas, generic helpers and a Scaled wrapper."

[[objectives]]
test = "aabb_area_and_name"
label = "Aabb: area() is w * h and name() is \"box\""
[[objectives]]
test = "aabb_contains_includes_edges"
label = "Aabb::contains includes its edges"
[[objectives]]
test = "cylinder_is_a_hitbox"
label = "Cylinder: area, bounds, name and contains"
[[objectives]]
test = "wedge_is_a_hitbox"
label = "Wedge: area, bounds, name and contains"
[[objectives]]
test = "canvas_draws_hitboxes"
label = "Canvas::render draws # where a hitbox contains the cell centre"
[[objectives]]
test = "total_area_and_biggest_hitbox"
label = "total_area and biggest work for any T: Hitbox"
[[objectives]]
test = "sort_by_area_orders_hitboxes"
label = "sort_by_area sorts smallest to biggest hitbox"
[[objectives]]
test = "scaled_hitbox_is_a_hitbox"
label = "Scaled<H> is itself a Hitbox, even inside a Canvas"

[[hints]]
text = "Start with `Aabb`: `area` is `self.w * self.h`, `name` is `\"box\".to_string()`. `contains` is four comparisons: `x >= self.x && x <= self.x + self.w && ...`."
[[hints]]
text = "Cylinder (top-down circle): `contains` is `dx * dx + dy * dy <= r * r`. Wedge (right angle at x, y): with `dx = px - x` and `dy = py - y`, it contains the point when `dx >= 0.0 && dy >= 0.0 && dx / base + dy / height <= 1.0`."
[[hints]]
text = "`render`: for each row `y` in `0..h`, build a `String` over `x` in `0..w`. Test the centre `(x as f64 + 0.5, y as f64 + 0.5)` with `hitboxes.iter().any(|b| b.contains(px, py))`. Join the rows with `\"\\n\"`."
[[hints]]
text = "Generic helpers: `hitboxes.iter().map(|b| b.area()).sum()`, `hitboxes.iter().max_by(|a, b| a.area().total_cmp(&b.area()))`, `hitboxes.sort_by(|a, b| a.area().total_cmp(&b.area()))`."
[[hints]]
text = "`Scaled`: area times `factor * factor`, bounds keep `x`, `y` and scale `w`, `h`. For `contains`, map the point back into the inner hitbox: `inner.contains(b.x + (px - b.x) / f, b.y + (py - b.y) / f)` where `b = self.inner.bounds()`."

[[points]]
after = 5
prompt = "Which bound makes total_area generic over hitboxes?"
pick = ["T: Hitbox", "T = Hitbox", "Hitbox<T>", "dyn Hitbox"]
answer = 0

[[points]]
after = 7
prompt = "Pick the biggest by an f64 key."
code = "items.iter().___(|a, b| a.weight.total_cmp(&b.weight))"
blank = "max_by"
