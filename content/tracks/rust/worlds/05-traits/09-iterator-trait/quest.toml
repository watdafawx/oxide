title = "Build your own iterator"
summary = "Implement Iterator for Countdown and get map, filter and sum for free."
kind = "exercise"
xp = 70
minutes = 12
tags = ["iterator", "traits", "adaptors"]

[[objectives]]
test = "counts_down_to_one"
label = "Countdown::new(3) yields 3, 2, 1 then stops"
[[objectives]]
test = "evens_only"
label = "evens(6) collects the even numbers: [6, 4, 2]"
[[objectives]]
test = "sum_of_squares_of_countdown"
label = "sum_of_squares(3) is 14"

[[hints]]
text = "`next`: `if self.n == 0 { None } else { let v = self.n; self.n -= 1; Some(v) }`."
[[hints]]
text = "Once `next` works, `Countdown::new(start)` is a normal iterator: call `.filter(|n| n % 2 == 0).collect()` on it."
[[hints]]
text = "`sum_of_squares`: `Countdown::new(start).map(|n| n * n).sum()`."
