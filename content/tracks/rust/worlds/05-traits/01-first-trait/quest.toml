title = "Same verb, different types"
summary = "Implement a trait for two structs."
kind = "exercise"
xp = 30
minutes = 4
tags = ["traits"]

[[objectives]]
test = "dog_describes_itself"
label = "Dog::describe() returns \"Rex the dog\""
[[objectives]]
test = "robot_describes_itself"
label = "Robot::describe() returns \"robot #7\""

[[hints]]
text = "Inside `impl Describe for Dog { ... }` the method body can use `self.name`."
[[hints]]
text = "Use `format!(\"{} the dog\", self.name)`. For the robot: `format!(\"robot #{}\", self.id)`."

[[points]]
after = 2
prompt = "Which keyword lists method signatures?"
pick = ["trait", "struct", "enum", "impl"]
answer = 0

[[points]]
after = 3
prompt = "Fill in the bodies for Cat."
code = "___ Describe for Cat {"
blank = "impl"
