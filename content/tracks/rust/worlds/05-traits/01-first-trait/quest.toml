title = "Same verb, different types"
summary = "Two structs need the same method: write a trait and implement it for both."
kind = "exercise"
xp = 30
minutes = 4
tags = ["traits"]

[[objectives]]
test = "circle_describes_itself"
label = "Circle::describe() returns \"circle with radius 2\""
[[objectives]]
test = "square_describes_itself"
label = "Square::describe() returns \"square with side 3\""

[[hints]]
text = "Inside `impl Describe for Circle { ... }` the body can read the circle's field as `self.radius`."
[[hints]]
text = "`format!(\"circle with radius {}\", self.radius)`. For the square: `format!(\"square with side {}\", self.side)`."

[[points]]
after = 3
prompt = "What does a trait list?"
pick = ["fields and their types", "method signatures, without bodies", "the variants of an enum", "finished methods for one type"]
answer = 1
[[points]]
after = 4
prompt = "Make Line keep the Describe promise."
code = "___ Describe for Line {"
blank = "impl"
