title = "Spawn rules with impl Trait"
summary = "Take and return impl Trait, including spawn rules that are closures."

[[objectives]]
test = "banner_accepts_any_display"
label = "banner takes any impl Display"
[[objectives]]
test = "spawn_ticks_yields_every_fifth_tick"
label = "spawn_ticks returns an impl Iterator of every fifth tick"
[[objectives]]
test = "damage_bonus_returns_closure"
label = "damage_bonus(n) returns a closure that adds n"
[[objectives]]
test = "chain_applies_first_then_second"
label = "chain(first, second) applies first, then second"

[[hints]]
text = "`banner`: `format!(\"{}!\", text.to_string().to_uppercase())`. `spawn_ticks`: `(0..limit).filter(|t| t % 5 == 0)`."
[[hints]]
text = "`damage_bonus`: `move |d| d + n`. The `move` keeps `n` alive inside the closure."
[[hints]]
text = "`chain`: `move |d| second(first(d))`."

[[points]]
after = 1
prompt = "Accept any type that implements Display."
code = "fn tag(x: ___) -> String {"
blank = "impl Display"

[[points]]
after = 4
prompt = "Which keyword makes a closure own its variables?"
pick = ["move", "ref", "own", "mut"]
answer = 0
