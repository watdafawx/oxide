title = "Types and constants inside traits"
summary = "Use an associated type Output and an associated const NAME."
kind = "exercise"
xp = 60
minutes = 10
tags = ["associated-types", "associated-consts", "traits"]

[[objectives]]
test = "celsius_converts_to_fahrenheit"
label = "Celsius::convert() returns Fahrenheit as f64"
[[objectives]]
test = "words_counts_words"
label = "Words::convert() returns the word count as usize"
[[objectives]]
test = "names_are_set"
label = "Each type sets its own NAME const"
[[objectives]]
test = "label_uses_name_and_output"
label = "label() prints \"<NAME>: <output>\""

[[hints]]
text = "Celsius: `self.0 * 9.0 / 5.0 + 32.0`. Words: `self.0.split_whitespace().count()`."
[[hints]]
text = "`const NAME: &str = \"celsius->fahrenheit\";` and `\"word-count\"`."
[[hints]]
text = "`label`: `format!(\"{}: {}\", C::NAME, item.convert())`. Read the constant from the **type**, `C::NAME`."

[[points]]
after = 2
prompt = "Pick an associated type."
code = "    ___ Output = u32;"
blank = "type"

[[points]]
after = 3
prompt = "How do you read the const on Big?"
pick = ["Big::FACTOR", "Big.FACTOR", "Big->FACTOR", "FACTOR(Big)"]
answer = 0
