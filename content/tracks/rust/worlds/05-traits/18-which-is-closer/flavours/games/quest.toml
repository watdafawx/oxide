title = "Who is closer?"
summary = "Implement PartialOrd so that < and == always agree, and see why it is only partial."

[[objectives]]
test = "distances_compare_by_size"
label = "Distance < Distance compares the numbers, and NaN has no order"
[[objectives]]
test = "closer_picks_the_nearer_mob"
label = "closer(a, b) returns the offset with the smaller distance"

[[hints]]
text = "`partial_cmp` only has to compare the `f64` inside each `Distance`, and `f64` has its own `partial_cmp`. `closer` compares `a.distance()` with `b.distance()` using `<=`."
[[hints]]
text = "`self.0.partial_cmp(&other.0)`. `closer`: `if a.distance() <= b.distance() { a } else { b }`."

[[points]]
after = 2
prompt = "Two vectors are `<=` each other both ways but not `==`. What breaks?"
pick = ["nothing, that is fine", "only printing", "sorting, max and lookups give odd answers", "the game won't build"]
answer = 2
[[points]]
after = 4
prompt = "What does `partial_cmp` return when two values have no order?"
pick = ["Some(Equal)", "None", "Some(Less)", "it panics"]
answer = 1
