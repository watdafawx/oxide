title = "One function, any type"
summary = "Write generic functions with trait bounds and where clauses."
kind = "exercise"
xp = 50
minutes = 8
tags = ["generics", "trait-bounds"]

[[objectives]]
test = "largest_works_for_many_types"
label = "largest finds the max of ints, floats and strs"
[[objectives]]
test = "show_all_joins_with_commas"
label = "show_all prints items separated by \", \""
[[objectives]]
test = "count_matching_counts_equal_items"
label = "count_matching counts items equal to the target"

[[hints]]
text = "`largest`: start with `let mut best = &xs[0];`, loop over `xs`, and replace `best` when `x > best`."
[[hints]]
text = "`show_all`: map every item to a `String` with `.to_string()`, collect into a `Vec<String>`, then `.join(\", \")`."
[[hints]]
text = "`count_matching`: `xs.iter().filter(|x| *x == target).count()`."

[[points]]
after = 2
prompt = "Which writes a bound?"
pick = ["<T: Display>", "<T = Display>", "T<Display>", "(T: Display)"]
answer = 0

[[points]]
after = 3
prompt = "Combine two bounds."
code = "fn largest<T: Display ___ PartialOrd>(a: T, b: T) -> T {"
blank = "+"
