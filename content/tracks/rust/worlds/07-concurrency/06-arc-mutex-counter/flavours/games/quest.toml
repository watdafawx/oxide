title = "Many workers, one progress counter"
summary = "Share one Mutex between all hash workers by wrapping it in an Arc."

[[objectives]]
test = "hash_counter_never_loses_a_jar"
label = "hash_counter: every worker bumps one shared files-done counter"
[[objectives]]
test = "collect_hashes_gathers_every_worker"
label = "collect_hashes: each worker pushes its hash into one shared Vec"
[[objectives]]
test = "loader_counts_tally_in_a_shared_map"
label = "loader_counts: one worker per jar updates a shared BTreeMap of jars per mod loader"

[[hints]]
text = "`let done = Arc::new(Mutex::new(0));` Inside the loop: `let done = Arc::clone(&done);` then `thread::spawn(move || ...)`."
[[hints]]
text = "Join every handle before you read the result. Then `Arc::try_unwrap(done).unwrap().into_inner().unwrap()` gets the value out (it works once all other clones are gone)."
[[hints]]
text = "For the map: `*map.lock().unwrap().entry(loader).or_default() += 1;` with `loader` an owned `String`."
