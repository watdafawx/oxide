title = "Many scanners, one installer"
summary = "Many threads may read the mod list at once, or one may change it alone: RwLock."

[[objectives]]
test = "mod_count_reads_the_list"
label = "mod_count takes a read lock and returns the length"
[[objectives]]
test = "add_mod_appends_under_write_lock"
label = "add_mod takes a write lock and appends"
[[objectives]]
test = "two_scanners_share_the_list"
label = "two_scanners_share holds one read guard and still gets a second one"
[[objectives]]
test = "installer_is_refused_while_a_scanner_reads"
label = "installer_is_refused: try_write fails while a read guard is alive"

[[hints]]
text = "`mods.read().unwrap().len()` takes a read lock."
[[hints]]
text = "`mods.write().unwrap().push(...)` takes the write lock."
[[hints]]
text = "`lock.try_read()` and `lock.try_write()` return `Result` at once instead of waiting. Keep the first guard in a `let _first = ...` so it lives to the end of the function."
