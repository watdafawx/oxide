title = "A poisoned lock"
summary = "A thread that panics while holding a lock poisons it. You can still choose to read the value."
kind = "exercise"
xp = 30
minutes = 4
tags = ["mutex", "poisoning", "panic"]

[[objectives]]
test = "files_done_reads_a_poisoned_counter"
label = "files_done returns the count even after a thread panicked while holding the lock"

[[hints]]
text = "Replace `unwrap()` on `lock()` with `unwrap_or_else`, and give it a closure that takes the error and returns the guard inside it."
[[hints]]
text = "`*done.lock().unwrap_or_else(|e| e.into_inner())`"

[[points]]
after = 1
prompt = "A thread panicked while it held the lock. What does the next lock() return?"
pick = ["Ok(guard)", "None", "Err(PoisonError)", "it waits forever"]
answer = 2
[[points]]
after = 3
prompt = "Take the guard out of the poison error."
code = "m.lock().unwrap_or_else(|e| e.___())"
blank = "into_inner"
