title = "A pipe between threads"
summary = "A channel carries jar names from one thread to another: send on one end, receive on the other."

[[objectives]]
test = "stream_jars_delivers_in_folder_order"
label = "stream_jars sends every jar name from a thread, in order, then the channel closes"
[[objectives]]
test = "drain_sizes_collects_until_the_sender_hangs_up"
label = "drain_sizes collects everything a Receiver yields"

[[hints]]
text = "`let (tx, rx) = mpsc::channel();` then spawn a `move` thread that loops over `jars` and calls `tx.send(jar).unwrap()`. Return `rx` without waiting."
[[hints]]
text = "For `drain_sizes`: `let mut got = Vec::new(); for size in rx { got.push(size); } got` (or `rx.iter().collect()`)."

[[points]]
after = 2
prompt = "Which end goes into the thread that produces jar names?"
pick = ["rx, the Receiver", "tx, the Sender", "both", "neither"]
answer = 1
[[points]]
after = 3
prompt = "Which call waits until a value arrives?"
pick = ["send", "clone", "recv", "drop"]
answer = 2
