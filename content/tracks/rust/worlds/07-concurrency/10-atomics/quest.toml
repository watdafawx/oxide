title = "Atomics"
summary = "Lock-free counters and flags: one CPU instruction instead of a Mutex."
kind = "exercise"
xp = 55
minutes = 10
tags = ["atomics", "ordering", "lock-free"]

[[objectives]]
test = "increment_returns_the_previous_value"
label = "increment adds 1 and returns the value from before"
[[objectives]]
test = "count_in_threads_never_loses_an_update"
label = "count_in_threads: threads share an AtomicUsize and no increment is lost"
[[objectives]]
test = "claim_once_has_exactly_one_winner"
label = "claim_once: of many racing threads exactly one gets true"

[[hints]]
text = "`counter.fetch_add(1, Ordering::Relaxed)` adds and returns the OLD value."
[[hints]]
text = "Share with `Arc<AtomicUsize>` (clone per thread). Read the total with `load` after joining."
[[hints]]
text = "`flag.compare_exchange(false, true, Ordering::SeqCst, Ordering::SeqCst)` succeeds (`Ok`) for exactly one caller."

[[points]]
after = 1
prompt = "Declare the atomic counter."
code = "static FILES_DONE: ___ = AtomicUsize::new(0);"
blank = "AtomicUsize"

[[points]]
after = 3
prompt = "Which adds and returns the OLD value?"
pick = ["fetch_add", "load", "store", "swap"]
answer = 0
