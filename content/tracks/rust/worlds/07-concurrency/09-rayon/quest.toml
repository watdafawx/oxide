title = "Rayon"
summary = "Turn .iter() into .par_iter() and let a thread pool split the work for you."
kind = "exercise"
xp = 50
minutes = 8
tags = ["rayon", "par_iter", "crates"]

[[objectives]]
test = "sum_of_squares_runs_in_parallel"
label = "sum_of_squares: par_iter + map + sum"
[[objectives]]
test = "parallel_lengths_keeps_order"
label = "parallel_lengths: par_iter + map + collect keeps the input order"
[[objectives]]
test = "count_primes_uses_into_par_iter"
label = "count_primes: (0..limit).into_par_iter() with filter + count"

[[hints]]
text = "Start with `use rayon::prelude::*;` (already there). Then `nums.par_iter().map(|&n| n * n).sum()`."
[[hints]]
text = "`collect::<Vec<_>>()` on a parallel iterator still returns the items in the original order."
[[hints]]
text = "`(0..limit).into_par_iter().filter(|&n| is_prime(n)).count()`"

[[points]]
after = 1
prompt = "Swap one word to run in parallel."
code = "let lengths: Vec<usize> = jars.___().map(|j| j.len()).collect();"
blank = "par_iter"

[[points]]
after = 3
prompt = "Which one consumes the collection?"
pick = ["par_iter", "into_par_iter", "par_iter_mut", "iter"]
answer = 1
