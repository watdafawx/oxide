title = "Two things at once"
summary = "What a thread is, why a computer can run several, and why their output comes in a different order each run."

[[quiz]]
question = "Two worker threads each print one line. In which order do the lines appear?"
choices = [
  "Always in the order the workers were started",
  "It can change from run to run, because the system decides when each thread runs",
  "Alphabetical, because the terminal sorts them",
]
answer = 1

[[quiz]]
question = "Your PC has 8 cores. What does that let threads do?"
choices = [
  "Up to 8 threads can run at the very same moment",
  "A launcher may start at most 8 threads",
  "Each thread runs 8 times faster",
]
answer = 0

[[quiz]]
question = "Which job gains most from being split over several threads?"
choices = [
  "Adding two stack sizes once",
  "Printing one line",
  "Hashing 200 mod jars, one after another",
]
answer = 2
