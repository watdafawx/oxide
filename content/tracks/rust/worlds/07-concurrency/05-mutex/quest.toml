title = "Mutex"
summary = "Lock a value so only one thread at a time can change it."
kind = "exercise"
xp = 45
minutes = 8
tags = ["mutex", "lock", "poisoning"]

[[objectives]]
test = "bump_adds_one_under_the_lock"
label = "bump locks the Mutex and adds 1"
[[objectives]]
test = "push_and_take_all_empties_the_log"
label = "push_line appends, take_all hands over the lines and leaves the log empty"
[[objectives]]
test = "read_even_if_poisoned_recovers_the_value"
label = "read_even_if_poisoned still returns the value after another thread panicked while holding the lock"

[[hints]]
text = "`*counter.lock().unwrap() += 1;` The guard derefs to the `u32`."
[[hints]]
text = "`std::mem::take(&mut *guard)` swaps in an empty Vec and gives you the old one."
[[hints]]
text = "`lock()` returns `Err(PoisonError)` after a panic. `unwrap_or_else(|e| e.into_inner())` still gives you the guard."

[[points]]
after = 2
prompt = "Take the lock."
code = "let mut guard = log.___().unwrap();"
blank = "lock"

[[points]]
after = 4
prompt = "Locking twice on one thread is a what?"
pick = ["deadlock", "panic", "copy", "timeout"]
answer = 0
