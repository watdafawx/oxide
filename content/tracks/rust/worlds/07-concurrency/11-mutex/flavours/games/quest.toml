title = "One at a time"
summary = "A Mutex holds the jar counter behind a lock: lock it, change it, and the guard unlocks it for you."

[[objectives]]
test = "bump_never_loses_a_jar"
label = "bump locks the counter and adds 1, and four workers lose no update"
[[objectives]]
test = "log_line_appends_to_the_launcher_log"
label = "log_line locks the launcher log and pushes the line"

[[hints]]
text = "`lock()` hands back a `Result` holding the guard: `unwrap()` it. The guard acts like a `&mut` to the value inside, so use `*` for a number and call methods directly on a `Vec`."
[[hints]]
text = "`*done.lock().unwrap() += 1;` and `log.lock().unwrap().push(line.to_string());`"

[[points]]
after = 2
prompt = "Take the lock."
code = "let mut guard = log.___().unwrap();"
blank = "lock"
[[points]]
after = 4
prompt = "One worker locks the same Mutex twice without dropping the first guard. What happens?"
pick = ["it gets the lock twice", "a compile error", "it waits for itself forever", "the value is copied"]
answer = 2
