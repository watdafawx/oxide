title = "Read: why the progress counter can't be an Rc"
summary = "Two marker traits decide which values may cross threads. Why the hasher's shared state is Arc, never Rc."

[[quiz]]
question = "The hasher's workers will share a progress counter. Which type is Send (can move to another thread) but NOT Sync (cannot be shared by &)?"
choices = [
  "i32",
  "Cell<i32>",
  "Rc<i32>",
]
answer = 1

[[quiz]]
question = "Why does thread::spawn refuse a worker closure that captures an Rc<ModJar>?"
choices = [
  "Rc lives on the heap and heap data can never leave the main thread",
  "Rc's counter is not atomic: two workers cloning or dropping at once could corrupt it",
  "Rc is only valid inside a single function",
]
answer = 1
