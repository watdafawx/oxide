title = "One thread per jar"
summary = "Hash a ModJar on its own thread and get the result back with join."

[[objectives]]
test = "spawn_hash_hashes_a_jar_on_a_thread"
label = "spawn_hash(jar) returns a JoinHandle whose result is quick_hash(&jar)"
[[objectives]]
test = "hash_all_keeps_the_mods_folder_order"
label = "hash_all starts one thread per jar and collects hashes in folder order"
[[objectives]]
test = "average_size_survives_an_empty_folder"
label = "average_size returns None when the thread panics (zero jars)"

[[hints]]
text = "`thread::spawn(move || quick_hash(&jar))` returns a `JoinHandle<u64>`. Return it as is."
[[hints]]
text = "Start every thread first (`.map(...).collect::<Vec<_>>()`), then `join().unwrap()` each handle. Joining inside the first loop hashes the jars one by one."
[[hints]]
text = "`handle.join()` is a `Result`: `Err` means the thread panicked. `.ok()` turns it into an `Option`."
