title = "Every file in the game folder"
summary = "fs::read_dir lists one folder; a function that calls itself on each subfolder finds every jar."

[[objectives]]
test = "walk_lists_every_jar_and_config_sorted"
label = "walk lists every file at any depth, not the folders, sorted by path"
[[objectives]]
test = "walk_of_a_missing_mods_folder_is_empty"
label = "A folder that cannot be read gives an empty list"

[[hints]]
text = "`match fs::read_dir(dir) { Ok(entries) => entries, Err(_) => return Vec::new() }` gets the entries. Loop over them with `if let Ok(entry) = entry`, and for each `entry.path()` either push it or call `walk` on it and push everything that comes back."
[[hints]]
text = "`if path.is_dir() { for file in walk(&path) { files.push(file); } } else { files.push(path); }` and `files.sort();` before you return."

[[points]]
after = 2
prompt = "What does entry.path() hand back?"
pick = ["a &str", "the jar's bytes", "a PathBuf", "a DirEntry"]
answer = 2
[[points]]
after = 4
prompt = "Which method says whether a path is a folder?"
code = "if path.___() {"
blank = "is_dir"
