title = "Start them all, then wait"
summary = "One thread per file runs in parallel only if every thread starts before you join any."
kind = "exercise"
xp = 40
minutes = 6
tags = ["threads", "join", "parallel"]

[[objectives]]
test = "check_all_keeps_the_input_order"
label = "check_all returns one checksum per size, in the order of the input"
[[objectives]]
test = "check_all_checks_the_files_at_the_same_time"
label = "Six slow checks finish in about the time of one"

[[hints]]
text = "Two loops. The first one only spawns and pushes each handle into a `Vec`. The second one joins them, in the same order, and pushes each answer."
[[hints]]
text = "`for size in sizes { handles.push(thread::spawn(move || slow_checksum(size))); }` then `for handle in handles { results.push(handle.join().unwrap()); }`."

[[points]]
after = 1
prompt = "Spawn, then join, inside the same loop. How do the threads run?"
pick = ["all at once", "one after another", "in random order", "not at all"]
answer = 1
[[points]]
after = 3
prompt = "Joining handles in the order they were pushed gives answers in which order?"
pick = ["the input order", "the order they finished", "sorted", "reversed"]
answer = 0
