title = "Results flow back through a channel"
summary = "Hash workers send their results to the main thread with mpsc: many producers, one receiver."

[[objectives]]
test = "stream_names_delivers_every_jar_in_order"
label = "stream_names streams every jar name to the returned Receiver, in order"
[[objectives]]
test = "hash_workers_report_and_the_channel_closes"
label = "hash_workers starts several workers and the channel closes when they finish"
[[objectives]]
test = "drain_results_collects_until_workers_hang_up"
label = "drain_results collects every HashResult from a Receiver by iterating it"

[[hints]]
text = "`let (tx, rx) = mpsc::channel();` then move `tx` into the spawned thread and return `rx`."
[[hints]]
text = "Each worker needs its own `tx.clone()`. The original `tx` must be dropped too (`drop(tx)`), otherwise the channel never closes."
[[hints]]
text = "A `Receiver` is iterable: `rx.iter().collect()` ends when every sender is gone."
