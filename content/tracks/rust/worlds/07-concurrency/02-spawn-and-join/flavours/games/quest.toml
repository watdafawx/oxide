title = "A second thread"
summary = "thread::spawn hashes a jar on a new thread; join waits for it and hands back the hash."

[[objectives]]
test = "start_hash_hashes_sodium_on_a_thread"
label = "start_hash returns a JoinHandle whose answer is quick_hash(\"sodium.jar\")"
[[objectives]]
test = "hash_and_wait_returns_the_hash"
label = "hash_and_wait starts the thread, waits for it and returns the hash"

[[hints]]
text = "`thread::spawn` takes a closure with no parameters, `|| ...`. Whatever the closure's last expression is becomes the thread's answer."
[[hints]]
text = "In `start_hash`: `thread::spawn(|| quick_hash(\"sodium.jar\"))`. In `hash_and_wait`: `start_hash().join().unwrap()`."

[[points]]
after = 2
prompt = "What does thread::spawn hand back right away?"
pick = ["the hash", "a Vec of threads", "nothing", "a JoinHandle"]
answer = 3
[[points]]
after = 3
prompt = "Wait for the worker and take its hash."
code = "let hash = handle.___().unwrap();"
blank = "join"
