title = "Hand the jar list to the worker"
summary = "A worker thread can outlive the function that started it, so its closure must own the jars it uses."

[[objectives]]
test = "label_in_thread_owns_the_jar_name"
label = "label_in_thread builds the status line on a thread that owns the jar name"
[[objectives]]
test = "total_bytes_in_thread_takes_the_sizes"
label = "total_bytes_in_thread moves a Vec of sizes into a thread and returns the sum"
[[objectives]]
test = "split_folder_totals_both_halves"
label = "split_folder splits the jars in two and totals each half on its own thread"

[[hints]]
text = "Write `thread::spawn(move || ...)`. Without `move` the closure only borrows `jar_name`, and the worker might outlive it."
[[hints]]
text = "`sizes.iter().sum::<u64>()` needs the type on `sum`."
[[hints]]
text = "`let right = jars.split_off(mid);` leaves the first half in `jars` and returns the second half as a new Vec. Move each Vec into its own thread."

[[points]]
after = 1
prompt = "Which keyword makes a closure own its variables?"
pick = ["move", "ref", "own", "mut"]
answer = 0

[[points]]
after = 4
prompt = "Cut the Vec in two."
code = "let right = v.___(2);"
blank = "split_off"
