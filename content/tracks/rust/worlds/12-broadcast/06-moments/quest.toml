title = "Moments"
summary = "30 seconds left, overtime, hat-tricks and demolition counts: worked out from the events."
kind = "exercise"
xp = 60
minutes = 8
tags = ["state-machine", "match"]

[[objectives]]
test = "thirty_seconds_fires_once"
label = "30 seconds left fires once as the clock passes 30, never in overtime; overtime fires once"
[[objectives]]
test = "hat_trick_on_third_goal"
label = "a hat-trick fires on a player's third goal, not again on the fourth"
[[objectives]]
test = "demos_counted_per_team"
label = "each demolition counts for the attacker's team"

[[hints]]
text = "One `match event` with three arms. UpdateState: compare `game.overtime` with `self.overtime`, then the 30-second flag (above 30 re-arms it). GoalScored: count per scorer with `entry`. Demolish: `self.demos[team]`."
[[hints]]
text = "`if game.time_seconds > 30 { self.thirty_armed = true; } else if !game.overtime && self.thirty_armed { self.thirty_armed = false; moments.push(Moment::ThirtySecondsLeft); }`"

[[points]]
after = 3
prompt = "What stops '30 seconds left' firing on every update below 30?"
pick = ["the armed flag, cleared when it fires", "the clock only sends once", "dedup", "the grace period"]
answer = 0
