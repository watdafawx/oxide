title = "One event shape"
summary = "The Stats API and BakkesMod SOS name the same events differently. Turn both into one enum."
kind = "exercise"
xp = 45
minutes = 7
tags = ["serde", "enums"]

[[objectives]]
test = "goal_scored_parses"
label = "a GoalScored frame becomes GameEvent::GoalScored; the match has 9"
[[objectives]]
test = "sos_and_stats_api_agree"
label = "game:demolish from SOS and Demolish from the Stats API give the same event"
[[objectives]]
test = "unknown_event_kept"
label = "an unknown event keeps its name; broken data or a non-event gives None"

[[hints]]
text = "Read the `Envelope` first, swap an SOS name for its Stats API name with `SOS_NAMES`, then `match` the name and read `data` into the right struct."
[[hints]]
text = "`\"GoalScored\" => GameEvent::GoalScored(serde_json::from_value(data).ok()?),` for each known name, and `other => GameEvent::Other(other.to_string())`."

[[points]]
after = 2
prompt = "Why read the envelope first instead of the whole event at once?"
pick = ["the name decides which struct the data goes into", "serde cannot read nested JSON", "it is faster", "SOS has no data"]
answer = 0
