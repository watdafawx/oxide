title = "Connect and retry"
summary = "Read the live feed with tokio, and connect again when the game restarts."
kind = "exercise"
xp = 60
minutes = 8
tags = ["tokio", "tcp", "channels"]

[[objectives]]
test = "frames_arrive_in_order"
label = "every event of the recorded match arrives through the channel, in order"
[[objectives]]
test = "reconnects_after_drop"
label = "when the game closes the connection, run_feed connects again and keeps reading"

[[hints]]
text = "A `FrameBuffer` and a 4096-byte array; loop: `stream.read(&mut chunk).await`, 0 or an error means closed (`Ok(())`), otherwise push the bytes and send each normalized event."
[[hints]]
text = "`for frame in frames.push(&chunk[..read]) { if let Some(event) = normalize(frame) { events.send(event).await?; } }`: `?` hands back the send error when nobody listens."

[[points]]
after = 3
prompt = "What does a read of 0 bytes mean on a TCP stream?"
pick = ["the other side closed the connection", "no data yet, try again", "an error", "the buffer is full"]
answer = 0
