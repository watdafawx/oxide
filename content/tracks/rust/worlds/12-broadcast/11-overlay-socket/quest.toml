title = "Overlay socket"
summary = "OBS browser sources get the HUD state live over a WebSocket. A slow one never holds up the rest."
kind = "exercise"
xp = 60
minutes = 8
tags = ["axum", "websocket", "broadcast"]

[[objectives]]
test = "overlay_gets_goal"
label = "an overlay connected to /ws gets the update as JSON"
[[objectives]]
test = "lagging_overlay_does_not_block"
label = "an overlay that fell behind skips what it missed and still gets the latest"

[[hints]]
text = "The `Ok(text)` arm sends and checks: `if socket.send(Message::Text(text.into())).await.is_err() { return; }`."
[[hints]]
text = "The other two arms: `Err(broadcast::error::RecvError::Lagged(_)) => continue, Err(broadcast::error::RecvError::Closed) => return,`"

[[points]]
after = 1
prompt = "Why a broadcast channel and not mpsc?"
pick = ["broadcast is faster", "mpsc cannot send strings", "axum needs it for WebSockets", "every overlay needs every update; mpsc gives each message to one receiver"]
answer = 3
[[points]]
after = 2
prompt = "An overlay fell behind and gets Lagged. What happens to the sender?"
pick = ["nothing: it never waits for a slow receiver", "it waits until the overlay catches up", "it drops the whole channel", "it resends the missed messages"]
answer = 0
