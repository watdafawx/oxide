title = "OSC by hand"
summary = "Notch and Resolume take cues as OSC packets over UDP. Build one byte by byte."
kind = "exercise"
xp = 45
minutes = 7
tags = ["bytes", "udp", "protocols"]

[[objectives]]
test = "osc_bytes_match_spec"
label = "the OSC spec's own example, and a message with an int and a string, come out byte for byte"
[[objectives]]
test = "udp_packet_arrives"
label = "send_osc delivers the packet over UDP"

[[hints]]
text = "Address with `pad_str`; the type tags are a `,` then `i`, `f` or `s` per argument, also through `pad_str`; then each argument: numbers as `to_be_bytes()`, strings with `pad_str`."
[[hints]]
text = "`let tags: String = std::iter::once(',').chain(args.iter().map(|arg| match arg { OscArg::Int(_) => 'i', OscArg::Float(_) => 'f', OscArg::Str(_) => 's' })).collect();`"

[[points]]
after = 2
prompt = "Why pad strings to 4 bytes?"
pick = ["every OSC field starts on a 4-byte boundary", "UDP needs it", "to fit ASCII", "for the checksum"]
answer = 0
