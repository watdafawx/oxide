title = "Names against files"
summary = "Which players have no photo, which files belong to nobody, and which are just spelled differently?"
kind = "exercise"
xp = 45
minutes = 7
tags = ["strings", "algorithms"]

[[objectives]]
test = "missing_and_extra_files"
label = "Bram has no file; old_logo.png belongs to nobody; Zoë matches zoe.png"
[[objectives]]
test = "renamed_file_suggested"
label = "Levenshtein distance is right, and Mos.png is suggested as Moss's file"

[[hints]]
text = "Keep one row of distances: start with `0..=b.len()`. For each letter of `a`, build the next row: the cell is the smallest of the diagonal plus the change cost, the cell above plus 1, the cell to the left plus 1."
[[hints]]
text = "`row.push((previous[j] + cost).min(previous[j + 1] + 1).min(row[j] + 1));` with `let cost = usize::from(ca != *cb);`"

[[points]]
after = 3
prompt = "levenshtein(\"moss\", \"mos\") is?"
pick = ["1", "0", "2", "4"]
answer = 0
