title = "Overlay socket"
summary = "OBS browser sources get the HUD state live over a WebSocket. A slow one never holds up the rest."
kind = "exercise"
xp = 60
minutes = 8
tags = ["axum", "websocket", "broadcast"]

[[objectives]]
test = "overlay_gets_goal"
label = "an overlay connected to /ws gets the update as JSON"
[[objectives]]
test = "lagging_overlay_does_not_block"
label = "an overlay that fell behind skips what it missed and still gets the latest"

[[hints]]
text = "A `loop` over `updates.recv().await`: `Ok(text)` goes out with `socket.send(Message::Text(text.into()))`; `Lagged` continues; `Closed` returns. A failed send means the overlay left: return."
[[hints]]
text = "`Err(broadcast::error::RecvError::Lagged(_)) => continue, Err(broadcast::error::RecvError::Closed) => return,`"

[[points]]
after = 2
prompt = "Why a broadcast channel and not mpsc?"
pick = ["every overlay needs every update; mpsc gives each message to one receiver", "broadcast is faster", "mpsc cannot send strings", "axum needs it"]
answer = 0
