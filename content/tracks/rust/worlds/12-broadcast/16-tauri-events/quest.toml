title = "Tauri events"
summary = "Rust tells the pages about every moment as it happens, with a Tauri event."
kind = "exercise"
xp = 40
minutes = 6
tags = ["tauri", "events"]

[[objectives]]
test = "moment_event_emitted_once"
label = "publish_moment sends one moment event with its cue and detail"

[[hints]]
text = "`app.emit(name, payload)` sends to every page; the payload is any `Serialize` value."
[[hints]]
text = "`app.emit(\"moment\", MomentPayload { cue: moment.cue(), detail: moment.detail() })`"

[[points]]
after = 2
prompt = "Command or event: the server just saw a hat-trick. Which tells the pages?"
pick = ["an event: Rust pushes it when it happens", "a command: the page asks every second", "either, they are the same", "neither"]
answer = 0
