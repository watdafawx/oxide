title = "Boss: name tag"
summary = "Two functions, two objectives. Your first boss."
kind = "boss"
xp = 100
minutes = 5
tags = ["format", "boss"]

[[objectives]]
test = "shouts_the_name"
label = "shout(\"ferris\") returns \"FERRIS\""
[[objectives]]
test = "tag_shows_name_and_level"
label = "name_tag(\"ferris\", 3) returns \"[FERRIS] Lv 3\""

[[hints]]
text = "In `shout`, put a dot after `name` and look at the editor's suggestions for a method that makes capitals."
[[hints]]
text = "`shout` is `name.to_uppercase()`. For `name_tag`, call `shout(name)` inside `format!(\"[{}] Lv {level}\", ...)`."

[[points]]
after = 2
prompt = "Which method makes text uppercase?"
pick = ["to_uppercase", "to_string", "trim", "len"]
answer = 0
[[points]]
after = 3
prompt = "Show what a function call returns inside the text."
code = "format!(\"({})\", ___)"
blank = "double(4)"
