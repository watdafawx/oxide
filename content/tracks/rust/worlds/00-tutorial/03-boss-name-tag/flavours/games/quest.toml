title = "Boss: name tag"
summary = "Two functions, two objectives. Your first boss: the tag floating over a player."

[[objectives]]
test = "loud_name_is_uppercase"
label = "loud_name(\"ferris\") returns \"FERRIS\""
[[objectives]]
test = "player_tag_shows_name_and_level"
label = "player_tag(\"ferris\", 3) returns \"[FERRIS] Lv 3\""

[[hints]]
text = "In `loud_name`, put a dot after `name` and look at the editor's suggestions for a method that makes capitals."
[[hints]]
text = "`loud_name` is `name.to_uppercase()`. For `player_tag`, call `loud_name(name)` inside `format!(\"[{}] Lv {level}\", ...)`."

[[points]]
after = 2
prompt = "Which method makes text uppercase?"
pick = ["to_uppercase", "to_string", "trim", "len"]
answer = 0
[[points]]
after = 3
prompt = "Show what a function call returns inside the text."
code = "format!(\"({})\", ___)"
blank = "double(4)"
