title = "Boss: name tag"
summary = "Two functions, two objectives. Your first boss: the tag floating over a player."

[[objectives]]
test = "loud_name_is_uppercase"
label = "loud_name(\"ferris\") returns \"FERRIS\""
[[objectives]]
test = "player_tag_shows_name_and_level"
label = "player_tag(\"ferris\", 3) returns \"[FERRIS] Lv 3\""

[[hints]]
text = "`str` has a method that returns an uppercase `String`. Type `name.` in your editor and look at the completions."
[[hints]]
text = "`player_tag` can call `loud_name`. Numbers go into `format!` just like text: `format!(\"Lv {level}\")`."
