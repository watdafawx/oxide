title = "Say hello"
summary = "Fill in one line, save, and watch the tick turn green."
kind = "exercise"
xp = 30
minutes = 3
tags = ["format"]
requires = []

[[objectives]]
test = "greets_by_name"
label = "greeting(\"Ferris\") returns \"Hello, Ferris!\""

[[hints]]
text = "Replace the `todo!()` line in `greeting`. It is the only line you change."
[[hints]]
text = "Type `format!(\"Hello, {name}!\")` with no `;` at the end."

[[points]]
after = 3
prompt = "What does `{name}` become inside `format!`?"
pick = ["The value of name", "The word name", "Nothing, it is ignored", "An error"]
answer = 0
[[points]]
after = 4
prompt = "Which line hands the text back as the function's answer?"
pick = ["format!(\"Hi {name}\")", "format!(\"Hi {name}\");"]
answer = 0
