title = "Read the red"
summary = "A test fails. Read what it says, fix the number."
kind = "exercise"
xp = 20
minutes = 2
tags = ["tests", "reading-errors"]

[[objectives]]
test = "answer_is_right"
label = "answer() returns what the test expects"

[[hints]]
text = "Click the failed objective: the test prints `left` (what you returned) and `right` (what it wanted)."

[[points]]
after = 2
prompt = "In a failed assert_eq!, which side is what your code returned?"
pick = ["left", "right", "both", "neither"]
answer = 0
