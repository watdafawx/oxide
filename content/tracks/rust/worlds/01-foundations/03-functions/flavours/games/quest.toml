title = "Count the inventory"
summary = "Parameters, return types, and why there is no `return` here."

[[objectives]]
test = "grid_slots_is_side_squared"
label = "grid_slots(side) returns side * side"
[[objectives]]
test = "item_count_multiplies_stacks_by_size"
label = "item_count(stacks, size) returns stacks * size"
[[objectives]]
test = "inventory_line_reuses_item_count"
label = "inventory_line(3, 64) returns \"3x64 = 192\" by calling item_count"

[[hints]]
text = "Last line, **no semicolon**: `side * side`."
[[hints]]
text = "`inventory_line` can call `item_count(stacks, size)` and put the result in `format!(\"{stacks}x{size} = {total}\")`."

[[points]]
after = 1
prompt = "Give the parameter its type."
code = "fn double_stack(___) -> u32 {"
blank = "n: u32"

[[points]]
after = 3
prompt = "Which last line returns the value?"
pick = ["result", "result;", "return;", "()"]
answer = 0
