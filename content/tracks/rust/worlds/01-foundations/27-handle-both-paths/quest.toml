title = "Handle both paths"
summary = "Read a typed number, and answer for success and failure."
kind = "exercise"
xp = 50
minutes = 5
tags = ["result", "match", "parse"]

[[objectives]]
test = "a_number_is_read"
label = "describe_quantity(\" 12 \") gives back \"12 boxes\""
[[objectives]]
test = "junk_is_reported"
label = "describe_quantity(\"pizza\") gives back \"'pizza' is not a quantity\""

[[hints]]
text = "Match on `text.trim().parse::<u32>()`. It has two arms, `Ok(n)` and `Err(_)`."
[[hints]]
text = "`Ok(n) => format!(\"{n} boxes\")` and `Err(_) => format!(\"'{text}' is not a quantity\")`."

[[points]]
after = 2
prompt = "What does `\"pizza\".parse::<u32>()` give?"
pick = ["an Err", "an Ok(0)", "None", "a crash"]
answer = 0
[[points]]
after = 3
prompt = "Match the failure and ignore its reason."
code = "match text.trim().parse::<u32>() {\n    Ok(n) => n,\n    ___ => 0,\n}"
blank = "Err(_)"
