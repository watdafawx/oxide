title = "Count the steps"
summary = "Add up a staircase with a for loop."

[[objectives]]
test = "steps_add_up_to_blocks"
label = "staircase_blocks(4) gives back 10"
[[objectives]]
test = "pyramid_layers_are_squares"
label = "pyramid_blocks(3) gives back 14"

[[hints]]
text = "Both start with `let mut total = 0;` and end with `total`. The loop goes in between."
[[hints]]
text = "`for step in 1..=steps { total += step; }`. The pyramid adds `layer * layer` instead."

[[points]]
after = 2
prompt = "Which range includes 4?"
pick = ["1..4", "1..=4", "..4", "4.."]
answer = 1
[[points]]
after = 3
prompt = "Add each number of the loop to the total."
code = "for step in 1..=3 {\n    ___\n}"
blank = "total += step;"
