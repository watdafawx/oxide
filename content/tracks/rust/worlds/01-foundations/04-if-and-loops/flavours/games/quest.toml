title = "Branch and repeat"
summary = "if as an expression, for and while loops, ranges."

[[objectives]]
test = "slot_label_names_full_empty_or_count"
label = "slot_label picks Full, Empty or the count"
[[objectives]]
test = "staircase_needs_one_through_n_blocks"
label = "staircase_blocks(n) adds 1 through n with a for loop"
[[objectives]]
test = "swings_to_break_counts_until_block_gone"
label = "swings_to_break loops with while until the block is gone"

[[hints]]
text = "`if` is an expression: `if count == 64 { \"Full\".to_string() } else if ... { ... } else { count.to_string() }`."
[[hints]]
text = "`for i in 1..=steps` includes `steps`. `1..steps` stops one short."
[[hints]]
text = "`while block_hp > 0 { block_hp -= damage; swings += 1; }`, then return `swings`."

[[points]]
after = 2
prompt = "Which range includes 4?"
pick = ["1..4", "1..=4", "..4", "1.."]
answer = 1

[[points]]
after = 5
prompt = "Hand a value back out of the loop."
code = "let reach = loop {\n    if radius >= 10 { ___ }\n    radius += 1;\n};"
blank = "break radius * 16;"
