title = "Branch and repeat"
summary = "if as an expression, for and while loops, ranges."
kind = "exercise"
xp = 50
minutes = 9
tags = ["if", "loops", "ranges"]

[[objectives]]
test = "fizzbuzz_words"
label = "fizzbuzz picks Fizz, Buzz, FizzBuzz or the number"
[[objectives]]
test = "sum_to_adds_range"
label = "sum_to(n) adds 1 through n with a for loop"
[[objectives]]
test = "collatz_counts_steps"
label = "collatz_steps loops with while until it reaches 1"

[[hints]]
text = "`if` is an expression: `if n % 3 == 0 { \"Fizz\".to_string() } else { ... }`. Check 15 first."
[[hints]]
text = "`for i in 1..=n` includes `n`. `1..n` stops one short."
[[hints]]
text = "Collatz: while n != 1, if n is even halve it, otherwise `n = 3 * n + 1`, and count each step."

[[points]]
after = 3
prompt = "Which range includes 4?"
pick = ["1..4", "1..=4", "..4", "1.."]
answer = 1

[[points]]
after = 6
prompt = "Hand a value back out of the loop."
code = "let first_big = loop {\n    if size >= 100 { ___ }\n    size *= 2;\n};"
blank = "break size;"
