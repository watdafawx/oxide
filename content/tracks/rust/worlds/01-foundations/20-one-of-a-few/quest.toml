xp = 45
minutes = 5
tags = ["enums", "match"]

[[objectives]]
test = "letters_and_parcels_stack"
label = "max_per_pallet gives 64 for a letter and 16 for a parcel"
[[objectives]]
test = "freight_travels_alone"
