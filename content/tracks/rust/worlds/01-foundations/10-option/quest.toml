title = "Maybe a value"
summary = "Option, unwrap_or and map: handling \"nothing\" without null."
kind = "exercise"
xp = 45
minutes = 8
tags = ["option", "unwrap_or", "map"]

[[objectives]]
test = "half_is_none_for_odd"
label = "half(n) is Some(n / 2) for even n and None for odd n"
[[objectives]]
test = "half_or_zero_falls_back"
label = "half_or_zero uses unwrap_or(0)"
[[objectives]]
test = "half_plus_one_maps_inside"
label = "half_plus_one uses map to change the value inside Some"

[[hints]]
text = "Return `Some(n / 2)` or `None`. Both are `Option<i32>`."
[[hints]]
text = "`half(n).unwrap_or(0)` gives the value, or 0 if it was `None`."
[[hints]]
text = "`half(n).map(|h| h + 1)` runs the closure only if there is a value."

[[points]]
after = 1
prompt = "Which variant means \"missing\"?"
pick = ["Some", "None", "Ok", "Err"]
answer = 1

[[points]]
after = 3
prompt = "Fall back to 0."
code = "let n = door.___(0);"
blank = "unwrap_or"
