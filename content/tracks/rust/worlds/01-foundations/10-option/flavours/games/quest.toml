title = "Recipe lookup"
summary = "Option, unwrap_or and map: handling \"no such recipe\" without null."

[[objectives]]
test = "recipe_output_is_none_for_unknown_items"
label = "recipe_output gives Some(count) for known recipes and None for the rest"
[[objectives]]
test = "output_or_zero_defaults_to_nothing"
label = "output_or_zero uses unwrap_or(0)"
[[objectives]]
test = "double_batch_maps_inside_some"
label = "double_batch uses map to change the value inside Some"

[[hints]]
text = "Return `Some(4)` or `None` from a `match item { ... }`. Both are `Option<u32>`."
[[hints]]
text = "`recipe_output(item).unwrap_or(0)` gives the value, or 0 if it was `None`."
[[hints]]
text = "`recipe_output(item).map(|n| n * 2)` runs the closure only if there is a value."
