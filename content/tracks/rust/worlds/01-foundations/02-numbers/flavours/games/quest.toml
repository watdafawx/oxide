title = "Stack sizes have types"
summary = "Why a stack count is a u32: integer types, f64, `as` casts and overflow."

[[objectives]]
test = "average_stack_keeps_the_half"
label = "average_stack(3, 4) is 3.5, not 3"
[[objectives]]
test = "slot_byte_keeps_low_byte"
label = "slot_byte(300) casts to u8 and gives 44"
[[objectives]]
test = "wrap_count_wraps_past_255"
label = "wrap_count(250, 10) wraps to 4 instead of panicking"

[[hints]]
text = "You cannot mix `i32` and `f64`. Convert first: `a as f64`."
[[hints]]
text = "`(a + b) as f64 / 2.0` works. For `slot_byte`, just `id as u8`."
[[hints]]
text = "Integers have helper methods for overflow. Try `a.wrapping_add(b)`."

[[points]]
after = 2
prompt = "Which keyword converts between number types?"
pick = ["as", "to", "from", "let"]
answer = 0

[[points]]
after = 4
prompt = "Wrap on purpose."
code = "let wrapped = counter.___(100);  // 44, no crash"
blank = "wrapping_add"
