title = "Numbers have sizes"
summary = "Integer types, f64, `as` casts and what happens on overflow."
kind = "exercise"
xp = 40
minutes = 8
tags = ["integers", "floats", "casting"]

[[objectives]]
test = "average_keeps_the_fraction"
label = "average(3, 4) is 3.5, not 3"
[[objectives]]
test = "low_byte_truncates"
label = "low_byte(300) casts to u8 and gives 44"
[[objectives]]
test = "wrap_add_wraps_around"
label = "wrap_add(250, 10) wraps to 4 instead of panicking"

[[hints]]
text = "You cannot mix `i32` and `f64`. Convert first: `a as f64`."
[[hints]]
text = "`(a + b) as f64 / 2.0` works. For `low_byte`, just `n as u8`."
[[hints]]
text = "Integers have helper methods for overflow. Try `a.wrapping_add(b)`."
