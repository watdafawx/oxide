title = "A rule you can reuse"
summary = "Crates to sheets for any number of crates: your first function."
kind = "exercise"
xp = 40
minutes = 5
tags = ["functions"]

[[objectives]]
test = "sheets_for_any_crate_count"
label = "sheets(crates) gives four sheets per crate"
[[objectives]]
test = "boxes_for_any_sheet_count"
label = "boxes(sheets) gives two boxes per sheet"

[[hints]]
text = "The body of `sheets` is one line with no semicolon: `crates * 4`."
[[hints]]
text = "`boxes` is the same shape with its own name and number: `sheets * 2`."

[[points]]
after = 2
prompt = "In `fn sheets(crates: u32) -> u32`, which part says what comes out?"
pick = ["-> u32", "crates: u32", "fn", "sheets"]
answer = 0
[[points]]
after = 3
prompt = "Write the body line that hands back four sheets per crate."
code = "fn sheets(crates: u32) -> u32 {\n    ___\n}"
blank = "crates * 4"
