title = "Change it in place"
summary = "Take items out of a stack: the first time a method needs &mut self."

[[objectives]]
test = "taking_removes_items"
label = "take(30) leaves 34 of 64 items"
[[objectives]]
test = "taking_too_many_stops_at_zero"
label = "take(100) leaves 0, not a crash"

[[hints]]
text = "Write the body of `take` first. Save, read the error, and change `&self` the way it says."
[[hints]]
text = "`self.count = self.count.saturating_sub(amount);` and `&mut self` in the first line."

[[points]]
after = 2
prompt = "Which self lets a method change the struct?"
pick = ["self", "&self", "&mut self", "mut"]
answer = 2
[[points]]
after = 3
prompt = "The caller's stack must allow changes too."
code = "let ___ stack = ItemStack::new(\"stone\");\nstack.take(5);"
blank = "mut"
