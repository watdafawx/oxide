title = "One of several shapes"
summary = "Enums whose variants carry data, plus methods on them."
kind = "exercise"
xp = 50
minutes = 9
tags = ["enums", "impl"]

[[objectives]]
test = "circle_area_uses_pi"
label = "Shape::Circle(r).area() is PI * r * r"
[[objectives]]
test = "rect_and_square_areas"
label = "Rect and Square areas work too"
[[objectives]]
test = "names_describe_each_variant"
label = "name() returns \"circle\", \"rect\" or \"square\""

[[hints]]
text = "Inside `impl Shape`, `match self { Shape::Circle(r) => ..., ... }` gives you each variant's data."
[[hints]]
text = "`use std::f64::consts::PI;` then `PI * r * r`. Rect has two named fields: `Shape::Rect { w, h } => w * h`."
