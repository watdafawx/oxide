title = "How Rust thinks"
summary = "Compile-time checks, no null, no exceptions, seen through the crafting calculator."

[[quiz]]
question = "You add the text \"oak_log\" to the number 64 in your calculator. When does Rust catch that?"
choices = ["At runtime, when that line runs", "At compile time, before it runs", "Never, Rust silently turns it into text"]
answer = 1
[[quiz]]
question = "A recipe lookup might not find the item you asked for. How does Rust say that?"
choices = ["It returns null, like most languages", "It throws an exception the caller can catch", "It returns an Option: Some or None"]
answer = 2
