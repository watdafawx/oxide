title = "Boxes with names"
summary = "let, mut and shadowing: how Rust stores a value."
kind = "exercise"
xp = 30
minutes = 3
tags = ["variables", "mut", "shadowing"]

[[objectives]]
test = "bonus_is_added_to_score"
label = "score_with_bonus() returns 15"
[[objectives]]
test = "trimmed_len_ignores_spaces"
label = "trimmed_len shadows `text` with the trimmed version"

[[hints]]
text = "A plain `let` can never change. Write `let mut score = 10;` so you can do `score += 5;`."
[[hints]]
text = "For `trimmed_len`: `let text = text.trim();` makes a new `text`, then return `text.len()`."
