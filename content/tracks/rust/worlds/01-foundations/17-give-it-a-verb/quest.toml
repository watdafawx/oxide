title = "Give it a verb"
summary = "Ask a pallet questions with a method."
kind = "exercise"
xp = 40
minutes = 4
tags = ["structs", "impl"]

[[objectives]]
test = "an_empty_pallet_is_empty"
label = "is_empty is true only at 0 boxes"
[[objectives]]
test = "only_64_boxes_is_full"
label = "is_full is true only at 64 boxes"

[[hints]]
text = "Both methods sit inside `impl Pallet`. Each is one line that reads `self.boxes`."
[[hints]]
text = "`self.boxes == 0` and `self.boxes == 64`, with no semicolon."

[[points]]
after = 2
prompt = "How do you call the method `is_full` on `pallet`?"
pick = ["pallet.is_full()", "is_full(pallet)", "pallet::is_full", "pallet->is_full()"]
answer = 0
[[points]]
after = 3
prompt = "Read the field inside a method."
code = "fn is_big(&self) -> bool {\n    ___.slots > 27\n}"
blank = "self"
