title = "A fallback"
summary = "Get the number out of an Option, with a plan for None."

[[objectives]]
test = "known_recipes_give_their_count"
label = "output_or_zero(\"planks\") gives 4 and (\"bedrock\") gives 0"
[[objectives]]
test = "crafts_multiply_the_count"
label = "total_output(\"planks\", 3) gives back 12"

[[hints]]
text = "Both functions call `recipe_output(item)` and then add `.unwrap_or(0)` to the end."
[[hints]]
text = "`recipe_output(item).unwrap_or(0)`. In `total_output`, multiply that by `crafts`."

[[points]]
after = 2
prompt = "What does `None.unwrap_or(0)` give?"
pick = ["0", "None", "an error", "nothing"]
answer = 0
[[points]]
after = 2
prompt = "Fall back to 1 when there is no value."
code = "let n = recipe_output(item).___(1);"
blank = "unwrap_or"
