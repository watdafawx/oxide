title = "A notes API on SQLite"
summary = "Share one rusqlite Connection through State and serve create, list, get and delete."
kind = "exercise"
xp = 80
minutes = 15
tags = ["axum", "rusqlite", "crud", "state"]

[[objectives]]
test = "create_returns_201_and_the_row"
label = "POST /notes stores a note and returns 201 with its id"
[[objectives]]
test = "list_returns_notes_in_order"
label = "GET /notes returns every note, oldest first"
[[objectives]]
test = "get_missing_note_is_404"
label = "GET /notes/{id} gives the note, or 404 when there is none"
[[objectives]]
test = "delete_removes_the_note"
label = "DELETE /notes/{id} answers 204 once, then 404"

[[hints]]
text = "Lock first: `let conn = db.lock().unwrap();`. Then it is the same rusqlite you already know. Map failures with `.map_err(internal)?`."
[[hints]]
text = "`create`: execute the INSERT with `params![new.body]`, then `let id = conn.last_insert_rowid();` and return `Ok((StatusCode::CREATED, Json(Note { id, body: new.body })))`."
[[hints]]
text = "`get_one`: `conn.query_row(sql, params![id], |r| Ok(Note { id: r.get(0)?, body: r.get(1)? })).optional()` gives `Option<Note>`. `remove`: `conn.execute(\"DELETE ...\", params![id])` returns the number of rows deleted; 0 means 404."

[[points]]
after = 2
prompt = "What wraps the connection so handlers can share it?"
pick = ["Arc<Mutex<Connection>>", "Rc<Connection>", "Box<Connection>", "Cell<Connection>"]
answer = 0

[[points]]
after = 5
prompt = "Turn \"no row\" into Ok(None)."
code = ".query_row(sql, params![id], |r| Ok(r.get(0)?))\n.___()\n.map_err(internal)?;"
blank = "optional"
