title = "The mod database API"
summary = "Put axum in front of SQLite: create, list, fetch and delete mods over HTTP."

[[objectives]]
test = "adding_a_mod_returns_201_and_the_row"
label = "POST /mods stores a mod and returns 201 with its id"
[[objectives]]
test = "listing_returns_mods_in_order"
label = "GET /mods returns every mod, oldest first"
[[objectives]]
test = "fetching_a_missing_mod_is_404"
label = "GET /mods/{id} gives the mod, or 404 when there is none"
[[objectives]]
test = "deleting_removes_the_mod"
label = "DELETE /mods/{id} answers 204 once, then 404"

[[hints]]
text = "Share the connection as `Arc<Mutex<Connection>>` in `State`. Lock it inside the handler, run the SQL, and let the guard drop at the end."
[[hints]]
text = "`query_row(..).optional()?` (from `OptionalExtension`) gives `Option<ModRow>`. `None` becomes `StatusCode::NOT_FOUND`."
[[hints]]
text = "`conn.execute(\"DELETE ...\")` returns the number of rows deleted. 0 means 404, otherwise 204."
