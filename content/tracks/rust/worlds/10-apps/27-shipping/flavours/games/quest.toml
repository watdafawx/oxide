title = "Shipping the mod manager"
summary = "A release build, a smaller binary, where installers land, and where the player's mod database must live."

[[quiz]]
question = "You want a smaller, faster release binary of the mod manager and don't mind a longer build. Which Cargo.toml section does that?"
choices = [
  "[dependencies] with every crate set to default-features = false so nothing extra gets linked",
  "[profile.release] with lto = true, codegen-units = 1 and strip = true",
  "[profile.dev] with opt-level = 0 and debug = true, which keeps every symbol for the debugger",
]
answer = 1

[[quiz]]
question = "Where should the mod manager keep the player's mod database and settings?"
choices = [
  "Next to the executable, so the whole app stays portable and can be moved around freely",
  "In the current working directory, wherever the app was launched from, so it is easy to find",
  "In the OS app-data folder (%APPDATA% on Windows), found with the dirs crate",
]
answer = 2
