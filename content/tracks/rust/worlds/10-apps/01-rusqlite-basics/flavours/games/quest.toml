title = "The mod database's first table"
summary = "Open an in-memory SQLite database, create the mods table, add rows and read them back."

[[objectives]]
test = "add_mod_hands_out_ids_in_order"
label = "add_mod inserts a row and returns its id"
[[objectives]]
test = "list_mods_returns_rows_in_id_order"
label = "list_mods reads every row back as an InstalledMod"

[[hints]]
text = "`conn.execute(\"INSERT INTO mods (name, enabled) VALUES (?1, 1)\", params![name])?;` then `conn.last_insert_rowid()` is the new id."
[[hints]]
text = "`conn.prepare(\"SELECT id, name, enabled FROM mods ORDER BY id\")?` then `stmt.query_map([], |row| Ok(InstalledMod { id: row.get(0)?, .. }))?`."
[[hints]]
text = "`query_map` returns an iterator of `Result` rows: `rows.collect()` turns it into `Result<Vec<_>>`."
