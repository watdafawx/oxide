title = "Old saves still load"
summary = "Add #[serde(default)] so a save file from before a field existed still reads, with sensible values for the gaps."
kind = "exercise"
xp = 30
minutes = 4
tags = ["serde", "json", "default"]

[[objectives]]
test = "an_old_save_with_only_xp_still_loads"
label = "from_json(r#\"{\"xp\": 120}\"#) gives a Profile with 120 XP and defaults for the rest"
[[objectives]]
test = "missing_settings_use_their_defaults"
label = "a save whose settings only mention sound still gets focus_minutes 25"

[[hints]]
text = "Two structs, the same fix: each needs a `Default` (derive it on `Profile`; `Settings` already has one) and the attribute `#[serde(default)]` on the line above `pub struct ...`."
[[hints]]
text = "On `Profile`: `#[derive(Debug, Clone, PartialEq, Default, Serialize, Deserialize)]` then `#[serde(default)]`. On `Settings`, add `#[serde(default)]` under its derive line."

[[points]]
after = 2
prompt = "Where does #[serde(default)] take a missing field's value from?"
pick = ["From the type's Default", "From the last save file", "It leaves the field empty", "From the first field of the struct"]
answer = 0
[[points]]
after = 3
prompt = "Let a struct fill in missing fields."
code = "#[derive(Default, Serialize, Deserialize)]\n___\nstruct Window { width: u32 }"
blank = "#[serde(default)]"
