title = "Say no with a status"
summary = "Answer an empty file list with 400 Bad Request and a JSON error, by returning a Result from the handler."

[[objectives]]
test = "an_empty_list_is_400_with_an_error"
label = "POST /total-size with {\"sizes_mb\": []} answers 400 and {\"error\": ...}"
[[objectives]]
test = "a_full_list_still_answers_200"
label = "a list with sizes still answers 200 with the total"

[[hints]]
text = "Change the return type to `Result<Json<Total>, (StatusCode, Json<ApiError>)>`. Check `req.sizes_mb.is_empty()` first and `return Err((..))`; wrap the old answer in `Ok(..)`."
[[hints]]
text = "`if req.sizes_mb.is_empty() { return Err((StatusCode::BAD_REQUEST, Json(ApiError { error: \"no files to download\".into() }))); }` then `Ok(Json(Total { total_mb: req.sizes_mb.iter().sum() }))`."

[[points]]
after = 2
prompt = "A handler returns Err((StatusCode::BAD_REQUEST, Json(e))). What does the client get?"
pick = ["200 with the error inside", "500, because it is an Err", "400 with e as the JSON body", "Nothing: the request is dropped"]
answer = 2
[[points]]
after = 3
prompt = "Pick the status for \"your request makes no sense\"."
code = "return Err((StatusCode::___, Json(err)));"
blank = "BAD_REQUEST"
