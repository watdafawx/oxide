title = "What a request is"
summary = "How a screen asks a server for data over HTTP: method, path, body, and the status code that comes back."
kind = "read"
xp = 15
minutes = 5
tags = ["http", "web", "api"]

[[quiz]]
question = "The screen wants to add a new quest to the engine. Which request fits?"
choices = ["GET /quests with no body", "POST /quests with the quest as JSON in the body", "DELETE /quests/new"]
answer = 1

[[quiz]]
question = "The screen asks for GET /quests/99, and there is no quest 99. Which status should come back?"
choices = ["404 Not Found", "200 OK with an empty body", "500 Internal Server Error"]
answer = 0

[[quiz]]
question = "What is a route?"
choices = ["The network cable between the screen and the server", "A method and a path matched to the function that answers them", "The list of every request the server has seen"]
answer = 1
