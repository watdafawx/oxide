title = "JSON in, JSON out for the mod API"
summary = "Path parameters, JSON bodies, error statuses and shared state in axum handlers."

[[objectives]]
test = "welcome_greets_the_player_in_json"
label = "GET /welcome/{player} returns {\"welcome\": \"Welcome, player!\"}"
[[objectives]]
test = "total_size_adds_the_files"
label = "POST /total-size with {\"sizes_kb\": [..]} returns {\"total_kb\": n}"
[[objectives]]
test = "total_size_of_nothing_is_400"
label = "an empty list answers 400 with {\"error\": ...}"
[[objectives]]
test = "installs_count_across_requests"
label = "POST /installs returns 201 and the count grows; GET /installs sees it"

[[hints]]
text = "`Path(player): Path<String>` extracts `{player}` from the URL. Return `Json(Welcome { .. })`."
[[hints]]
text = "Return `Result<Json<Total>, (StatusCode, Json<ApiError>)>`: `Err((StatusCode::BAD_REQUEST, Json(..)))` for an empty list."
[[hints]]
text = "`State(state): State<AppState>` gives the shared counter. `state.count.fetch_add(1, Ordering::SeqCst) + 1` is the new count. One route can have two methods: `get(count).post(bump)`."
