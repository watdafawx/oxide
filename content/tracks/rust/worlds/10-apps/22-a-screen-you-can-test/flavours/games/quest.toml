title = "A settings screen you can test"
summary = "Draw the render-distance picker with egui buttons and a label, and click them from a test without a window."

[[objectives]]
test = "plus_button_raises_the_distance"
label = "the screen shows Render distance: 12, and clicking + makes it Render distance: 13"
[[objectives]]
test = "minus_button_never_goes_below_two"
label = "clicking - lowers the distance but never below 2"
[[objectives]]
test = "reset_button_goes_back_to_twelve"
label = "the Reset button sets the distance back to 12"

[[hints]]
text = "In `ui`: `ui.horizontal(|ui| { .. })` holds the `-` button, the label and the `+` button; the Reset button goes after it. Each button is `if ui.button(\"..\").clicked() { self.method(); }`, and the label is `ui.label(self.label())`."
[[hints]]
text = "`ui.horizontal(|ui| { if ui.button(\"-\").clicked() { self.closer(); } ui.label(self.label()); if ui.button(\"+\").clicked() { self.farther(); } }); if ui.button(\"Reset\").clicked() { self.reset(); }`"

[[points]]
after = 3
prompt = "When is ui.button(\"+\").clicked() true?"
pick = ["On every frame after the first click", "On the frame the button was clicked", "Only inside a test", "When the mouse is over it"]
answer = 1
[[points]]
after = 5
prompt = "Click the button from the test."
code = "harness.get_by_label(\"+\").___();"
blank = "click"
