title = "Commands the page can call"
summary = "Wrap plain functions in #[tauri::command], register them with manage and generate_handler!, and call them through a mock app."
kind = "exercise"
xp = 60
minutes = 8
tags = ["tauri", "commands", "state", "testing"]

[[objectives]]
test = "award_xp_answers_through_the_mock_app"
label = "invoke(\"award_xp\", { amount: 250 }) answers {\"xp\": 250, \"level\": 3}"
[[objectives]]
test = "start_quest_answers_and_rejects_repeats"
label = "invoke(\"start_quest\", { id }) answers the started ids, and rejects the same id twice"

[[hints]]
text = "Each command is a private `fn` with `#[tauri::command]` above it, a `state: tauri::State<'_, Mutex<AppState>>` parameter plus the argument, and one line that locks the state and calls the `_inner` function. In `build_app`, chain `.manage(..)` and `.invoke_handler(tauri::generate_handler![..])` on `builder`."
[[hints]]
text = "`#[tauri::command] fn award_xp(state: tauri::State<'_, Mutex<AppState>>, amount: u32) -> Profile { award_xp_inner(&mut state.lock().unwrap(), amount) }`, the same shape for `start_quest(.., id: String) -> Result<Vec<String>, String>`, and `builder.manage(Mutex::new(AppState::default())).invoke_handler(tauri::generate_handler![award_xp, start_quest])`."

[[points]]
after = 2
prompt = "Which attribute makes a Rust fn callable from the page?"
pick = ["#[derive(Command)]", "#[tauri::command]", "#[invoke]", "#[export]"]
answer = 1
[[points]]
after = 4
prompt = "Register the shared state once."
code = "builder.___(Mutex::new(AppState::default()))"
blank = "manage"
