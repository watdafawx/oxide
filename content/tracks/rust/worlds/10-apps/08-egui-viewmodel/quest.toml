title = "A counter you can test"
summary = "Keep state in a view model, draw it with egui, and click the buttons from a test."
kind = "exercise"
xp = 70
minutes = 12
tags = ["egui", "kittest", "ui", "testing"]
requires = ["10-apps/07-mod-card-text"]

[[objectives]]
test = "model_counts_up_and_down"
label = "increment, decrement (never below 0), reset and label() work without any UI"
[[objectives]]
test = "plus_button_updates_label"
label = "clicking the + button makes the label read Count: 1"
[[objectives]]
test = "reset_button_goes_back_to_zero"
label = "the Reset button sets the counter back to 0"

[[hints]]
text = "The model first: `self.count += 1`, `self.count = self.count.saturating_sub(1)`, `self.count = 0`, and `format!(\"Count: {}\", self.count)`. No egui needed yet."
[[hints]]
text = "In `ui`, a button is a condition: `if ui.button(\"+\").clicked() { self.increment(); }`. Do the same for `-` and `Reset`."
[[hints]]
text = "Draw the label with `ui.label(self.label());`. Put `-`, the label and `+` inside `ui.horizontal(|ui| { ... })`, and Reset below it."
