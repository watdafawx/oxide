title = "Not found is 404"
summary = "Serve GET and DELETE /quests/{id}: .optional() tells \"no such row\" apart from a broken database."
kind = "exercise"
xp = 50
minutes = 7
tags = ["axum", "rusqlite", "optional", "status-codes"]

[[objectives]]
test = "get_missing_quest_is_404"
label = "GET /quests/{id} answers the quest, or 404 when there is no such id"
[[objectives]]
test = "delete_answers_204_once_then_404"
label = "DELETE /quests/{id} answers 204 No Content once, then 404"

[[hints]]
text = "`get_one`: `query_row(..).optional().map_err(internal)?` gives an `Option<Quest>`; `match` it into `Ok(Json(q))` or `Err(StatusCode::NOT_FOUND)`. `remove`: `execute` gives the number of deleted rows; 0 means 404."
[[hints]]
text = "`let found = conn.query_row(\"SELECT id, title, xp FROM quests WHERE id = ?1\", params![id], |r| Ok(Quest { id: r.get(0)?, title: r.get(1)?, xp: r.get(2)? })).optional().map_err(internal)?;` and `let deleted = conn.execute(\"DELETE FROM quests WHERE id = ?1\", params![id]).map_err(internal)?; if deleted == 0 { Err(StatusCode::NOT_FOUND) } else { Ok(StatusCode::NO_CONTENT) }`."

[[points]]
after = 2
prompt = "What does .optional() turn \"no row\" into?"
pick = ["Ok(None)", "Err(NotFound)", "a panic", "Ok(Some(0))"]
answer = 0
[[points]]
after = 4
prompt = "A DELETE changed 0 rows. Which status?"
pick = ["204 No Content", "200 OK", "500 Internal Server Error", "404 Not Found"]
answer = 3
