title = "Never glue a mod name in"
summary = "Insert a mod with ?1 placeholders and params!, so Xaero's Minimap or a sneaky name can't break the SQL."

[[objectives]]
test = "a_name_with_an_apostrophe_is_stored_as_typed"
label = "add_mod stores \"Xaero's Minimap\" and returns ids 1, 2, ..."
[[objectives]]
test = "a_name_that_looks_like_sql_is_only_text"
label = "a mod name full of SQL is stored as plain text and deletes nothing"

[[hints]]
text = "The SQL text stays the same for every mod: put `?1` where the name goes and `?2` where the enabled flag goes, with no quotes around them. The values go in the second argument of `execute` instead of `[]`."
[[hints]]
text = "Add `params` to the `use rusqlite::{..}` line, then `conn.execute(\"INSERT INTO mods (name, enabled) VALUES (?1, ?2)\", params![name, enabled])?;` and drop the `format!` line."

[[points]]
after = 2
prompt = "Why does the name Xaero's Minimap break the glued-in SQL?"
pick = ["SQLite cannot store names longer than ten letters", "The ' inside the name ends the SQL text early", "format! removes every apostrophe from its input", "TEXT columns refuse punctuation"]
answer = 1
[[points]]
after = 4
prompt = "Fill the values in next to the SQL."
code = "conn.execute(\"INSERT INTO mods (name, enabled) VALUES (?1, ?2)\", ___)?;"
blank = "params![name, enabled]"
