title = "Boss: Oxide in Rust"
summary = "Port Oxide's home card, quest screen and level-up modal to egui, driven by a fake Api."
kind = "boss"
xp = 500
minutes = 90
tags = ["egui", "kittest", "serde", "traits", "boss"]

[[objectives]]
test = "xp_fraction_is_progress_through_level"
label = "xp_fraction(&Profile) is xp_into_level / xp_for_next, between 0 and 1"
[[objectives]]
test = "home_shows_next_quest_card"
label = "Home shows Level, XP, and the next quest's title with a Start button"
[[objectives]]
test = "start_opens_the_quest_screen"
label = "clicking Start calls Api::start_quest and shows 0/N objectives"
[[objectives]]
test = "red_check_shows_zero_of_n"
label = "Run checks with a red CheckResult keeps every objective unticked"
[[objectives]]
test = "green_check_ticks_all_and_shows_xp_toast"
label = "a green CheckResult ticks N/N and the Completion shows a +XP toast"
[[objectives]]
test = "level_up_shows_modal_until_continue"
label = "a Completion that levels up opens the Level up! modal; Continue closes it"
[[objectives]]
test = "escape_returns_home"
label = "Esc on the quest screen goes back to Home (and refreshes it from the Api)"

[[hints]]
text = "Start with the plain functions `xp_fraction` and `passed_count`: no UI needed. Guard `xp_for_next == 0`, then `(profile.xp_into_level as f32 / profile.xp_for_next as f32).clamp(0.0, 1.0)`. `passed_count` is `result.objectives.iter().filter(|o| o.status == ObjectiveStatus::Passed).count()`."
[[hints]]
text = "The state methods: `start`: `let detail = self.api.start_quest(id); self.last = detail.last_check.clone(); self.detail = Some(detail); self.toast = None; self.screen = Screen::Quest;` `run_checks` stores `outcome.result` in `self.last`, and for `Some(completion)` sets `self.toast` (when `xp_awarded > 0`) and `self.level_up` (when the level rose)."
[[hints]]
text = "`home_ui`: `ui.heading`, `ui.label(format!(..))`, `ui.add(egui::ProgressBar::new(xp_fraction(..)))`, then `match &self.home.next` for the card. The Start button needs a click handler."
[[hints]]
text = "Don't call `self.start(..)` inside that match (it borrows `self.home`): keep the clicked id in a local `Option<String>` and call `self.start` after the match. `quest_ui` has the same trap: clone the title and objectives out of `self.detail` first."
[[hints]]
text = "`level_up_modal`: `let response = egui::Modal::new(egui::Id::unique(\"level_up\")).show(ctx, |ui| { ui.heading(\"Level up!\"); ... if ui.button(\"Continue\").clicked() { close = true; } });` then `if close || response.should_close() { self.level_up = None; }`."
[[hints]]
text = "Esc is `ui.input(|i| i.key_pressed(egui::Key::Escape))`; ignore it while `self.level_up` is open, and refresh `self.home` from the Api when you go back."

[[points]]
after = 9
prompt = "Which forces a number into a range?"
pick = ["clamp", "min", "abs", "round"]
answer = 0

[[points]]
after = 11
prompt = "Leave early when there is no detail."
code = "let Some(d) = &self.detail ___ { return; };"
blank = "else"
