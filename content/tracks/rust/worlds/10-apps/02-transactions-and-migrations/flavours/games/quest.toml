title = "Upgrade the mod database without losing mods"
summary = "Versioned migrations and transactions: bring old databases up to date, and add many mods all or nothing."

[[objectives]]
test = "migrate_builds_the_latest_mod_schema"
label = "migrate() on a fresh database ends at version 2 with the mods table"
[[objectives]]
test = "migrate_upgrades_an_old_db_and_keeps_mods"
label = "migrate() upgrades a version-1 database without losing rows"
[[objectives]]
test = "add_mods_inserts_every_name"
label = "add_mods inserts every name in one transaction"
[[objectives]]
test = "add_mods_rolls_back_on_a_bad_name"
label = "if one insert fails, none of them stay"

[[hints]]
text = "`let tx = conn.transaction()?;` ... `tx.commit()`. If you return early with `?`, the transaction is rolled back when `tx` is dropped."
[[hints]]
text = "`if v < 1 { tx.execute_batch(\"CREATE TABLE ...\")?; }` then `if v < 2 { ... }`. Finish with `tx.pragma_update(None, \"user_version\", 2)?;`."
[[hints]]
text = "`add_mods`: prepare the INSERT once on `tx`, run it for each name with `stmt.execute(params![name])?`, then `tx.commit()?`."
