title = "Pick a UI stack"
summary = "egui, GPUI or Tauri: how each one draws, and when to reach for it."
kind = "read"
xp = 15
minutes = 4
tags = ["egui", "gpui", "tauri", "ui"]

[[quiz]]
question = "What is the real difference between egui (immediate mode) and GPUI (retained mode)?"
choices = [
  "egui draws with HTML and CSS inside a webview; GPUI draws native widgets from a setter-driven tree",
  "egui keeps a tree of widget objects you update with setters; GPUI has no state of its own at all",
  "egui redraws everything from your state each frame; GPUI keeps views and repaints on notify",
]
answer = 2

[[quiz]]
question = "You already have a polished Svelte UI and want a desktop app, with Rust doing the files and database work. Which stack fits?"
choices = [
  "egui, because immediate mode is the quickest way to port an existing web UI to Rust",
  "GPUI, because it renders Svelte components on the GPU for you without any webview",
  "Tauri: the webview shows your Svelte app, Rust commands do the native work",
]
answer = 2
