title = "Mod manager commands without a window"
summary = "Write Tauri commands for the mod manager as plain functions, then call them through a mock app."

[[objectives]]
test = "tier_rises_every_100_mb"
label = "tier_for(mb) is 1 at 0 MB and goes up every 100 MB"
[[objectives]]
test = "add_download_adds_and_reports_the_tier"
label = "add_download_inner adds to the state and returns the new PackStats"
[[objectives]]
test = "install_mod_rejects_blank_and_duplicate_ids"
label = "install_mod_inner records ids, and refuses blank or repeated ones"
[[objectives]]
test = "commands_work_through_the_mock_app"
label = "both commands answer when invoked through tauri::test::mock_builder"

[[hints]]
text = "`mb / 100 + 1` is integer division: 99 / 100 is 0, so tier 1; 100 / 100 is 1, so tier 2."
[[hints]]
text = "`install_mod_inner`: check `id.trim().is_empty()` and `state.installed.contains(&id)` first and return `Err(..)` before changing anything. Then `push` and return a clone."
[[hints]]
text = "The commands are one-liners: lock the `Mutex` in `tauri::State` and call the `_inner` function. `build_app` is given."
