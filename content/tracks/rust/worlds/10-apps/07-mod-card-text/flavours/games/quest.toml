title = "Text for a mod card"
summary = "Turn mod rows into the text lines the egui screen will draw. A quick win."

[[objectives]]
test = "card_line_shows_a_checkbox"
label = "card_line gives \"[x] name\" for enabled mods and \"[ ] name\" for disabled ones"
[[objectives]]
test = "pack_summary_counts_enabled_mods"
label = "pack_summary gives \"2 of 3 mods enabled\""

[[hints]]
text = "`if enabled { \"[x]\" } else { \"[ ]\" }` picks the box; `format!(\"{mark} {name}\")` joins it."
[[hints]]
text = "`pack_summary`: count with `mods.iter().filter(|(_, on)| *on).count()`, then `format!(\"{on} of {} mods enabled\", mods.len())`."
