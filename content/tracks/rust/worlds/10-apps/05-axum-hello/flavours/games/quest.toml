title = "The mod server's first route"
summary = "Serve GET /status with axum: a route, a handler, and what happens on the wrong method or path."

[[objectives]]
test = "status_is_200_online"
label = "GET /status answers 200 with the body online"
[[objectives]]
test = "post_to_status_is_405"
label = "POST /status is refused with 405 Method Not Allowed"
[[objectives]]
test = "unknown_path_is_404"
label = "any other path is 404"

[[hints]]
text = "A handler is just an `async fn` returning something axum can turn into a response. A `&'static str` becomes a 200 plain-text body."
[[hints]]
text = "`Router::new().route(\"/status\", get(status))` wires path + method to the handler."
[[hints]]
text = "405 and 404 come for free: only declare the one `get` route."
