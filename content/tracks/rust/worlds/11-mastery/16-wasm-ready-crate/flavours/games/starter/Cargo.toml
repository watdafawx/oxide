[package]
name = "mastery_wasm_ready"
version = "0.1.0"
edition = "2024"

[lib]
# cdylib: the library format a .wasm is made from. rlib: a normal Rust library, for tests.
crate-type = ["cdylib", "rlib"]

# Only compiled when building for wasm32; native `cargo test` never builds it.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[workspace]
