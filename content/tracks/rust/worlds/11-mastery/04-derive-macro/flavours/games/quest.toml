title = "A derive for chunk info"
summary = "Write #[derive(ChunkInfo)]: a proc-macro that reads a struct or enum and adds a describe() method."

[[objectives]]
test = "struct_reports_name_and_field_count"
label = "A struct says its name and how many fields it has"
[[objectives]]
test = "enum_says_enum"
label = "An enum says its name and that it is an enum"
[[objectives]]
test = "generic_struct_gets_a_correct_impl"
label = "Generic structs get a correct impl too"

[[hints]]
text = "`match &input.data { Data::Struct(s) => ..., Data::Enum(_) => ..., Data::Union(_) => ... }`."
[[hints]]
text = "`s.fields.len()` is the number of fields. Build the text with `format!(\"{name} with {n} fields\")`."
[[hints]]
text = "The `quote!` block already uses `#impl_generics #name #ty_generics #where_clause`, which is what makes generic structs work."

[[points]]
after = 4
prompt = "Which DeriveInput field is the type's name?"
pick = ["ident", "generics", "data", "attrs"]
answer = 0

[[points]]
after = 5
prompt = "Build the tokens."
code = "___! {\n    impl #impl_g #name #ty_g #where_c {}\n}"
blank = "quote"
