title = "Write a derive"
summary = "Teach `#[derive(Hello)]` to add a `hello()` method using syn and quote."
kind = "exercise"
xp = 70
minutes = 14
tags = ["macros", "proc-macro", "syn", "quote"]

[[objectives]]
test = "struct_reports_field_count"
label = "A struct says its name and how many fields it has"
[[objectives]]
test = "enum_says_enum"
label = "An enum says its name and that it is an enum"
[[objectives]]
test = "generic_struct_works"
label = "Generic structs get a correct impl too"

[[hints]]
text = "Edit `derive_hello/src/lib.rs`, not the root crate. `input.data` is a `syn::Data`: match `Data::Struct(s)` and use `s.fields.len()`."
[[hints]]
text = "Build the sentence as a plain `String` first: `format!(\"{name} with {n} fields\")` for structs, `format!(\"{name} (enum)\")` for enums. Put it into `quote!` as `#text`."
[[hints]]
text = "```\nlet text = match &input.data {\n    Data::Struct(s) => { let n = s.fields.len(); format!(\"{name} with {n} fields\") }\n    Data::Enum(_) => format!(\"{name} (enum)\"),\n    Data::Union(_) => format!(\"{name} (union)\"),\n};\n```"

[[points]]
after = 3
prompt = "Which macro parses the input?"
pick = ["parse_macro_input!", "quote!", "format!", "vec!"]
answer = 0

[[points]]
after = 5
prompt = "Build the tokens."
code = "___! {\n    impl #impl_g #name #ty_g #where_c {}\n}"
blank = "quote"
