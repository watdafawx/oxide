title = "Proc-macros in one screen"
summary = "Three kinds of procedural macro, and why they live in their own crate."
kind = "read"
xp = 15
minutes = 3
tags = ["macros", "proc-macro"]

[[quiz]]
question = "Which kind of proc-macro is written `#[derive(Debug)]` and adds an impl next to your struct?"
choices = ["A function-like macro", "A derive macro", "An attribute macro"]
answer = 1

[[quiz]]
question = "Why must a proc-macro live in its own crate (`proc-macro = true`)?"
choices = [
  "Cargo only allows one macro per crate, and it refuses to build a second one in the same package",
  "Proc-macros are slower than normal code, so Cargo caches them in a separate crate for speed",
  "The compiler runs it while building, so it can't sit inside the code it changes",
]
answer = 2
