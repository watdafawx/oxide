title = "Read: proc-macros in one screen"
summary = "Derive, attribute and function-like proc-macros, and why they live in their own crate."

[[quiz]]
question = "Which kind of proc-macro is written `#[derive(Debug)]` and adds an impl next to your struct, like `#[derive(ChunkInfo)]` on `struct Chunk`?"
choices = ["A function-like macro", "A derive macro", "An attribute macro"]
answer = 1

[[quiz]]
question = "Why must a proc-macro like `#[count_calls]` live in its own crate (`proc-macro = true`)?"
choices = [
  "Cargo only allows one macro per crate, and it refuses to build a second one in the same package",
  "Proc-macros are slower than normal code, so Cargo caches them in a separate crate for speed",
  "The compiler runs it while building, so it can't sit inside the code it changes",
]
answer = 2
