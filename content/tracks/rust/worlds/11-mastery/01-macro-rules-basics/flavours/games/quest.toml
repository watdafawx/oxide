title = "A macro for chunk areas"
summary = "Write your first macro_rules! macro: chunk_area!(side) expands to side * side, evaluating its argument once."

[[objectives]]
test = "chunk_area_multiplies"
label = "chunk_area!(x) gives x * x"
[[objectives]]
test = "chunk_area_evaluates_once"
label = "chunk_area!(expr) runs the expression a single time"

[[hints]]
text = "`macro_rules! chunk_area { ($x:expr) => { ... }; }` with `#[macro_export]` above it."
[[hints]]
text = "`$x * $x` would paste the expression twice. Bind it once: `let v = $x; v * v` inside double braces `{{ ... }}`."
[[hints]]
text = "Why double braces? The outer pair is the macro syntax, the inner pair makes the expansion one block expression."

[[points]]
after = 2
prompt = "Which captures one expression?"
pick = ["$x:expr", "$x:ty", "$x:ident", "$x:tt"]
answer = 0

[[points]]
after = 5
prompt = "Make the macro usable from other crates."
code = "#[___]\nmacro_rules! top_block {"
blank = "macro_export"
