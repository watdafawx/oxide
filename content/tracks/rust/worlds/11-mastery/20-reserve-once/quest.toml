title = "Reserve once"
summary = "Why a growing Vec allocates again and again, and how with_capacity and join ask for the room once."
kind = "exercise"
xp = 40
minutes = 5
tags = ["performance", "allocation", "vec", "string"]

[[objectives]]
test = "squares_allocate_once"
label = "squares(100) makes at most 1 allocation"
[[objectives]]
test = "join_words_allocates_once"
label = "join_words makes at most 1 allocation"

[[hints]]
text = "`squares` knows its length before the loop: create the Vec with room for `n` items. `join_words` can be one call on the slice: the method that puts a separator between the words."
[[hints]]
text = "`let mut out = Vec::with_capacity(n);` and `words.join(\" \")`."

[[points]]
after = 1
prompt = "A full Vec with room for 8 gets a 9th push. What happens?"
pick = ["it panics", "it moves to a new block of room for 16, copying the 8", "it allocates room for exactly 1 more", "the 9th item is dropped"]
answer = 1
[[points]]
after = 3
prompt = "Reserve room for n items up front."
code = "let mut out = Vec::___(n);"
blank = "with_capacity"
