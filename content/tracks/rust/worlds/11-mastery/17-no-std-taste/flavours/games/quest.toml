title = "A taste of no_std"
summary = "A fixed-size queue of chunk ids with no heap: the ring buffer that holds chunks waiting to load."

[[objectives]]
test = "dequeues_in_arrival_order"
label = "dequeue returns chunks first in, first out"
[[objectives]]
test = "enqueue_on_a_full_queue_returns_err"
label = "enqueue on a full queue gives the value back as Err"
[[objectives]]
test = "queue_wraps_around_the_end"
label = "Indices wrap, so the queue can be reused forever"

[[hints]]
text = "`head` is where the oldest item sits and `len` is how many are stored, so the next free slot is `(self.head + self.len) % N`. After a dequeue, `head` moves on by one, also `% N`."
[[hints]]
text = "`enqueue`: `if self.is_full() { return Err(value); }` then `self.buf[(self.head + self.len) % N] = value; self.len += 1; Ok(())`. `dequeue`: `if self.is_empty() { return None; }` then `let value = self.buf[self.head]; self.head = (self.head + 1) % N; self.len -= 1; Some(value)`."

[[points]]
after = 1
prompt = "What replaces std:: for items that exist in both?"
pick = ["alloc::", "sys::", "core::", "lib::"]
answer = 2
[[points]]
after = 3
prompt = "Fix the size in the type."
code = "pub struct LoadQueue<T, const N: ___> {"
blank = "usize"
