title = "Read: measure the chunk indexer before you speed it up"
summary = "Flamegraphs and release builds: find where the time goes before changing code."

[[quiz]]
question = "What does a flamegraph (from samply, cargo-flamegraph or perf) of the chunk indexer show you?"
choices = [
  "How much memory each variable uses",
  "Which functions the program spends its time in, as stacked bars where width is time",
  "Which lines of code the compiler rejected",
]
answer = 1

[[quiz]]
question = "The chunk indexer feels slow. What do you do first?"
choices = [
  "Rewrite the hot loop with unsafe",
  "Measure with a release build and a profiler to find where the time goes",
  "Add #[inline(always)] everywhere",
]
answer = 1
