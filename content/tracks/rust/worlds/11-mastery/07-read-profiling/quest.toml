title = "Measure before you optimise"
summary = "What a flamegraph shows, and what to check first."
kind = "read"
xp = 15
minutes = 3
tags = ["profiling", "performance"]

[[quiz]]
question = "What does a flamegraph (from samply, cargo-flamegraph or perf) show you?"
choices = [
  "Which functions the time goes in, as stacked bars where width is time",
  "How much memory each variable uses at the moment the profiler sampled the program",
  "Which lines of code the compiler rejected, and the error message each one produced",
]
answer = 0

[[quiz]]
question = "Your code feels slow. What do you do first?"
choices = [
  "Rewrite the hot loop with unsafe so the compiler can skip its bounds checks",
  "Add #[inline(always)] to every function so nothing is ever a real call",
  "Measure with a release build and a profiler to find where the time goes",
]
answer = 2
