title = "Biome registry macro"
summary = "Write biome! and registry! so the indexer's biome table is one tidy list."

[[objectives]]
test = "biome_macro_builds_a_biome"
label = "biome!(\"plains\" => 1) builds Biome { name: \"plains\", id: 1 }"
[[objectives]]
test = "registry_macro_builds_every_biome"
label = "biomes![...] builds a Vec of biomes, empty and trailing comma allowed"

[[hints]]
text = "`($name:expr => $id:expr) => { $crate::Biome { name: $name, id: $id } };` uses `=>` as plain syntax between the two captures."
[[hints]]
text = "`biomes!` repeats the pair: `$($name:expr => $id:expr),* $(,)?` and expands to `vec![$( $crate::biome!($name => $id) ),*]`."
[[hints]]
text = "Call the first macro from the second with `$crate::biome!`, so it also works from other crates."

[[points]]
after = 2
prompt = "Separate name and id in the pattern."
code = "($label:expr ___ $w:expr) => {"
blank = "=>"

[[points]]
after = 4
prompt = "Which path always resolves to your crate?"
pick = ["$crate::", "self::", "super::", "crate_::"]
answer = 0
