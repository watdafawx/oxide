title = "Block registry macro"
summary = "Use macro_rules! to declare chunk-indexer blocks in one line each. A quick win."
kind = "exercise"
xp = 30
minutes = 5
tags = ["macros", "macro_rules"]
requires = ["11-mastery/05-attribute-macro"]

[[objectives]]
test = "block_macro_builds_a_block"
label = "block!(\"stone\" => 1) builds Block { name: \"stone\", id: 1 }"
[[objectives]]
test = "registry_macro_builds_every_block"
label = "registry![...] builds a Vec of blocks, empty and trailing comma allowed"

[[hints]]
text = "`block!`: `($name:expr => $id:expr) => { $crate::Block { name: $name, id: $id } };`"
[[hints]]
text = "`registry!` repeats a whole pattern: `$( $name:expr => $id:expr ),* $(,)?` and expands to `vec![$( $crate::block!($name => $id) ),*]`."
