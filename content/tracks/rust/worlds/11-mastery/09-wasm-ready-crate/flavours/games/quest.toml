title = "A wasm-ready slime counter"
summary = "Make a pure function callable from a browser: crate-type, cfg_attr and a wasm-only dependency."

[[objectives]]
test = "slimes_small_generations"
label = "slimes_after(0..=10) matches the sequence"
[[objectives]]
test = "slimes_large_generation_does_not_overflow"
label = "slimes_after(90) works (iterate, don't recurse)"
[[objectives]]
test = "slimes_after_is_exported_to_wasm"
label = "slimes_after carries a wasm32-only #[wasm_bindgen] attribute"

[[hints]]
text = "Iterate with two variables: `let (mut a, mut b) = (0u64, 1u64); for _ in 0..n { (a, b) = (b, a + b); }` then return `a`."
[[hints]]
text = "Recursion repeats work and would never finish for 90. Iteration is a loop of 90 additions."
[[hints]]
text = "`#[cfg_attr(target_arch = \"wasm32\", wasm_bindgen::prelude::wasm_bindgen)]` above the function applies `#[wasm_bindgen]` only when building for the browser."
