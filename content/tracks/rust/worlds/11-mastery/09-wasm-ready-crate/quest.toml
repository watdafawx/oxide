title = "A wasm-ready crate"
summary = "Export `fib` to JavaScript with wasm-bindgen, while the crate still tests on your machine."
kind = "exercise"
xp = 45
minutes = 8
tags = ["wasm", "wasm-bindgen", "cfg"]

[[objectives]]
test = "fib_small_values"
label = "fib(0..=10) matches the sequence"
[[objectives]]
test = "fib_large_value_does_not_overflow"
label = "fib(90) works (iterate, don't recurse)"
[[objectives]]
test = "fib_is_exported_to_wasm"
label = "fib carries a wasm32-only #[wasm_bindgen] attribute"

[[hints]]
text = "Fibonacci: keep two numbers `a = 0, b = 1`. Repeat `n` times: `(a, b) = (b, a + b)`. Then `a` is the answer."
[[hints]]
text = "The export line goes right above `pub fn fib`: `#[cfg_attr(target_arch = \"wasm32\", wasm_bindgen::prelude::wasm_bindgen)]`. `cfg_attr` applies the attribute only when the condition is true."
[[hints]]
text = "On your machine the attribute is simply skipped, so `cargo test` never needs the wasm toolchain. Write the path in full: `wasm_bindgen::prelude::wasm_bindgen`."

[[points]]
after = 3
prompt = "Which crate-type does wasm-pack turn into a .wasm?"
pick = ["cdylib", "rlib", "bin", "staticlib"]
answer = 0

[[points]]
after = 5
prompt = "Apply the attribute only on wasm."
code = "#[___(target_arch = \"wasm32\", wasm_bindgen::prelude::wasm_bindgen)]"
blank = "cfg_attr"
