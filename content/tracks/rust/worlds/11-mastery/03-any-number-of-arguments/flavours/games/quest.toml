title = "Any number of block names"
summary = "Repetition: block_names![\"stone\", \"dirt\", ...] turns every argument into a String."

[[objectives]]
test = "block_names_converts_each_argument"
label = "block_names![\"stone\", \"dirt\"] gives vec![\"stone\".to_string(), \"dirt\".to_string()]"
[[objectives]]
test = "block_names_takes_any_count"
label = "block_names! works with one argument and with five"

[[hints]]
text = "The pattern is already right. In the template, build a `vec![...]` and put a repetition inside it: `$( ... ),*` with `$s.to_string()` in the middle."
[[hints]]
text = "`($($s:expr),*) => { vec![$($s.to_string()),*] };`"

[[points]]
after = 2
prompt = "Which pattern matches zero or more comma-separated expressions?"
pick = ["$x:expr*", "$( $x:expr ),+", "$($x:expr)?", "$( $x:expr ),*"]
answer = 3
[[points]]
after = 3
prompt = "How many times does the template's $( ... ),* repeat for block_names![\"stone\", \"dirt\", \"sand\"]?"
pick = ["once", "three times", "twice", "it depends on the text"]
answer = 1
