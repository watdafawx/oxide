title = "Count every chunk-index allocation"
summary = "Install a counting allocator in a test and make two chunk-index helpers allocate at most once."

[[objectives]]
test = "join_block_names_allocates_once"
label = "join_block_names makes at most 1 allocation"
[[objectives]]
test = "dedup_chunk_ids_allocates_once"
label = "dedup_chunk_ids makes at most 1 allocation"

[[hints]]
text = "`names.join(\" \")` computes the final length first and allocates once. Building with `+=` in a loop reallocates as it grows."
[[hints]]
text = "`Vec::with_capacity(input.len())` reserves room up front, so pushing never reallocates."
[[hints]]
text = "Read the failure message: it prints how many allocations your function made."
