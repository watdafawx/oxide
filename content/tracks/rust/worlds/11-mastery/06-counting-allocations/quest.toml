title = "Count every allocation"
summary = "A counting allocator shows where memory is allocated. Make two functions allocate once."
kind = "exercise"
xp = 60
minutes = 12
tags = ["allocator", "performance", "vec", "string"]
requires = ["11-mastery/05-block-registry"]

[[objectives]]
test = "join_words_allocates_once"
label = "join_words makes at most 1 allocation"
[[objectives]]
test = "dedup_sorted_allocates_once"
label = "dedup_sorted makes at most 1 allocation"

[[hints]]
text = "Open `tests/allocations.rs`: a wrapper around the system allocator bumps a counter on every `alloc`. Your functions already return the right answer; the test checks how many allocations it took."
[[hints]]
text = "`String::new()` and `Vec::new()` start empty and grow in steps, one allocation per step. If you know the final size, `with_capacity(size)` allocates once."
[[hints]]
text = "`join_words`: `words.join(\" \")` computes the size first. `dedup_sorted`: `let mut v = Vec::with_capacity(input.len());` then push, or `to_vec()` followed by `dedup()`."

[[points]]
after = 2
prompt = "Which attribute replaces the program's allocator?"
pick = ["#[global_allocator]", "#[allocator]", "#[custom_alloc]", "#[no_mangle]"]
answer = 0

[[points]]
after = 4
prompt = "Reserve the room once."
code = "let mut v: Vec<i32> = Vec::___(10);"
blank = "with_capacity"
