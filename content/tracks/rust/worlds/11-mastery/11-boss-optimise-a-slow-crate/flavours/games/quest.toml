title = "Boss: Make the chunk indexer fast"
summary = "A correct but slow chunk index. Keep its API and tests, then beat the allocation and operation caps."

[[objectives]]
test = "chunks_with_finds_chunks_once_each"
label = "chunks_with(block) lists each matching chunk once (already green: don't break it)"
[[objectives]]
test = "block_names_ignore_case_and_punctuation"
label = "Block names are runs of letters and digits, matched ignoring case"
[[objectives]]
test = "top_blocks_order_by_count_then_alphabet"
label = "top_blocks(n) sorts by count, then alphabetically"
[[objectives]]
test = "chunks_with_ops_are_capped"
label = "One chunks_with lookup takes at most 20 comparison ops"
[[objectives]]
test = "build_ops_are_capped"
label = "build takes at most 2 comparison ops per block name"
[[objectives]]
test = "build_allocations_are_capped"
label = "Building a 2,000-chunk index makes at most 3,000 allocations"
[[objectives]]
test = "top_blocks_allocations_are_capped"
label = "top_blocks(10) makes at most 14 allocations"
[[objectives]]
test = "big_world_stays_under_the_op_budget"
label = "50,000 chunks: build, 20 lookups and top_blocks stay under the op budget"

[[hints]]
text = "Run the tests first: three already pass, so you know the behaviour you must keep. Then go in order: the op caps (the data structure), the allocation caps (the buffers), the big world last."
[[hints]]
text = "The slow part is `entries: Vec<(BlockName, Vec<usize>)>`, which is searched with a linear scan for every single block name. Replace it with a `HashMap<String, ...>` and the op caps drop."
[[hints]]
text = "Store per block both the chunk list and an occurrence count. In `build`, keep one `String` buffer: `buf.clear(); buf.extend(token.chars().flat_map(char::to_lowercase));`."
[[hints]]
text = "Look up with `map.get_mut(buf.as_str())` (no allocation) and only `insert(buf.clone(), ...)` for a new block. Push a chunk number only if it is not already the last one."
[[hints]]
text = "`top_blocks`: collect `Vec<(&String, usize)>` of references, `sort_unstable_by(|a, b| b.1.cmp(&a.1).then_with(|| a.0.cmp(b.0)))`, then `take(n)` and clone just those. `sort_unstable` does not allocate a scratch buffer, `sort` does."
[[hints]]
text = "Still over the big-world budget? Look for a `clone()` or `to_string()` per token in `build`, or a `Vec<String>` you sort instead of references."

[[points]]
after = 4
prompt = "Which type is the comparison meter?"
pick = ["BlockName", "ChunkIndex", "Counter", "Vec"]
answer = 0

[[points]]
after = 11
prompt = "Count with one lookup."
code = "*blocks.entry(\"stone\".to_string()).___ += 1;"
blank = "or_default()"
