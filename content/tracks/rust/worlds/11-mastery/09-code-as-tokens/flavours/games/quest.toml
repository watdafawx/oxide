title = "Code as tokens"
summary = "What a macro really receives: tokens, a token stream, and the syntax tree built from it."

[[quiz]]
question = "How many tokens is `let height = 16 * 4;`?"
choices = ["3", "7", "20, one per character"]
answer = 1

[[quiz]]
question = "What does a procedural macro like `#[derive(ChunkInfo)]` receive?"
choices = [
  "The values the chunk's fields hold while the game runs",
  "The source file as one long piece of text",
  "Your code as a stream of tokens, while the compiler builds it",
]
answer = 2

[[quiz]]
question = "Which crate turns a token stream into a syntax tree you can inspect?"
choices = ["syn", "quote", "serde"]
answer = 0
