title = "The log eats your line"
summary = "A chat line moved into the log is gone. Fix the code that forgot."

[[objectives]]
test = "length_and_name_returns_both"
label = "length_and_name() compiles and returns (14, \"<Ferris> hello\")"

[[hints]]
text = "The error names the line that gives the chat line away. Find the call that takes `line` by value, then ask who still needs `line` afterwards."
[[hints]]
text = "Give the function its own copy and keep yours: `.clone()` makes a second String."
[[hints]]
text = "Half a step: the argument of `log_length` is the part to change. Pass it a copy and leave `line` alone for the tuple."
