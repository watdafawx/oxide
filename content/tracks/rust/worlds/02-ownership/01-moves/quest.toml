title = "Moves"
summary = "A String has one owner. Hand it over and it's gone: fix the code that forgot."
kind = "exercise"
starter_fails_to_compile = true
xp = 30
minutes = 4
tags = ["ownership", "move", "clone"]

[[objectives]]
test = "length_and_name_returns_both"
label = "length_and_name() compiles and returns (6, \"ferris\")"

[[hints]]
text = "The error names the line that gives the String away. Find the call that takes `name` by value, then ask who still needs `name` afterwards."
[[hints]]
text = "Give the function its own copy and keep yours: `.clone()` makes a second String."
[[hints]]
text = "Half a step: the argument of `name_length` is the part to change. Pass it a copy and leave `name` alone for the tuple."
