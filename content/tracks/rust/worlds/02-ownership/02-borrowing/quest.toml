title = "Lend, don't give"
summary = "Pass a backpack to a function with & so the caller keeps it."
kind = "exercise"
xp = 45
minutes = 8
tags = ["borrowing", "references"]

[[objectives]]
test = "count_items_counts"
label = "count_items(&bag) returns how many items are inside"
[[objectives]]
test = "total_chars_adds_lengths"
label = "total_chars(&bag) adds up the length of every item name"
[[objectives]]
test = "bag_is_still_usable_after_borrowing"
label = "The caller can keep using the bag after both calls"

[[hints]]
text = "The parameter is `bag: &Backpack`: you can read through it as if it were the Backpack itself. `bag.items` works."
[[hints]]
text = "For the count, `bag.items.len()` is all you need."
[[hints]]
text = "For total_chars, loop over `&bag.items` (or use `.iter()`) and add up each `item.len()`."
