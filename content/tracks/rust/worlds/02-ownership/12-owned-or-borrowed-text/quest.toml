title = "Owned or borrowed text"
summary = "String owns its letters, &str borrows them. Read with &str, hand back new text as String."
kind = "exercise"
xp = 40
minutes = 5
tags = ["strings", "str", "borrowing"]

[[objectives]]
test = "greet_takes_literals_and_strings"
label = "greet works with a literal AND with a borrowed String"
[[objectives]]
test = "into_owned_outlives_its_source"
label = "into_owned gives back a String that lives on after the source is gone"

[[hints]]
text = "`greet` builds new text from the borrowed name with `format!`. `into_owned` turns borrowed text into a `String` with one method you have used since the last world."
[[hints]]
text = "`format!(\"Hello, {name}!\")` and `text.to_string()`."

[[points]]
after = 2
prompt = "What type is the literal \"Ana\"?"
pick = ["String", "char", "&str", "Vec<char>"]
answer = 2
[[points]]
after = 3
prompt = "Take text you only read."
code = "fn greet(name: ___) -> String {"
blank = "&str"
