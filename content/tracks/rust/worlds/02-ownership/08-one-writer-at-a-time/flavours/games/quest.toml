title = "One writer at a time"
summary = "Many readers, or one writer, never both. Fix the join command that reads while it writes."

[[objectives]]
test = "join_and_report_names_the_first_player"
label = "join_and_report builds, adds the player, and reports who is first and the new count"
[[objectives]]
test = "kick_last_moves_player_to_kicked_list"
label = "kick_last(&mut online, &mut kicked) moves the last player from one list to the other"

[[hints]]
text = "In `join_and_report`, the borrow `first` is made before `push` and used after it. Make it after the push instead. In `kick_last`, `pop` gives an `Option`."
[[hints]]
text = "Swap the two lines so `online.push(...)` comes first, then `let first = &online[0];`. For `kick_last`: `if let Some(player) = online.pop() { kicked.push(player); }`."

[[points]]
after = 1
prompt = "How many `&mut` writers may the player list have at the same moment?"
pick = ["none", "two", "exactly one", "any number"]
answer = 2
[[points]]
after = 3
prompt = "Which order builds?"
pick = ["borrow the first player, push, use the borrow", "push, then borrow the first player and use it"]
answer = 1
