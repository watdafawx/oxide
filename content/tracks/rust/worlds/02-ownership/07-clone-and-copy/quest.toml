title = "Clone and Copy"
summary = "Derive Clone for explicit copies and Copy for types that never move."
kind = "exercise"
xp = 40
minutes = 7
tags = ["clone", "copy", "derive"]

[[objectives]]
test = "two_labels_clones"
label = "two_labels(&label) returns two equal copies (Label needs Clone)"
[[objectives]]
test = "mirror_returns_point_twice"
label = "mirror(p) returns (p, p) (Point needs Copy)"

[[hints]]
text = "Edit the `#[derive(...)]` line above `Label`: add `Clone`. Then `label.clone()` works."
[[hints]]
text = "`Copy` requires `Clone` too: derive both on `Point`. Then you can use `p` twice."
[[hints]]
text = "`vec![label.clone(), label.clone()]` and `(p, p)`."

[[points]]
after = 2
prompt = "Which trait duplicates silently on assignment?"
pick = ["Copy", "Clone", "Debug", "Drop"]
answer = 0

[[points]]
after = 4
prompt = "Derive the traits."
code = "#[___(Debug, Clone, Copy)]\nstruct Point { x: i32, y: i32 }"
blank = "derive"
