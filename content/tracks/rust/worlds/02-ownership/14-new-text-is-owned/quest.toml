title = "New text is owned"
summary = "A function can't hand back a borrow of its own text: it is dropped at the }. Hand over the String."
kind = "exercise"
xp = 35
minutes = 4
tags = ["ownership", "borrowing", "dangling"]
starter_fails_to_compile = true

[[objectives]]
test = "shout_gives_back_new_text"
label = "shout(\"ana\") builds and gives back \"ANA!!\""

[[hints]]
text = "Two edits, both in `shout`: the type after `->`, and the last line."
[[hints]]
text = "`pub fn shout(name: &str) -> String`, and end the body with `loud` instead of `&loud`."

[[points]]
after = 2
prompt = "Why can't `shout` give back `&loud`?"
pick = ["loud is dropped at shout's }, so the borrow would dangle", "&str can't hold capital letters", "Functions can never give back references"]
answer = 0
[[points]]
after = 3
prompt = "Hand the new text to the caller."
code = "fn shout(name: &str) -> ___ {"
blank = "String"
