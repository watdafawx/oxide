title = "Raw pointers"
summary = "Read and write through *const / *mut, then wrap it all in a safe function."
kind = "exercise"
xp = 65
minutes = 12
tags = ["unsafe", "raw-pointers", "slices"]

[[objectives]]
test = "writes_through_mut_pointer"
label = "increment writes through a *mut i32"
[[objectives]]
test = "null_pointer_gives_none"
label = "read_or_none returns None for a null pointer and the value otherwise"
[[objectives]]
test = "sums_raw_parts"
label = "sum_raw adds up len items starting at a *const i32"
[[objectives]]
test = "safe_wrapper_sums_slice"
label = "safe_sum(&[i32]) is a safe function over sum_raw"

[[hints]]
text = "Inside `unsafe { ... }`, `*ptr += 1` writes through a `*mut i32` and `*ptr` reads a `*const i32`. `ptr.is_null()` is safe to call."
[[hints]]
text = "`std::slice::from_raw_parts(ptr, len)` turns a pointer and a length into `&[i32]`; then `.iter().sum()`."
[[hints]]
text = "`safe_sum`: `unsafe { sum_raw(slice.as_ptr(), slice.len()) }`. It is valid for any slice, so the wrapper is safe. Add a `// SAFETY:` comment saying why."

[[points]]
after = 2
prompt = "Which check on a raw pointer is safe?"
pick = ["is_null", "from_raw_parts", "deref", "offset"]
answer = 0

[[points]]
after = 6
prompt = "Build a slice from the array's pointer."
code = "let slice = unsafe { std::slice::from_raw_parts(___, v.len()) };"
blank = "v.as_ptr()"
