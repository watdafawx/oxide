title = "Server rules in one byte"
summary = "Pack server rules (whitelist, PvP, hardcore) into the bits of a u8, and a MOTD color into a u32."

[[objectives]]
test = "rules_turn_on_off_and_get_tested"
label = "enable_rule, disable_rule and rule_enabled work on a u8 of rule bits"
[[objectives]]
test = "motd_color_packs_into_u32"
label = "pack_color / unpack_color move three bytes in and out of one u32"
[[objectives]]
test = "counts_enabled_rules"
label = "count_enabled_rules returns how many bits are 1"

[[hints]]
text = "Turn a bit on with `value | rule`, off with `value & !rule`."
[[hints]]
text = "`value & rule == rule` is true when every bit of `rule` is set."
[[hints]]
text = "Pack with `(r << 16) | (g << 8) | b` after widening to `u32`. Unpack with `>> 16`, `>> 8` and a cast to `u8` (casting keeps only the low 8 bits)."
