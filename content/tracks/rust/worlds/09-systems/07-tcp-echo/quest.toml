title = "TCP echo server"
summary = "Accept connections, echo bytes back, one thread per client."
kind = "exercise"
xp = 70
minutes = 14
tags = ["tcp", "threads", "io"]

[[objectives]]
test = "handle_echoes_until_eof"
label = "handle(stream) writes back everything it reads until the client closes"
[[objectives]]
test = "client_round_trips_through_server"
label = "client_roundtrip sends bytes and reads the same number back"
[[objectives]]
test = "serves_two_clients_at_once"
label = "serve spawns a thread per connection so a quiet client doesn't block the others"

[[hints]]
text = "`handle`: loop { `let n = stream.read(&mut buf)?;` if `n == 0` the client closed: return `Ok(())`. Otherwise `stream.write_all(&buf[..n])?;` }"
[[hints]]
text = "`client_roundtrip`: `TcpStream::connect(addr)?`, `write_all(msg)?`, then `let mut buf = vec![0; msg.len()]; stream.read_exact(&mut buf)?;`"
[[hints]]
text = "`serve`: for each accepted `(stream, _)`, `thread::spawn(move || { let _ = handle(stream); })` and keep the JoinHandle. Don't call `handle` directly on the accepting thread, or one slow client blocks everyone."

[[points]]
after = 1
prompt = "Listen on a port."
code = "let listener = TcpListener::___(\"127.0.0.1:0\").unwrap();"
blank = "bind"

[[points]]
after = 2
prompt = "Which call keeps reading until the buffer is full?"
pick = ["read_exact", "read", "write_all", "accept"]
answer = 0
