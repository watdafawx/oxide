title = "Read: the unsafe contract of a packet buffer"
summary = "unsafe does five extra things, and when you wrap it in a safe function you promise it can't be misused."

[[quiz]]
question = "A raw pointer into the pinger's receive buffer needs `unsafe` to dereference. What does an `unsafe` block let you do that safe Rust does not?"
choices = ["Turn off the borrow checker and the type checker for everything inside the block", "Skip bounds checks and overflow checks on all the code in the whole function body", "Five extra things, like dereferencing a raw pointer; all other checks still run"]
answer = 2

[[quiz]]
question = "You write a safe `read_packet(buf: &[u8])` that uses an unsafe block inside. Who must make sure the unsafe operation is valid?"
choices = ["The caller of the safe function, who has to read its docs before every single call", "You, the author: no safe call may be able to cause undefined behavior", "The compiler, because the function itself is not marked unsafe, so it checks it"]
answer = 1
