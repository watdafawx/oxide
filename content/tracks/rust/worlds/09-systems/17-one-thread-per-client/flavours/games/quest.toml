title = "One thread per player"
summary = "A server that handles players in turn freezes behind one quiet client. Give every connection its own thread."

[[objectives]]
test = "serves_two_players_at_once"
label = "serve spawns a thread per connection, so a quiet player doesn't block the others"

[[hints]]
text = "Instead of calling `echo_ping(stream)` right there, hand the stream to `thread::spawn(move || ...)` and push the `JoinHandle` it returns into a `Vec`. After the accept loop, `join` each handle."
[[hints]]
text = "`handles.push(thread::spawn(move || { let _ = echo_ping(stream); }));` inside the loop, then `for h in handles { let _ = h.join(); }`."

[[points]]
after = 2
prompt = "Why does the starter's server freeze?"
pick = ["accept is slow", "echo_ping never returns while a player stays connected", "TCP allows one player", "the port is taken"]
answer = 1
[[points]]
after = 3
prompt = "Hand the stream to the new thread."
code = "thread::spawn(___ || { let _ = echo_ping(stream); })"
blank = "move"
