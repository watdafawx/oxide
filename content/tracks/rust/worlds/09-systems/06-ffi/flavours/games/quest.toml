title = "Ask C about a MOTD"
summary = "Call C's abs and strlen from Rust, and turn a C string back into a Rust String."

[[objectives]]
test = "c_abs_gives_distance_from_spawn"
label = "c_abs(n) calls the C abs function"
[[objectives]]
test = "c_motd_len_counts_bytes"
label = "c_motd_len(&str) returns the C string length"
[[objectives]]
test = "c_motd_len_rejects_interior_nul"
label = "c_motd_len returns None for a MOTD containing a NUL byte"
[[objectives]]
test = "motd_from_c_reads_back_a_string"
label = "motd_from_c reads a C string pointer into a Rust String"

[[hints]]
text = "`unsafe { abs(n) }`: calling a foreign function is unsafe. The `extern` block declaring `abs` and `strlen` is already there."
[[hints]]
text = "`CString::new(motd).ok()?` fails on an interior NUL. Pass `c.as_ptr()` to `strlen` and keep `c` alive until after the call."
[[hints]]
text = "`CStr::from_ptr(ptr).to_string_lossy().into_owned()` copies the C string into a `String`."
