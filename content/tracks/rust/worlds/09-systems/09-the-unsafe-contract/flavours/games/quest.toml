title = "Aside: the unsafe contract"
summary = "The pinger never needs unsafe, but the buffers and sockets it uses are built on it. What unsafe unlocks, and who is on the hook."

[[quiz]]
question = "What does an `unsafe` block let you do that safe Rust does not?"
choices = ["Turn off the borrow checker and the type checker for everything inside the block", "A few extra things, like following a raw pointer; all other checks still run", "Skip bounds checks and overflow checks on all the code in the whole function body"]
answer = 1

[[quiz]]
question = "You write a safe `first_count(counts: &[i32])` that uses an unsafe block inside. Who must make sure the unsafe operation is valid?"
choices = ["The caller of the safe function, who has to read its docs before every call", "The compiler, because the function itself is not marked unsafe", "You, the author: no safe call may be able to cause undefined behavior"]
answer = 2

[[quiz]]
question = "Does the server pinger in this world's boss need `unsafe`?"
choices = ["No: std's safe types already wrap the unsafe parts", "Yes, to read bytes from a reply", "Yes, to connect to the server"]
answer = 0
