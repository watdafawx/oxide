title = "Drop"
summary = "Run code when a value dies, and end a value early."
kind = "exercise"
xp = 40
minutes = 7
tags = ["drop", "raii"]
requires = ["06-smart-pointers/09-arc-preview"]

[[objectives]]
test = "drop_logs_name"
label = "Dropping a Guard pushes \"drop <name>\" onto the log"
[[objectives]]
test = "early_release_drops_before_work"
label = "early_release drops its Guard first, then logs \"work\""

[[hints]]
text = "In `drop`: `self.log.push(format!(\"drop {}\", self.name));`"
[[hints]]
text = "For `early_release`: make the Guard with `Guard::new(\"a\", log)`. The log is borrowed by the Guard until it dies."
[[hints]]
text = "`let g = Guard::new(\"a\", log); drop(g); log.push(\"work\".to_string());` The explicit `drop(g)` must come before you use `log` again."
