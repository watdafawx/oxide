title = "Power down on removal"
summary = "Drop logs a power-down at the moment an inserter is removed."

[[objectives]]
test = "inserter_powers_down_at_the_brace"
label = "When an Inserter's block ends, \"power down <name>\" is in the log"

[[hints]]
text = "`self.log` is a `&mut Vec<String>`, so `self.log.push(...)` adds a line."
[[hints]]
text = "`self.log.push(format!(\"power down {}\", self.name));`"

[[points]]
after = 1
prompt = "When is a value dropped?"
pick = ["when the program ends", "when you print it", "when its type is defined", "at the closing brace of its scope"]
answer = 3
[[points]]
after = 2
prompt = "Run code when a Lamp is removed."
code = "impl ___ for Lamp {"
blank = "Drop"
