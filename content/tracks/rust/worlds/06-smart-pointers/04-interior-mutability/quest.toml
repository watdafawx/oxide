title = "Changing through a shared ref"
summary = "Cell and RefCell let you mutate behind &. The borrow rules move to runtime."
kind = "read"
xp = 15
minutes = 3
tags = ["refcell", "cell", "interior-mutability"]

[[quiz]]
question = "What is the difference between Cell<T> and RefCell<T>?"
choices = [
  "Cell<T> hands out references to its inside, while RefCell<T> only ever copies values in and out of the box",
  "Cell<T> moves values in and out with get/set; RefCell<T> lends &T / &mut T checked at runtime",
  "Both check the borrow rules at compile time, so neither can ever panic",
]
answer = 1

[[quiz]]
question = "A RefCell is already borrowed by a live borrow_mut(). You call borrow_mut() on it again. What happens?"
choices = [
  "It does not compile, because the borrow checker sees two &mut borrows of the same cell",
  "The second call waits until the first one ends, like a lock would",
  "It panics at runtime (try_borrow_mut gives Err)",
]
answer = 2
