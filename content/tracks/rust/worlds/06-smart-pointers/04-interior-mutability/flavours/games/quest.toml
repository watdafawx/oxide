title = "A chest many inserters write into"
summary = "Cell and RefCell let you change a chest through a shared handle. The borrow rules move to runtime."

[[quiz]]
question = "What is the difference between Cell<T> and RefCell<T>?"
choices = [
  "Cell<T> hands out references to the chest's contents, RefCell<T> only copies values",
  "Cell<T> moves small Copy values in and out with get/set (an item counter), RefCell<T> lends &T / &mut T that are checked at runtime (a whole inventory)",
  "Both check the borrow rules at compile time",
]
answer = 1

[[quiz]]
question = "One inserter holds a live borrow_mut() on a chest's RefCell. A second inserter calls borrow_mut() on the same chest. What happens?"
choices = [
  "It does not compile",
  "The second inserter waits until the first one is done",
  "It panics at runtime (try_borrow_mut would return Err instead)",
]
answer = 2
