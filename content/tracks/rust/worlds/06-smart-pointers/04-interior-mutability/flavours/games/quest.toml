title = "A chest many inserters write into"
summary = "Cell and RefCell let you change a chest through a shared handle. The borrow rules move to runtime."

[[quiz]]
question = "What is the difference between Cell<T> and RefCell<T>?"
choices = [
  "Cell<T> hands out references to the chest's contents, while RefCell<T> only ever copies values in and out of the chest, one at a time, and never lends anything",
  "Cell<T> moves small Copy values in and out with get/set (a counter); RefCell<T> lends &T / &mut T checked at runtime (a whole inventory)",
  "Both check the borrow rules at compile time, so neither one can ever panic while the factory is running",
]
answer = 1

[[quiz]]
question = "One inserter holds a live borrow_mut() on a chest's RefCell. A second inserter calls borrow_mut() on the same chest. What happens?"
choices = [
  "It does not compile, because the borrow checker sees two &mut borrows of the same chest",
  "The second inserter waits until the first one is done, like a lock would",
  "It panics at runtime (try_borrow_mut gives Err)",
]
answer = 2
