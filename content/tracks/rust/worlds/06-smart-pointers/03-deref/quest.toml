title = "Act like what you hold"
summary = "Deref makes your own wrapper work like a reference, and explains why &String works as &str."
kind = "exercise"
xp = 35
minutes = 5
tags = ["deref", "smart-pointers"]

[[objectives]]
test = "star_reads_the_value_inside"
label = "*MyBox::new(5) gives 5"
[[objectives]]
test = "my_box_of_string_works_as_str"
label = "A &MyBox<String> can be passed where a &str is expected"

[[hints]]
text = "`deref` returns a reference to the wrapped value. `MyBox` is a tuple struct, so the value is field `0`."
[[hints]]
text = "The whole body is `&self.0`."

[[points]]
after = 2
prompt = "Say what a MyBox<String> points at."
code = "type ___ = String;"
blank = "Target"
[[points]]
after = 4
prompt = "Why does a `&String` work where a `&str` is expected?"
pick = ["Rust copies the text into a new str", "they are the same type", "String implements Deref with Target = str", "the compiler skips the type check"]
answer = 2
