title = "Box it up"
summary = "A list that contains itself needs a Box to have a size."
kind = "exercise"
xp = 35
minutes = 6
tags = ["box", "heap", "enums"]

[[objectives]]
test = "prepend_puts_new_head_in_front"
label = "prepend(list, x) returns a new list with x at the front"
[[objectives]]
test = "sum_adds_every_element"
label = "sum(&list) adds up all the i32s"
[[objectives]]
test = "len_counts_elements"
label = "len(&list) counts the Cons cells"

[[hints]]
text = "`Cons(x, Box::new(list))` builds a bigger list. `Box::new` puts a value on the heap."
[[hints]]
text = "`sum` and `len` are recursive: `match list { Cons(v, rest) => ..., Nil => 0 }`."
[[hints]]
text = "`Cons(v, rest) => v + sum(rest)`. `rest` is a `&Box<List>`, which derefs to `&List` for you."

[[points]]
after = 2
prompt = "Which type puts a value on the heap?"
pick = ["Box<T>", "&T", "Option<T>", "[T; 1]"]
answer = 0

[[points]]
after = 3
prompt = "Put the rest of the list behind a pointer."
code = "Cons(i32, ___),"
blank = "Box<List>"
