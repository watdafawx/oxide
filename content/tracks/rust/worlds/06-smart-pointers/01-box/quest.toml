title = "A list inside a list"
summary = "A type that contains itself has no size. A Box gives it one."
kind = "exercise"
xp = 35
minutes = 5
tags = ["box", "heap", "pointer"]
starter_fails_to_compile = true

[[objectives]]
test = "a_two_task_plan_builds"
label = "Plan compiles, and a two-task plan starts with its 30-minute task"
[[objectives]]
test = "add_first_puts_new_task_in_front"
label = "add_first(plan, minutes) gives a longer plan with the new task first"

[[hints]]
text = "Only one thing in the enum changes: the type of the second field of `Task`. Read the `help:` line under the error."
[[hints]]
text = "Write `Task(u32, Box<Plan>)`. In `add_first`: `Plan::Task(minutes, Box::new(plan))`."

[[points]]
after = 3
prompt = "When does Rust need to know how big a `Plan` is?"
pick = ["when it is printed", "when the program is built", "when it is dropped", "never"]
answer = 1
[[points]]
after = 5
prompt = "Put the rest of the plan behind an owning pointer."
code = "Task(u32, ___),"
blank = "Box<Plan>"
