title = "Belt segments in a Box"
summary = "A belt that continues into another belt has no size. A Box gives it one."

[[objectives]]
test = "a_two_segment_belt_builds"
label = "Belt compiles, and a two-segment belt starts with its 8 items"
[[objectives]]
test = "extend_puts_new_segment_in_front"
label = "extend(belt, items) gives a longer belt with the new segment first"

[[hints]]
text = "Only one thing in the enum changes: the type of the second field of `Segment`. Read the `help:` line under the error."
[[hints]]
text = "Write `Segment(u32, Box<Belt>)`. In `extend`: `Belt::Segment(items, Box::new(belt))`."

[[points]]
after = 3
prompt = "When does Rust need to know how big a `Belt` is?"
pick = ["when it is printed", "when the program is built", "when it is dropped", "never"]
answer = 1
[[points]]
after = 5
prompt = "Put the rest of the belt behind an owning pointer."
code = "Segment(u32, ___),"
blank = "Box<Belt>"
