title = "Belt segments in a Box"
summary = "A belt that continues into another belt needs a Box to have a size."

[[objectives]]
test = "extend_puts_new_segment_in_front"
label = "extend(belt, items) returns a longer belt with a new segment at the front"
[[objectives]]
test = "total_items_adds_every_segment"
label = "total_items(&belt) adds up the items on every segment"
[[objectives]]
test = "segment_count_counts_segments"
label = "segment_count(&belt) counts the segments"

[[hints]]
text = "`Segment(items, Box::new(belt))` builds a longer belt. `Box::new` puts the old belt on the heap."
[[hints]]
text = "`total_items` and `segment_count` are recursive: `match belt { Segment(n, rest) => ..., End => 0 }`."
[[hints]]
text = "`Segment(n, rest) => n + total_items(rest)`. `rest` is a `&Box<Belt>`, which derefs to `&Belt` for you."

[[points]]
after = 1
prompt = "Which type puts a value on the heap?"
pick = ["Box<T>", "&T", "Option<T>", "[T; 1]"]
answer = 0

[[points]]
after = 2
prompt = "Put the rest of the belt behind a pointer."
code = "Segment(u32, ___),"
blank = "Box<Belt>"
