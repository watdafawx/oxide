title = "RefCell: mutate behind &"
summary = "Change a counter and a list through an immutable reference."
kind = "exercise"
xp = 55
minutes = 9
tags = ["refcell", "interior-mutability"]

[[objectives]]
test = "hit_counts_through_shared_ref"
label = "Counter::hit(&self) increments even though self is not mut"
[[objectives]]
test = "add_item_mutates_in_place"
label = "add_item(&RefCell<Vec<String>>, item) pushes onto the list"
[[objectives]]
test = "is_locked_detects_active_borrow"
label = "is_locked is true only while a borrow is alive (use try_borrow_mut)"

[[hints]]
text = "`*self.hits.borrow_mut() += 1;` gives you `&mut u32` for one statement."
[[hints]]
text = "`list.borrow_mut().push(item.to_string());`"
[[hints]]
text = "`cell.try_borrow_mut().is_err()` is true exactly when someone else holds a borrow."

[[points]]
after = 2
prompt = "Which method gives write access?"
pick = ["borrow_mut", "borrow", "try_borrow", "unwrap"]
answer = 0

[[points]]
after = 6
prompt = "Reach the number inside the RefMut."
code = "___self.count.borrow_mut() += 1;"
blank = "*"
