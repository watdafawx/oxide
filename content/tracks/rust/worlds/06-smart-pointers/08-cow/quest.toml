title = "Cow: borrow until you must own"
summary = "Return the input untouched when it is fine, allocate only when you change it."
kind = "exercise"
xp = 40
minutes = 6
tags = ["cow", "strings", "allocation"]

[[objectives]]
test = "clean_input_is_borrowed"
label = "Input without tabs comes back as Cow::Borrowed (no allocation)"
[[objectives]]
test = "tabs_become_single_spaces"
label = "Each tab becomes one space"
[[objectives]]
test = "changed_input_is_owned"
label = "Input with tabs comes back as Cow::Owned"

[[hints]]
text = "Check first: `input.contains('\\t')`."
[[hints]]
text = "Clean case: `Cow::Borrowed(input)`. Dirty case: `Cow::Owned(input.replace('\\t', \" \"))`."

[[points]]
after = 1
prompt = "Which type is clone on write?"
pick = ["Cow<str>", "Rc<str>", "Box<str>", "String"]
answer = 0

[[points]]
after = 4
prompt = "Get a String out of the Cow."
code = "let owned = no_commas(\"a,b\").___();"
blank = "into_owned"
