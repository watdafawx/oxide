title = "Deref"
summary = "Make your own pointer act like a reference."
kind = "exercise"
xp = 35
minutes = 6
tags = ["deref"]

[[objectives]]
test = "deref_gives_inner_value"
label = "*MyBox::new(x) gives x, and &MyBox<String> works as &str"

[[hints]]
text = "`deref` returns a reference to the inside: `&self.0`."
[[hints]]
text = "The struct is a tuple struct, so the wrapped value is field `0`. Take a reference to it."

[[points]]
after = 2
prompt = "Which trait makes *x work on a smart pointer?"
pick = ["Deref", "Drop", "Clone", "Copy"]
answer = 0

[[points]]
after = 4
prompt = "Say what the pointer points at."
code = "type ___ = String;"
blank = "Target"
