title = "Inserter handle"
summary = "Make an inserter handle act like the machine it controls."

[[objectives]]
test = "handle_derefs_to_inserter_value"
label = "*InserterHandle::new(x) gives x, and &InserterHandle<String> works as &str"

[[hints]]
text = "`deref` returns a reference to the inside: `&self.0`."
[[hints]]
text = "The handle is a tuple struct, so the wrapped machine is field `0`. Take a reference to it."
