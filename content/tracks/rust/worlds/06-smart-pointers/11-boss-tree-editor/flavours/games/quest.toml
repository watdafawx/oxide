title = "Boss: Tech-tree editor"
summary = "Build the engine of a tech-tree editor: add, move, remove and render technologies with their prerequisites."

[[objectives]]
test = "starting_tech_is_the_root"
label = "name(0) is the starting tech; unknown ids give None"
[[objectives]]
test = "add_tech_returns_fresh_ids"
label = "add(prerequisite, name) returns a new id each time, None for an unknown prerequisite"
[[objectives]]
test = "path_lists_prerequisites"
label = "path(id) lists the techs to research, from the starting tech down to this one"
[[objectives]]
test = "render_indents_dependants"
label = "render() prints the tech tree, two spaces of indent per level"
[[objectives]]
test = "remove_deletes_dependants"
label = "remove(id) deletes the tech and everything that depends on it (never the starting tech)"
[[objectives]]
test = "reparent_moves_dependants"
label = "reparent(id, new_prerequisite) re-attaches the tech and its dependants"
[[objectives]]
test = "reparent_refuses_cycles"
label = "reparent refuses to make a tech depend on itself or on one of its own dependants"

[[hints]]
text = "Plan: `techs: HashMap<u32, Rc<RefCell<Tech>>>` finds a tech by id. Each tech's `unlocks` own it downward, `prerequisite` is a `Weak` pointing up. Start with `name`: `self.techs.get(&id).map(|t| t.borrow().name.clone())`."
[[hints]]
text = "`add(prerequisite, name)`: look the prerequisite up (None if unknown), take `self.next_id` and bump it, build the `Tech` with `prerequisite: Rc::downgrade(&pre_rc)`, push a clone of the new `Rc` onto the prerequisite's `unlocks`, and insert it into `self.techs`."
[[hints]]
text = "`path`: start at the tech, push its name, then `upgrade()` the prerequisite and repeat. Reverse at the end."
[[hints]]
text = "`render`: a recursive helper `fn render_tech(tech: &Rc<RefCell<Tech>>, depth: usize, out: &mut String)` using `\"  \".repeat(depth)`, then call it for each unlock with `depth + 1`."
[[hints]]
text = "`remove`: refuse the starting tech and unknown ids. Detach from the old prerequisite first: `unlocks.retain(|c| !Rc::ptr_eq(c, &tech))`."
[[hints]]
text = "Still in `remove`: collect the id of every tech below the one you remove, then `self.techs.retain` the ones that are not in that list."
[[hints]]
text = "`reparent`: for the cycle check, walk up from the new prerequisite with `prerequisite.upgrade()` and refuse if you meet the tech being moved. Then detach it from the old prerequisite, push it onto the new one's `unlocks`, and point its `prerequisite` at the new one with `Rc::downgrade`."
