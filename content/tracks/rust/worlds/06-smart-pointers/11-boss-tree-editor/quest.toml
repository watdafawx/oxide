title = "Boss: Tree editor"
summary = "Build the engine of an outliner: add, move, remove and render a tree of notes."
kind = "boss"
xp = 350
minutes = 45
tags = ["rc", "refcell", "weak", "hashmap", "boss"]

[[objectives]]
test = "new_doc_has_root_title"
label = "text(0) is the root's title; unknown ids give None"
[[objectives]]
test = "add_returns_fresh_ids"
label = "add(parent, text) returns a new id each time, None for an unknown parent"
[[objectives]]
test = "path_lists_ancestors"
label = "path(id) lists texts from the root down to the node"
[[objectives]]
test = "render_indents_children"
label = "render() prints the tree, two spaces of indent per level"
[[objectives]]
test = "remove_deletes_subtree"
label = "remove(id) deletes the node and everything below it (never the root)"
[[objectives]]
test = "move_node_reparents"
label = "move_node(id, new_parent) re-attaches the node and its subtree"
[[objectives]]
test = "move_refuses_cycles"
label = "move_node refuses to move a node under itself or its descendants"

[[hints]]
text = "Plan: `nodes: HashMap<u32, Rc<RefCell<Node>>>` finds a node by id. Each node's `children` own it downward, `parent` is a `Weak` pointing up. Start with `text`: `self.nodes.get(&id).map(|n| n.borrow().text.clone())`."
[[hints]]
text = "`add(parent, text)`: look the parent up (None if unknown), take `self.next_id` and bump it, build the `Node` with `parent: Rc::downgrade(&parent_rc)`, push a clone of the new `Rc` onto the parent's `children`, and insert it into `self.nodes`."
[[hints]]
text = "`path`: start at the node, push its text, then `upgrade()` the parent and repeat. Take each step in its own statement (`let up = cur.borrow().parent.upgrade();`) so the borrow ends before you reuse `cur`. Reverse at the end."
[[hints]]
text = "`render`: a recursive helper `fn render_node(node: &Rc<RefCell<Node>>, depth: usize, out: &mut String)` using `\"  \".repeat(depth)`, then call it for each child with `depth + 1`."
[[hints]]
text = "`remove`: refuse the root and unknown ids. Detach from the old parent first: `children.retain(|c| !Rc::ptr_eq(c, &node))`."
[[hints]]
text = "Still in `remove`: collect the id of every node below the one you remove, then `self.nodes.retain` the ones that are not in that list."
[[hints]]
text = "`move_node`: for the cycle check, walk up from the new parent with `parent.upgrade()` and refuse if you meet the node being moved. Then detach it from the old parent, push it onto the new parent's `children`, and point its `parent` at the new one with `Rc::downgrade`."
