title = "Weak parents"
summary = "A child that points back to its parent must not own it. Use Weak."
kind = "exercise"
xp = 65
minutes = 12
tags = ["weak", "rc", "cycles"]

[[objectives]]
test = "adopt_links_both_ways"
label = "adopt(&parent, &child) fills parent.children and child.parent"
[[objectives]]
test = "parent_link_is_weak"
label = "The parent's strong count stays 1 (only a weak count is added)"
[[objectives]]
test = "orphan_after_parent_dropped"
label = "parent_name returns None once the parent is gone (no unwrap!)"

[[hints]]
text = "`parent.children.borrow_mut().push(Rc::clone(child));` then set `*child.parent.borrow_mut() = Rc::downgrade(parent);`"
[[hints]]
text = "`Rc::downgrade(&rc)` makes a `Weak`. It does not raise the strong count."
[[hints]]
text = "`node.parent.borrow().upgrade()` returns `Option<Rc<TreeNode>>`. `.map(|p| p.name.clone())` finishes it."

[[points]]
after = 2
prompt = "Which type does not keep its target alive?"
pick = ["Weak<T>", "Rc<T>", "Box<T>", "Arc<T>"]
answer = 0

[[points]]
after = 5
prompt = "Get the Rc back, if it is still there."
code = "println!(\"{:?}\", weak.___());"
blank = "upgrade"
