title = "One error type for everything"
summary = "Box<dyn Error> lets one function return many kinds of errors."
kind = "exercise"
xp = 50
minutes = 8
tags = ["box", "dyn", "error-trait"]

[[objectives]]
test = "parses_a_valid_pair"
label = "parse_pair(\"3,4.5\") returns (3, 4.5), also with spaces around the parts"
[[objectives]]
test = "missing_comma_is_an_error_with_message"
label = "No comma gives an error saying \"missing comma\""
[[objectives]]
test = "bad_numbers_convert_into_the_box"
label = "ParseIntError and ParseFloatError both fit in the Box"

[[hints]]
text = "Split with `s.split_once(',')`. It returns an Option, so turn it into an error with `.ok_or(\"missing comma\")?`. A `&str` converts into `Box<dyn Error>` by itself."
[[hints]]
text = "Then `let a = left.trim().parse::<i32>()?;` and `let b = right.trim().parse::<f64>()?;`. Two different error types, one `?`."
[[hints]]
text = "Finish with `Ok((a, b))`."

[[points]]
after = 2
prompt = "Which type means \"any error, on the heap\"?"
pick = ["Box<dyn Error>", "Vec<Error>", "String", "Option<Error>"]
answer = 0

[[points]]
after = 5
prompt = "Cut the stray spaces first."
code = "\" 10 \".___().parse::<u32>()"
blank = "trim"
