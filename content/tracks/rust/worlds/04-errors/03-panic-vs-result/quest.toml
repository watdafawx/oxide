title = "Panic or Result?"
summary = "When to crash on purpose, and when to hand the problem back."
kind = "read"
xp = 15
minutes = 3
tags = ["panic", "unwrap", "expect"]

[[quiz]]
question = "A user types a file name that does not exist. What should your function do?"
choices = ["panic!, the program cannot continue", "Return Err so the caller decides what to do", "Call unwrap() and hope the file is there"]
answer = 1

[[quiz]]
question = "When is expect(\"reason\") the right call?"
choices = ["On a line of user input that might be malformed, to get a clear message", "Instead of ? in any function that returns a Result, to save typing", "On a value you know cannot fail, saying why"]
answer = 2
