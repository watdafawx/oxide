title = "anyhow: errors at the launcher's edge"
summary = "One Result type, context messages, and bail! for quick failures."

[[objectives]]
test = "parse_version_reads_a_number"
label = "parse_version(\" 12 \") returns Ok(12)"
[[objectives]]
test = "bad_version_has_context_message"
label = "A bad version reports \"version must be a number\""
[[objectives]]
test = "bad_version_keeps_its_root_cause"
label = "The original parse error is still the root cause"
[[objectives]]
test = "check_ram_percent_bails_out_of_range"
label = "check_ram_percent uses bail! for values outside 0..=100"

[[hints]]
text = "Add `.context(\"version must be a number\")` after `.parse::<u32>()`. `Context` is already imported."
[[hints]]
text = "`bail!(\"ram percent out of range: {n}\")` returns an `Err` immediately, like `return Err(...)`."
[[hints]]
text = "Use `if !(0..=100).contains(&n) { bail!(...); }` then `Ok(n)`."
