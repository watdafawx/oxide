title = "anyhow: errors for apps"
summary = "One Result type, context messages, and bail! for quick failures."
kind = "exercise"
xp = 60
minutes = 10
tags = ["anyhow", "context", "crates"]

[[objectives]]
test = "valid_port_parses"
label = "parse_port(\"8080\") returns Ok(8080)"
[[objectives]]
test = "bad_port_has_context_message"
label = "A bad port reports \"port must be a number\""
[[objectives]]
test = "context_keeps_the_original_cause"
label = "The original parse error is still the root cause"
[[objectives]]
test = "check_percent_bails_when_out_of_range"
label = "check_percent uses bail! for values outside 0..=100"

[[hints]]
text = "Add `.context(\"port must be a number\")` after `.parse::<u16>()`. `Context` is already imported."
[[hints]]
text = "`bail!(\"percent out of range: {n}\")` returns an `Err` immediately, like `return Err(...)`."
[[hints]]
text = "Use `if !(0..=100).contains(&n) { bail!(...); }` then `Ok(n)`."
