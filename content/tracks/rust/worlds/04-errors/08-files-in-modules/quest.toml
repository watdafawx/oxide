title = "One file per module"
summary = "Wire src/parser.rs and src/report.rs into the crate with mod."
kind = "exercise"
xp = 45
minutes = 8
tags = ["mod", "files", "crate"]

[[objectives]]
test = "parse_line_splits_name_and_score"
label = "parser::parse_line reads \"name: score\""
[[objectives]]
test = "parse_line_rejects_garbage"
label = "Bad lines give None"
[[objectives]]
test = "best_player_picks_the_highest_score"
label = "report::best_player uses crate::parser"

[[hints]]
text = "`parse_line`: `let (name, score) = line.split_once(':')?;` then `let score = score.trim().parse().ok()?;`."
[[hints]]
text = "Return `Some((name.trim().to_string(), score))`."
[[hints]]
text = "`best_player`: `lines.iter().filter_map(|l| parse_line(l)).max_by_key(|(_, score)| *score).map(|(name, _)| name)`."
