title = "Boss: the mod list manager"
summary = "A mod list saved to a file, with typed errors inside and anyhow outside."

[[objectives]]
test = "new_mod_list_is_empty"
label = "ModList::new() starts with no mods"
[[objectives]]
test = "add_assigns_increasing_mod_ids"
label = "add returns ids 1, 2, ... and stores the mods, enabled"
[[objectives]]
test = "toggle_flips_enabled_and_reports_missing_ids"
label = "toggle enables/disables a mod, unknown id gives ModError::NotFound"
[[objectives]]
test = "parse_command_reads_add_toggle_list"
label = "parse_command reads add, toggle and list"
[[objectives]]
test = "parse_command_rejects_bad_input"
label = "Bad input gives ModError::BadCommand"
[[objectives]]
test = "mod_list_save_and_load_round_trip"
label = "save writes a file that load reads back identically"
[[objectives]]
test = "load_missing_mod_list_gives_empty_list"
label = "load tolerates a mod list file that does not exist yet"
[[objectives]]
test = "run_executes_mod_commands"
label = "run adds, toggles and lists, and errors keep their ModError"

[[hints]]
text = "`new` is `ModList { mods: Vec::new() }`. In `add`, find the highest id with a loop: `let mut highest = 0; for entry in &self.mods { if entry.id > highest { highest = entry.id; } }`, then push a `ModEntry` with id `highest + 1`, enabled."
[[hints]]
text = "`toggle`: `for entry in &mut self.mods { if entry.id == id { entry.enabled = !entry.enabled; return Ok(()); } }` and after the loop `Err(ModError::NotFound(id))`."
[[hints]]
text = "`parse_command`: `let (verb, rest) = split_verb(input); let bad = ModError::BadCommand(input.trim().to_string());` then `match verb { \"add\" => ..., \"toggle\" => ..., \"list\" => Ok(Command::List), _ => Err(bad) }`."
[[hints]]
text = "`\"add\"`: `if rest.is_empty() { Err(bad) } else { Ok(Command::Add(rest.to_string())) }`. `\"toggle\"`: `match rest.parse::<u32>() { Ok(id) => Ok(Command::Toggle(id)), Err(_) => Err(bad) }`."
[[hints]]
text = "`save`: build `text` with `text.push_str(&format_line(entry)); text.push('\\n');` for every mod, then `fs::write(path, text).with_context(|| format!(\"could not write {}\", path.display()))`."
[[hints]]
text = "`load`: `let text = match fs::read_to_string(path) { Ok(text) => text, Err(e) if e.kind() == io::ErrorKind::NotFound => return Ok(ModList::new()), Err(e) => return Err(e).with_context(|| format!(\"could not read {}\", path.display())) };`."
[[hints]]
text = "Still in `load`: `let mut list = ModList::new(); for (i, line) in text.lines().enumerate() { list.mods.push(parse_line(line).with_context(|| format!(\"line {}\", i + 1))?); } Ok(list)`."
[[hints]]
text = "`run`: `match cmd { Command::Add(name) => Ok(format!(\"added {}\", list.add(&name))), Command::Toggle(id) => { list.toggle(id)?; Ok(format!(\"toggled {id}\")) } Command::List => ... }`."
[[hints]]
text = "`Command::List`: an empty list gives `\"no mods yet\"`. Otherwise `let mut lines = Vec::new();` and for each mod push `format!(\"[{}] {} {}\", mark, entry.id, entry.name)`, where `mark` is `if entry.enabled { 'x' } else { ' ' }`; return `Ok(lines.join(\"\\n\"))`."

[[points]]
after = 1
prompt = "Which error type do the tests match on?"
pick = ["anyhow::Error", "io::Error", "ModError", "String"]
answer = 2
[[points]]
after = 3
prompt = "Add a condition to the arm."
code = "Err(e) ___ e.kind() == io::ErrorKind::NotFound => return Ok(ModList::new()),"
blank = "if"
