title = "ManifestError: what can go wrong"
summary = "An enum for every way a mod line can be broken, with a readable message each."

[[objectives]]
test = "manifest_errors_display_clearly"
label = "Display prints a clear message for each ManifestError"
[[objectives]]
test = "parse_mod_line_reports_each_failure"
label = "parse_mod_line returns MissingMod, BadVersion or UnknownLoader"
[[objectives]]
test = "manifest_error_works_as_dyn_error"
label = "ManifestError can be used as a &dyn Error"

[[hints]]
text = "In `fmt`, `match self` and use `write!(f, \"...\")` in each arm. Variants with data bind it: `ManifestError::BadVersion(v) => write!(f, \"'{v}' is not a version number\")`."
[[hints]]
text = "In `parse_mod_line`: `split_whitespace()` gives the `name@version` part and then the loader. No first part, or an empty name, is `Err(ManifestError::MissingMod)`."
[[hints]]
text = "Split `name@version` with `split_once('@')`. Parse the version with `.map_err(|_| ManifestError::BadVersion(version.to_string()))?`. Last, match the loader text: `fabric`, `forge`, `neoforge`, else `UnknownLoader`."
