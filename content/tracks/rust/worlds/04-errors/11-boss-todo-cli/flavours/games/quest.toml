title = "Boss: the mod list manager"
summary = "A mod list saved to a file, with typed errors inside and anyhow outside."

[[objectives]]
test = "new_mod_list_is_empty"
label = "ModList::new() starts with no mods"
[[objectives]]
test = "add_assigns_increasing_mod_ids"
label = "add returns ids 1, 2, ... and stores the mods, enabled"
[[objectives]]
test = "toggle_flips_enabled_and_reports_missing_ids"
label = "toggle enables/disables a mod, unknown id gives ModError::NotFound"
[[objectives]]
test = "parse_command_reads_add_toggle_list"
label = "parse_command reads add, toggle and list"
[[objectives]]
test = "parse_command_rejects_bad_input"
label = "Bad input gives ModError::BadCommand"
[[objectives]]
test = "mod_list_save_and_load_round_trip"
label = "save writes a file that load reads back identically"
[[objectives]]
test = "load_missing_mod_list_gives_empty_list"
label = "load tolerates a mod list file that does not exist yet"
[[objectives]]
test = "run_executes_mod_commands"
label = "run adds, toggles and lists, and errors keep their ModError"

[[hints]]
text = "Start small: `ModList::new()` is `Self::default()`. Then `add`: the next id is `self.mods.iter().map(|m| m.id).max().unwrap_or(0) + 1`."
[[hints]]
text = "`toggle`: `self.mods.iter_mut().find(|m| m.id == id).ok_or(ModError::NotFound(id))?` gives you the mod to flip."
[[hints]]
text = "`parse_command`: `let input = input.trim();` then `split_once(' ').unwrap_or((input, \"\"))` gives verb and rest. `match verb { \"add\" => ..., \"toggle\" => ..., \"list\" => ..., _ => Err(ModError::BadCommand(input.to_string())) }`."
[[hints]]
text = "`add` needs a non-empty `rest`. `toggle` parses a number: `rest.parse().map(Command::Toggle).map_err(|_| ModError::BadCommand(input.to_string()))`."
[[hints]]
text = "`load`: `match std::fs::read_to_string(path) { Ok(text) => text, Err(e) if e.kind() == std::io::ErrorKind::NotFound => return Ok(ModList::new()), Err(e) => return Err(e).with_context(|| ...) }`."
[[hints]]
text = "Still in `load`: `text.lines().enumerate()`, then `parse_line(line).with_context(|| format!(\"line {}\", i + 1))` for each, collected into `Result<Vec<ModEntry>>` with `?`."
[[hints]]
text = "`save`: `self.mods.iter().map(format_line).collect::<Vec<_>>().join(\"\\n\")`, then `std::fs::write(path, text)` with the `with_context` from the TODO."
[[hints]]
text = "`run`: `match cmd { Command::Add(name) => Ok(format!(\"added {}\", list.add(&name))), Command::Toggle(id) => { list.toggle(id)?; Ok(format!(\"toggled {id}\")) } Command::List => ... }`."
