title = "Add context"
summary = "Put a sentence on top of an error, keep the root cause, and build text only on failure."

[[objectives]]
test = "context_sits_on_top_of_the_root_cause"
label = "A bad version says \"version must be a number\" and keeps the parse error as root cause"
[[objectives]]
test = "with_context_names_the_mod"
label = "version_of_mod(\"sodium\", \"new\") reads \"mod sodium: version must be a number: ...\""

[[hints]]
text = "Both bodies are one line. `context` goes right after `.parse::<u32>()`; `with_context` goes right after the call to `parse_version(text)`."
[[hints]]
text = "`text.trim().parse::<u32>().context(\"version must be a number\")` and `parse_version(text).with_context(|| format!(\"mod {name}\"))`."

[[points]]
after = 1
prompt = "After .context(..), what is the original error called?"
pick = ["The context", "The root cause", "The panic", "The mod file"]
answer = 1
[[points]]
after = 3
prompt = "Build the message only when there is an error."
code = "parse_version(text).___(|| format!(\"mod {name}\"))"
blank = "with_context"
