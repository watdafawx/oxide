title = "One file per module"
summary = "mod parser; loads src/parser.rs, and siblings reach each other through crate::."
kind = "exercise"
xp = 40
minutes = 5
tags = ["mod", "files", "crate"]
starter_fails_to_compile = true

[[objectives]]
test = "parser_file_is_wired_in"
label = "lib.rs declares parser and report, so parser::priority_of works"
[[objectives]]
test = "report_adds_up_through_the_parser"
label = "report::total_priority adds crate::parser::priority_of of every line"

[[hints]]
text = "Two lines at the top of `lib.rs`, each `pub mod` plus a file name without `.rs`. Then `total_priority` is a `for` loop with a running total."
[[hints]]
text = "`pub mod parser;` and `pub mod report;`. In `report.rs`: `let mut total = 0; for line in lines { total += crate::parser::priority_of(line); } total`."

[[points]]
after = 1
prompt = "Which line loads src/clock.rs as a module?"
pick = ["use clock;", "mod clock;", "mod clock {}", "pub clock;"]
answer = 1
[[points]]
after = 4
prompt = "Reach the sibling room from the top of the crate."
code = "use ___::clock::minutes;"
blank = "crate"
