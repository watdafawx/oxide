title = "HashMap: look things up by key"
summary = "Insert, get, and count words with entry().or_insert()."
kind = "exercise"
xp = 60
minutes = 10
tags = ["hashmap", "entry"]

[[objectives]]
test = "price_of_uses_get"
label = "price_of returns Some(price) for a known item, None otherwise"
[[objectives]]
test = "stock_map_inserts_pairs"
label = "stock_map builds a HashMap from names and counts"
[[objectives]]
test = "count_words_counts_each_word"
label = "count_words counts how often each word appears"

[[hints]]
text = "`prices.get(item)` gives `Option<&f64>`. Add `.copied()` to get `Option<f64>`."
[[hints]]
text = "`let mut map = HashMap::new();` then walk both slices together with `for (name, count) in names.iter().zip(counts)` and `map.insert(name.to_string(), *count);` inside it."
[[hints]]
text = "`*counts.entry(word.to_string()).or_insert(0) += 1;` — `or_insert` returns a `&mut` to the value, so `*` and `+= 1` bumps it."
