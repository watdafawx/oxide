title = "Hand over a rule"
summary = "A function can take a closure as a parameter: impl Fn(u32) -> bool."
kind = "exercise"
xp = 45
minutes = 6
tags = ["closures", "impl-fn", "impl-trait"]

[[objectives]]
test = "count_where_uses_the_callers_rule"
label = "count_where counts the products that pass the rule it is given"
[[objectives]]
test = "change_all_applies_the_rule_to_every_price"
label = "change_all gives back every price changed by the rule it is given"

[[hints]]
text = "`rule` is called like any function. Inside the loop: `if rule(*n) { matches += 1; }`."
[[hints]]
text = "In `change_all`: `out.push(change(*p));` inside `for p in prices`."

[[points]]
after = 2
prompt = "What does `impl Fn(u32) -> bool` accept?"
pick = ["only functions named Fn", "a bool", "a u32", "anything callable with a u32 that gives a bool"]
answer = 3
[[points]]
after = 3
prompt = "Take a rule that turns a price into a new price."
code = "fn change_all(prices: &[u32], change: ___) -> Vec<u32>"
blank = "impl Fn(u32) -> u32"
