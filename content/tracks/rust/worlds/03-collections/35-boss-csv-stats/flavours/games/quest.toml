title = "Boss: Modpack stats"
summary = "Read a modpack's mod list as CSV text and answer questions about it with iterator chains."

[[objectives]]
test = "mod_size_kb_is_mb_times_1024"
label = "Mod::size_kb is size_mb times 1024"
[[objectives]]
test = "parse_mod_reads_fields_and_rejects_bad_ones"
label = "parse_mod reads one line into a Mod, or says what is wrong"
[[objectives]]
test = "parse_modlist_skips_header_and_blanks"
label = "parse_modlist skips the header and blank lines and returns every Mod"
[[objectives]]
test = "parse_modlist_reports_line_number"
label = "parse_modlist fails with \"line N: ...\" for the first bad line"
[[objectives]]
test = "downloads_by_loader_sums_per_loader"
label = "downloads_by_loader sums downloads per loader, sorted by name"
[[objectives]]
test = "top_n_picks_most_downloaded"
label = "top_n returns the n most downloaded mods, biggest first"
[[objectives]]
test = "smallest_in_filters_a_loader"
label = "smallest_in returns the smallest mod of a loader by size_mb, or None"
[[objectives]]
test = "report_aligns_mod_columns"
label = "report prints a header, one aligned line per mod, and a footer"

[[hints]]
text = "Start small: `Mod::size_kb` is `self.size_mb * 1024.0`. Then `parse_mod`: `line.split(',').map(|f| f.trim()).collect()` into a `Vec<&str>` gives the fields. Check `fields.len()` first and `return Err(...)` if it is not 4."
[[hints]]
text = "Parsing a field: `fields[2].parse().map_err(|_| format!(\"bad downloads '{}'\", fields[2]))?`. The type of the `downloads` field in `Mod` tells `parse` to build a `u64`."
[[hints]]
text = "`parse_modlist`: `csv.lines().enumerate().skip(1)` gives `(index, line)` pairs without the header. `.filter(|(_, line)| !line.trim().is_empty())`, then `.map(|(i, line)| parse_mod(line).map_err(|e| format!(\"line {}: {e}\", i + 1)))`, then `.collect()`."
[[hints]]
text = "`downloads_by_loader`: a `BTreeMap` and `*totals.entry(m.loader.clone()).or_insert(0) += m.downloads;`. `top_n`: `let mut sorted: Vec<&Mod> = mods.iter().collect();`, `sorted.sort_by(|a, b| b.downloads.cmp(&a.downloads));`, then `sorted.into_iter().take(n).collect()`."
[[hints]]
text = "`smallest_in`: `mods.iter().filter(|m| m.loader == loader).min_by(|a, b| a.size_mb.total_cmp(&b.size_mb))`. `report`: `let mut lines = vec![header];`, a `for` loop that pushes `format!(\"{:<10} {:<9} {:>9} {:>7.1}\", ...)` per mod, push the footer, then `lines.join(\"\\n\")`."

[[points]]
after = 2
prompt = "Which call rewrites an error into your own message?"
pick = ["unwrap_or", "expect", "map_err", "filter_map"]
answer = 2
[[points]]
after = 3
prompt = "Walk the text one line at a time."
code = "for line in csv.___() {"
blank = "lines"
