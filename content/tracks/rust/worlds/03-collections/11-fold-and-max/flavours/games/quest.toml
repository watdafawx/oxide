title = "Fold the armor, find the biggest stack"
summary = "Carry a hit through each armor piece with fold, and pick the biggest stack."

[[objectives]]
test = "armor_reduces_damage_step_by_step"
label = "damage_after_armor folds a hit through each armor reduction"
[[objectives]]
test = "biggest_stack_has_most_items"
label = "biggest_stack returns the stack with the most items, or None if empty"

[[hints]]
text = "`fold(start, |acc, item| next_acc)`: the closure returns the new running value. Start from `damage`."
[[hints]]
text = "`reductions.iter().fold(damage, |d, off| d * (1.0 - off / 100.0))`. And `stacks.iter().max_by_key(|s| s.count)`."
