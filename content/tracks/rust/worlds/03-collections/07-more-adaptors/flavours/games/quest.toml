title = "Hotbar adaptors"
summary = "enumerate, zip, skip, take and windows over hotbar slots and chest pages."

[[objectives]]
test = "hotbar_labels_are_numbered"
label = "hotbar_labels turns [\"sword\", \"bow\"] into [\"[1] sword\", \"[2] bow\"]"
[[objectives]]
test = "loot_value_pairs_counts_with_prices"
label = "loot_value multiplies each count by its price and sums them"
[[objectives]]
test = "chest_page_skips_then_takes"
label = "chest_page returns one page of chest items using skip and take"
[[objectives]]
test = "count_upgrades_compares_neighbours"
label = "count_upgrades counts steps where the next slot has a higher tier"

[[hints]]
text = "`items.iter().enumerate().map(|(i, item)| format!(\"[{}] {item}\", i + 1)).collect()`. `enumerate` yields `(index, item)` pairs starting at 0."
[[hints]]
text = "`counts.iter().zip(prices).map(|(c, p)| c * p).sum()` walks both slices in step and stops at the shorter one."
[[hints]]
text = "Page: `items.iter().skip(page * size).take(size).map(|s| s.to_string()).collect()`. Upgrades: `tiers.windows(2).filter(|pair| pair[1] > pair[0]).count()`."
