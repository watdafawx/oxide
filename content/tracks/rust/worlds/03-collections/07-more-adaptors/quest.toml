title = "More adaptors"
summary = "enumerate, zip, skip, take, rev, chars and windows."
kind = "exercise"
xp = 65
minutes = 12
tags = ["iterators", "enumerate", "zip", "windows"]

[[objectives]]
test = "numbered_uses_enumerate"
label = "numbered turns [\"a\", \"b\"] into [\"1. a\", \"2. b\"]"
[[objectives]]
test = "dot_product_zips_two_slices"
label = "dot_product multiplies matching items and sums them"
[[objectives]]
test = "page_skips_then_takes"
label = "page returns one page of items using skip and take"
[[objectives]]
test = "count_rises_uses_windows"
label = "count_rises counts steps where the next number is bigger"

[[hints]]
text = "`items.iter().enumerate().map(|(i, item)| format!(\"{}. {item}\", i + 1)).collect()`. `enumerate` yields `(index, item)` pairs starting at 0."
[[hints]]
text = "`a.iter().zip(b).map(|(x, y)| x * y).sum()` walks both slices in step and stops at the shorter one."
[[hints]]
text = "Page: `items.iter().skip(page * size).take(size).copied().collect()`. Rises: `numbers.windows(2).filter(|pair| pair[1] > pair[0]).count()`."

[[points]]
after = 2
prompt = "Which gives (index, item)?"
pick = ["enumerate", "zip", "take", "skip"]
answer = 0

[[points]]
after = 4
prompt = "Reverse the characters."
code = "let backwards: String = \"abc\".chars().___().collect();"
blank = "rev"
