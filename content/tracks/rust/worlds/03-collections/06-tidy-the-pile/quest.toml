title = "Tidy the order list"
summary = "sort puts a list in order; dedup drops repeats, but only next-door ones."
kind = "exercise"
xp = 30
minutes = 4
tags = ["vec", "sort", "dedup"]

[[objectives]]
test = "sorted_orders_are_a_to_z"
label = "sorted_orders gives back the names from a to z"
[[objectives]]
test = "unique_orders_have_no_repeats"
label = "unique_orders gives back the names a to z with every repeat gone"

[[hints]]
text = "Both functions own their list, so start with `let mut orders = orders;`. `orders.sort();` changes it in place."
[[hints]]
text = "Sorted: `orders.sort(); orders`. Unique: `orders.sort(); orders.dedup(); orders`."

[[points]]
after = 2
prompt = "`[mug, pen, mug]` after only `dedup()` is..."
pick = ["[mug, pen]", "[mug, pen, mug]", "[pen, mug]", "[mug]"]
answer = 1
[[points]]
after = 3
prompt = "Drop the repeats once the list is sorted."
code = "orders.sort();\norders.___();"
blank = "dedup"
