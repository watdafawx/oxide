title = "Iterator chains"
summary = "map, filter, collect, sum and count: loops without the bookkeeping."
kind = "exercise"
xp = 55
minutes = 10
tags = ["iterators", "map", "filter", "collect"]

[[objectives]]
test = "squares_maps_each_number"
label = "squares maps every number to its square and collects a Vec"
[[objectives]]
test = "evens_filters"
label = "evens keeps only the even numbers"
[[objectives]]
test = "total_length_sums_lengths"
label = "total_length adds up the length of every word"
[[objectives]]
test = "count_long_counts_filtered"
label = "count_long counts words with at least min_len bytes"

[[hints]]
text = "`numbers.iter().map(|n| n * n).collect()`. The return type `Vec<i32>` tells `collect` what to build."
[[hints]]
text = "`.iter().copied().filter(|n| n % 2 == 0).collect()`. `copied()` turns `&i32` into `i32` so no references are left over."
[[hints]]
text = "Lengths: `words.iter().map(|w| w.len()).sum()`. Counting: `words.iter().filter(|w| w.len() >= min_len).count()`."

[[points]]
after = 3
prompt = "Which keeps items where the closure is true?"
pick = ["map", "filter", "collect", "sum"]
answer = 1

[[points]]
after = 5
prompt = "End the chain with a Vec."
code = "let doubled: Vec<i32> = numbers.iter().map(|n| n * 2).___;"
blank = "collect()"
