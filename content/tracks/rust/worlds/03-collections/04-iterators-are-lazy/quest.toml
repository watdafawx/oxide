title = "Iterators are lazy"
summary = "Why .map() alone does nothing, and what makes the chain run."
kind = "read"
xp = 15
minutes = 3
tags = ["iterators", "lazy"]

[[quiz]]
question = "What does `numbers.iter().map(|n| n * 2);` do on its own, with no `.collect()` after it?"
choices = ["Nothing yet: it only builds a lazy iterator", "It doubles every number in `numbers` in place", "It returns a new Vec with the doubled numbers"]
answer = 0

[[quiz]]
question = "Which of these **consumes** the iterator and actually runs the chain?"
choices = [".filter(|n| *n > 1)", ".sum::<i32>()", ".rev()"]
answer = 1
