title = "All or nothing"
summary = "Collect a chain of Results into one Result: every value, or the first error."

[[objectives]]
test = "parse_all_gives_every_number_or_the_first_error"
label = "parse_all gives Ok with every count, or the first error"
[[objectives]]
test = "parse_all_numbered_says_which_slot_failed"
label = "parse_all_numbered puts \"slot N: \" in front of the error, counting from 1"

[[hints]]
text = "Map every field through `parse_count` and `collect()`. The return type `Result<Vec<u32>, String>` tells `collect` to stop at the first `Err`."
[[hints]]
text = "`fields.iter().map(|f| parse_count(f)).collect()`. Numbered: `.enumerate().map(|(i, f)| parse_count(f).map_err(|e| format!(\"slot {}: {e}\", i + 1))).collect()`."

[[points]]
after = 2
prompt = "Collecting [Ok(3), Err(\"bad\"), Ok(5)] into `Result<Vec<u32>, String>` gives..."
pick = ["Ok([3, 5])", "Ok([3])", "Err(\"bad\")", "a panic"]
answer = 2
[[points]]
after = 3
prompt = "Put the slot in front of the message."
code = "parse_count(f).___(|e| format!(\"slot {}: {e}\", i + 1))"
blank = "map_err"
