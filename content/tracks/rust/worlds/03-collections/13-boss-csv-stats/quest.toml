title = "Boss: CSV stats"
summary = "Parse a CSV of products and answer questions about it with iterator chains."
kind = "boss"
xp = 350
minutes = 45
tags = ["iterators", "hashmap", "btreemap", "strings", "result", "boss"]

[[objectives]]
test = "row_total_multiplies_price_by_qty"
label = "Row::total is price times qty"
[[objectives]]
test = "parse_line_reads_fields_and_rejects_bad_ones"
label = "parse_line reads one line into a Row, or says what is wrong"
[[objectives]]
test = "parse_rows_skips_header_and_blanks"
label = "parse_rows skips the header and blank lines and returns every Row"
[[objectives]]
test = "parse_rows_reports_line_number"
label = "parse_rows fails with \"line N: ...\" for the first bad line"
[[objectives]]
test = "total_by_category_sums_per_category"
label = "total_by_category sums price * qty per category, sorted by name"
[[objectives]]
test = "top_n_picks_biggest_totals"
label = "top_n returns the n rows with the largest price * qty, biggest first"
[[objectives]]
test = "cheapest_in_filters_a_category"
label = "cheapest_in returns the lowest-priced row of a category, or None"
[[objectives]]
test = "report_aligns_columns"
label = "report prints a header, one aligned line per row, and a footer"

[[hints]]
text = "Start small: `Row::total` is `self.price * self.qty as f64`. Then `parse_line`: `line.split(',').map(str::trim).collect::<Vec<_>>()` gives the fields. Check `fields.len()` first."
[[hints]]
text = "Parsing a field: `fields[2].parse().map_err(|_| format!(\"bad price '{}'\", fields[2]))?`. The `?` at the end returns the `Err` from your function right away, or gives you the number."
[[hints]]
text = "`parse_rows`: `csv.lines().enumerate().skip(1)` gives `(index, line)` pairs without the header. `.filter` out blank lines, `.map` each to `parse_line(line).map_err(|e| format!(\"line {}: {e}\", i + 1))`, then `.collect()`. Collecting an iterator of `Result`s into `Result<Vec<_>, _>` stops at the first `Err`."
[[hints]]
text = "`total_by_category`: a `BTreeMap` and `*totals.entry(row.category.clone()).or_insert(0.0) += row.total();`. `top_n`: `rows.iter().collect::<Vec<_>>()`, `sort_by(|a, b| b.total().total_cmp(&a.total()))`, then `.into_iter().take(n).collect()`."
[[hints]]
text = "`cheapest_in`: `.iter().filter(|r| r.category == category).min_by(|a, b| a.price.total_cmp(&b.price))`. `report`: `vec![header]`, `extend` it with a `map` of `format!(\"{:<10} {:<9} {:>8.2} {:>4}\", ...)`, push the footer, `join(\"\\n\")`."
