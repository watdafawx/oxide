[[quiz]]
question = 'Line 1 of a program is `print("A")` and line 2 is `print("B")`. What shows up?'
choices = ["B, then A", "A, then B", "A and B at the same moment"]
answer = 1

[[quiz]]
question = "What is source code?"
choices = ["what the program shows on the screen", "a secret key that unlocks the computer", "the instructions, written as text in a file"]
answer = 2

[[quiz]]
question = "You type `prnit` where you meant `print`. What does the computer do?"
