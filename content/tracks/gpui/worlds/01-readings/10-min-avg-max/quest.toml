title = "Min, average, max"
summary = "The hover card's three numbers, from one walk over the history."
kind = "exercise"
xp = 40
minutes = 6
tags = ["for", "option"]

[[objectives]]
test = "min_avg_max_of_10_20_30"
label = "10, 20, 30 give min 10, avg 20, max 30"
[[objectives]]
test = "summary_of_empty_is_none"
label = "an empty history has no summary"

[[hints]]
text = "Start with `if self.is_empty() { return None; }`. Then one `for v in self.values()` loop with three lines in it, like the `highest` loop, and `mut` on all three variables."
[[hints]]
text = "In the loop: `min = min.min(v); max = max.max(v); total += v;`. The last line already builds `Some(Summary { min, avg: total / self.len() as f64, max })`."

[[points]]
after = 1
prompt = "Why does min start at f64::MAX?"
pick = ["MAX means no value", "So the average is right", "Any real reading is smaller, so the first one replaces it", "Rust needs a start value of MAX"]
answer = 2
[[points]]
after = 5
prompt = "What does an empty history's average come out as, without the check?"
pick = ["0", "NaN", "None", "a panic"]
answer = 1
