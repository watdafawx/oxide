title = "Units"
summary = "Every kind knows its unit: percent, degrees, bytes, bytes per second or milliseconds."
kind = "exercise"
xp = 30
minutes = 5
tags = ["enum", "match"]

[[objectives]]
test = "temps_are_celsius"
label = "CpuTemp and GpuTemp are in Celsius"
[[objectives]]
test = "network_and_ping_units"
label = "NetDown and NetUp are BytesPerSec, Ping is Millis"

[[hints]]
text = "Add arms to the `match` in `unit`, above the `_` arm."
[[hints]]
text = "`StatKind::CpuTemp => Unit::Celsius,`, the same for `GpuTemp`, `StatKind::NetDown => Unit::BytesPerSec,` and `NetUp`, then `StatKind::Ping => Unit::Millis,`. Delete `_ => Unit::Percent,`."

[[points]]
after = 2
prompt = "Which unit fits a download speed?"
pick = ["Bytes", "BytesPerSec", "Percent", "Millis"]
answer = 1
