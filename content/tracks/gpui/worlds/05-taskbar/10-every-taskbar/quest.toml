title = "Every taskbar"
summary = "With \"Show on all taskbars\" on, one bar per monitor's taskbar; otherwise the primary only."
kind = "exercise"
xp = 40
minutes = 6
tags = ["iterator", "multi-monitor"]

[[objectives]]
test = "two_taskbars_two_bars"
label = "with the setting on, both taskbars get a bar"
[[objectives]]
test = "primary_only_by_default"
label = "with it off, only the primary taskbar does"

[[hints]]
text = "`filter` the taskbars: keep one when the setting is on, or when it is the primary."
[[hints]]
text = "`taskbars.iter().filter(|t| all_taskbars || t.primary).copied().collect()`"

[[points]]
after = 2
prompt = "Why `copied()` after `filter`?"
pick = ["to sort the taskbars", "filter gives references; copied makes owned Taskbars", "to skip the primary", "collect needs a copy of the whole list"]
answer = 1
[[points]]
after = 3
prompt = "What happens if a bar window for monitor 2 opens without its display_id?"
pick = ["it opens on monitor 2 anyway", "it fails to open", "it opens on every monitor", "GPUI moves it to its default size on the primary"]
answer = 3
