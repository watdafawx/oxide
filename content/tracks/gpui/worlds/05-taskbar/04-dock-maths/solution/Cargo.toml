[package]
name = "kinetik_05_dock_maths"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui = { version = "=0.2.2", features = ["test-support"] }
sysinfo = { version = "=0.39.6", default-features = false, features = ["system", "disk", "network"] }
nvml-wrapper = "=0.13.0"
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Power", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }
wmi = { version = "=0.18.4", default-features = false }
serde = { version = "1", features = ["derive"] }
raw-window-handle = "0.6"

[workspace]
