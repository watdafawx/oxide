title = "See-through"
summary = "Only the pill is drawn; everything else in the window shows the taskbar behind it."
kind = "exercise"
xp = 25
minutes = 4
tags = ["gpui", "window"]

[[objectives]]
test = "bar_background_is_transparent"
label = "the bar window's background is Transparent"

[[hints]]
text = "One field in `bar_window_options`: `window_background`, with the other variant of the same enum."
[[hints]]
text = "`window_background: WindowBackgroundAppearance::Transparent,`"

[[points]]
after = 2
prompt = "With a Transparent window, what shows where the view draws nothing?"
pick = ["white", "black", "whatever is behind the window", "the desktop wallpaper only"]
answer = 2
