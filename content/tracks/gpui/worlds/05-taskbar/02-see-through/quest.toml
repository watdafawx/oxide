title = "See-through"
summary = "Only the pill is drawn; everything else in the window shows the taskbar behind it."
kind = "exercise"
xp = 25
minutes = 4
tags = ["gpui", "window"]

[[objectives]]
test = "bar_background_is_transparent"
label = "the bar window's background is Transparent"

