title = "Find the taskbar"
summary = "Ask Windows for Shell_TrayWnd and its tray: two window lookups and two rectangles."
kind = "exercise"
xp = 45
minutes = 7
tags = ["win32", "unsafe"]

[[objectives]]
test = "taskbar_found_on_this_pc"
label = "find_taskbar finds this PC's taskbar, with its tray inside it"

[[hints]]
text = "Two lookups inside the `unsafe` block, each with `.ok()?`: `FindWindowW` for the taskbar, then `FindWindowExW` for its tray child."
[[hints]]
text = "`let taskbar = FindWindowW(w!(\"Shell_TrayWnd\"), None).ok()?; let tray = FindWindowExW(Some(taskbar), None, w!(\"TrayNotifyWnd\"), None).ok()?;`"

[[points]]
after = 2
prompt = "What is Shell_TrayWnd?"
pick = ["the window class of the main taskbar", "the clock", "the Start menu", "a GPUI window"]
answer = 0
