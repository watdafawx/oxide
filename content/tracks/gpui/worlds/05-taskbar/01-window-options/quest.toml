title = "The bar's window"
summary = "No title bar, a pop-up that never shows in the taskbar, not movable, never taking focus."
kind = "exercise"
xp = 25
minutes = 4
tags = ["gpui", "window"]
requires = ["04-sensors/17-boss-sensor-hub"]

[[objectives]]
test = "bar_window_has_no_titlebar"
label = "bar_window_options has no title bar and does not take focus"
[[objectives]]
test = "bar_window_is_popup"
label = "it is a PopUp window that cannot be moved or resized"

[[hints]]
text = "Set five fields in the `WindowOptions { .. }` in `bar_window_options`; `..Default::default()` fills the rest."
[[hints]]
text = "`titlebar: None, kind: WindowKind::PopUp, is_movable: false, is_resizable: false, focus: false,`"

[[points]]
after = 1
prompt = "What fills the fields you leave out?"
pick = ["nothing: the build fails", "..Default::default()", "the last window you opened", "WindowKind::PopUp"]
answer = 1
[[points]]
after = 5
prompt = "Why focus: false?"
pick = ["focus is slow", "pop-ups cannot focus", "clicking the bar must not take the keyboard from your game", "the title bar needs it"]
answer = 2
