title = "Children from a list"
summary = "The pills come from the model now: one child per pill, however many there are."
kind = "exercise"
xp = 40
minutes = 6
tags = ["gpui", "iterator"]

[[objectives]]
test = "one_element_per_pill"
label = "every pill of the default bar is drawn"

[[hints]]
text = "Replace the single `.child(pill_element(&self.pills[0]))` in `render`."
[[hints]]
text = "`.children(self.pills.iter().map(pill_element))`"

[[points]]
after = 2
prompt = "Which call adds every element an iterator gives?"
pick = [".children(..)", ".child(..)", ".flex_row()", ".collect()"]
answer = 0
[[points]]
after = 3
prompt = "Turn every pill into an element."
code = ".children(self.pills.iter().___(pill_element))"
blank = "map"
