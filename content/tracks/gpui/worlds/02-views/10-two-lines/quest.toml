title = "Two lines"
summary = "Kinetik's compact layout: pills stacked in pairs, a column each."
kind = "exercise"
xp = 45
minutes = 7
tags = ["gpui", "flex"]

[[objectives]]
test = "two_line_layout_stacks_pairs"
label = "in two-line mode, CPU temperature sits under CPU usage"

[[hints]]
text = "Only the `Column::Pills(top, bottom)` arm of `column` changes: a `div()` that is a flex column, the top `PillView` as a `.child`, the bottom one through `.children(bottom.map(..))`, and `.into_any_element()` at the end."
[[hints]]
text = "`div().flex().flex_col().child(PillView { pill: top, show_label }).children(bottom.map(|pill| PillView { pill, show_label })).into_any_element()`"

[[points]]
after = 2
prompt = "Which call stacks a box's children top to bottom?"
pick = [".flex_row()", ".gap_2()", ".flex_col()", ".items_center()"]
answer = 2
[[points]]
after = 3
prompt = "bottom is None. How many children does .children(bottom.map(..)) add?"
pick = ["none", "one empty box", "one", "it panics"]
answer = 0
