title = "Dividers"
summary = "Line, dotted, dot or blank: each divider style is a box of its own width."
kind = "exercise"
xp = 40
minutes = 6
tags = ["gpui", "match", "anyelement"]

[[objectives]]
test = "dot_divider_is_4_wide"
label = "a Dot divider is 4 pixels wide"
[[objectives]]
test = "blank_divider_is_8_wide"
label = "a Blank divider is 8 pixels wide, a Line 1"

[[hints]]
text = "`divider_width` becomes a `match` on `style` with one arm per `DividerStyle`, each giving back a `px(..)` length."
[[hints]]
text = "`DividerStyle::Line => px(1.),` `DividerStyle::Dotted => px(1.),` `DividerStyle::Dot => px(4.),` `DividerStyle::Blank => px(8.),`"

[[points]]
after = 2
prompt = "Which divider style draws nothing but still takes space?"
pick = ["Dot", "Line", "Dotted", "Blank"]
answer = 3
[[points]]
after = 4
prompt = "A Div and a PillView must go into one .children(..). What do both become?"
pick = ["a Div", "an AnyElement", "a PillView", "a String"]
answer = 1
