title = "A pill component"
summary = "PillView: a reusable element with its own render, and named parts for the label and the value."
kind = "exercise"
xp = 45
minutes = 7
tags = ["gpui", "renderonce", "component"]

[[objectives]]
test = "pill_view_draws_label_then_value"
label = "each pill draws label-<Kind> and, to its right, value-<Kind>"

[[hints]]
text = "Two places: the body of `PillView::render`, and the `.children(..)` line in `StatsBar::render`."
[[hints]]
text = "In `PillView::render`, after `.gap_1()`: `.child(div().debug_selector(move || format!(\"label-{kind:?}\")).child(self.pill.label))` and the same with `value-` and `self.pill.text`, then `.text_color(value_colour(self.pill.warning))`."
[[hints]]
text = "In `StatsBar::render`: `.children(self.pills.iter().map(|pill| PillView { pill: pill.clone() }))`."

[[points]]
after = 2
prompt = "Which trait gives an element its own render that runs once and is used up?"
pick = ["RenderOnce", "Render", "IntoElement", "Clone"]
answer = 0
