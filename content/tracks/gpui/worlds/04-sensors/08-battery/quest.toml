title = "The battery"
summary = "Call a Windows function inside unsafe, and say in a comment what you promised."
kind = "exercise"
xp = 35
minutes = 5
tags = ["unsafe", "ffi", "windows"]

[[objectives]]
test = "this_pc_power_status_reads"
label = "read_power_status gets an answer from Windows on your PC"

[[hints]]
text = "Three lines: `let mut status = SYSTEM_POWER_STATUS::default();`, the `unsafe` call with `&mut status` and `.ok()?`, then `Some(status)`."
[[hints]]
text = "`let mut status = SYSTEM_POWER_STATUS::default();` then a `// SAFETY: status is valid and writable for the whole call.` line, then `unsafe { GetSystemPowerStatus(&mut status) }.ok()?;` and `Some(status)`."

[[points]]
after = 2
prompt = "What does unsafe { .. } promise?"
pick = ["the code cannot crash", "it runs faster", "you checked what the compiler cannot", "it runs as administrator"]
answer = 2
[[points]]
after = 3
prompt = "Who is the // SAFETY: comment for?"
pick = ["the compiler", "the next person who reads the code", "Windows", "the test runner"]
answer = 1
