title = "Off the UI thread"
summary = "Read sensors on a background thread so a slow ping never freezes the bar. The compiler insists on Send."
kind = "exercise"
xp = 60
minutes = 8
tags = ["send", "threads", "gpui"]
starter_fails_to_compile = true

[[objectives]]
test = "readings_arrive_from_the_background"
label = "sensors read in the background still reach the bar every tick"

[[hints]]
text = "Read the compiler error: it is about `dyn Sensor` and threads. The fix is one word on the trait in `sensor.rs`."
[[hints]]
text = "`pub trait Sensor: Send {`"

[[points]]
after = 3
prompt = "What does `trait Sensor: Send` promise?"
pick = ["every sensor may be moved to another thread", "sensors are read in order", "sensors never fail", "sensors are cheap"]
answer = 0
