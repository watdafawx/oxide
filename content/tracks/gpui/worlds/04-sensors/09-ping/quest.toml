title = "Ping"
summary = "Time a connection to a server; no answer within the timeout is None."
kind = "exercise"
xp = 45
minutes = 7
tags = ["net", "duration"]

[[objectives]]
test = "local_server_answers"
label = "a server on this PC answers, in under a second"
[[objectives]]
test = "unreachable_host_is_none"
label = "an address nobody answers gives None after the timeout"

[[hints]]
text = "Three lines: note the time, connect with a timeout and `.ok()?`, give back the elapsed time."
[[hints]]
text = "`let start = Instant::now(); TcpStream::connect_timeout(&addr, timeout).ok()?; Some(start.elapsed())`"

[[points]]
after = 3
prompt = "Why does ping_once take a timeout?"
pick = ["a server that never answers would block forever", "TCP needs one", "to make it faster", "for administrator rights"]
answer = 0
