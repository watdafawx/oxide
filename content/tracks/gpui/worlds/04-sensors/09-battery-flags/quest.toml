title = "Battery flags"
summary = "One byte, eight yes/no answers: read the bit worth 128 for no battery and the bit worth 8 for charging."
kind = "exercise"
xp = 30
minutes = 4
tags = ["bits", "windows"]

[[objectives]]
test = "no_battery_flag_means_none"
label = "the 128 flag or a percent of 255 decode to None; 15% charging decodes right"

[[hints]]
text = "First an `if` with `||` that returns `None`; then `Some(Battery { .. })` with `flag & 8 != 0` for `charging`."
[[hints]]
text = "`if status.BatteryFlag & 128 != 0 || status.BatteryLifePercent == 255 { return None; } Some(Battery { percent: status.BatteryLifePercent as f64, charging: status.BatteryFlag & 8 != 0 })`"

[[points]]
after = 1
prompt = "A flag of 136 is which switches?"
pick = ["128 and 8", "136 alone", "100 and 36", "64, 64 and 8"]
answer = 0
[[points]]
after = 3
prompt = "Which test says \"the bit worth 8 is on in the flag\"?"
pick = ["flag == 8", "flag > 8", "flag & 8 != 0", "flag | 8 != 0"]
answer = 2
