title = "Boss: the desktop widget"
summary = "Draw the whole widget from the bar's readings, and apply its placement and lock to its window."
kind = "boss"
xp = 450
minutes = 60
tags = ["boss", "gpui", "win32"]

[[objectives]]
test = "opens_from_menu"
label = "ToggleWidget from the bar opens and closes the widget"
[[objectives]]
test = "groups_drawn"
label = "the header, then headings with their stats"
[[objectives]]
test = "bars_match_values"
label = "usage bars are as full as their values; core bars drawn"
[[objectives]]
test = "style_switches"
label = "Graphs and Bars styles draw only their part"
[[objectives]]
test = "snaps_and_saves"
label = "a snapped position is where the widget reopens"
[[objectives]]
test = "placement_applied"
label = "apply_widget_window sets the layer from Placement"
[[objectives]]
test = "lock_is_click_through"
label = "and click-through from the lock"

[[hints]]
text = "In `render`: `let bar = self.bar.read(cx);`, `let (show_bars, show_graphs) = parts(cx.global::<Settings>().widget.style);`, and the bar's stats from `bar.order`."
[[hints]]
text = "Write a `row` closure for one stat: a `row-<Kind>` column with label and text, `.when_some(..)` for `usage_bar` when there is a share and `show_bars`, `.when(..)` for `widget_graph` when `show_graphs` and there is history."
[[hints]]
text = "Walk `GROUPS`; for each, the stats with that `group_of`; skip empty groups; give each a `heading-<Group>` and its rows. The outer `div` gets `widget_header(cx)`, the groups, and `core_bars(&self.cores)` when there are cores."
[[hints]]
text = "`apply_widget_window`: `apply_placement(api, hwnd, settings.placement); api.set_click_through(hwnd, settings.locked);`"
