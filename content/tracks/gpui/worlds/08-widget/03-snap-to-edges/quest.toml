title = "Snap to edges"
summary = "Let go near an edge of the screen and the widget jumps flush against it."
kind = "exercise"
xp = 40
minutes = 6
tags = ["maths", "geometry"]

[[objectives]]
test = "near_left_edge_snaps_to_zero"
label = "10 px from the left edge snaps to 0; 5 px from the bottom snaps to the bottom"
[[objectives]]
test = "middle_does_not_snap"
label = "a widget in the middle of the screen stays where it is, same size"

[[hints]]
text = "Snapping to the right edge puts the widget's left at `work.right - w`, where `w` is its width. For the bottom it is `work.bottom - h`."
[[hints]]
text = "`let mut r = window; let (w, h) = (window.width(), window.height()); if (window.left - work.left).abs() <= margin { r.left = work.left; } else if (work.right - window.right).abs() <= margin { r.left = work.right - w; }`, the same for top and bottom, then `r.right = r.left + w; r.bottom = r.top + h; r`"

[[points]]
after = 3
prompt = "Why check the right edge only when the left one did not snap?"
pick = ["the right edge is slower to check", "Windows forbids it", "a widget can only sit flush against one side per direction", "to save memory"]
answer = 2
[[points]]
after = 5
prompt = "The widget's right edge is 8 px from the screen's right edge, margin 12. Where does its left edge go?"
pick = ["work.left", "work.right minus its width", "it stays", "work.right"]
answer = 1
