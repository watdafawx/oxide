title = "Remember the position"
summary = "The widget opens where you left it, unless that is off screen now."
kind = "exercise"
xp = 25
minutes = 4
tags = ["option", "geometry"]

[[objectives]]
test = "position_restored_after_restart"
label = "a saved position on screen is used; none, or one off screen, falls back to the top-right corner"

[[hints]]
text = "`if let Some((x, y)) = saved { let place = Rect::new(x, y, x + width, y + height); .. }`, then ask `place.intersect(&work)` with `is_some_and` whether the overlap is at least 40 wide and 40 high."
[[hints]]
text = "`if place.intersect(&work).is_some_and(|seen| seen.width() >= 40 && seen.height() >= 40) { return place; }` and after the `if let`: `let right = work.right - 24; Rect::new(right - width, work.top + 24, right, work.top + 24 + height)`"

[[points]]
after = 2
prompt = "Why check that the saved position is still on screen?"
pick = ["positions expire after a day", "Windows moves windows at night", "to save memory", "the monitor it was on may be unplugged"]
answer = 3
[[points]]
after = 4
prompt = "What does None.is_some_and(|gap| gap > 2) give?"
pick = ["false", "true", "None", "it panics"]
answer = 0
