title = "Drag to move"
summary = "Press on the widget's header and drag: Windows moves the window for you."
kind = "exercise"
xp = 30
minutes = 5
tags = ["gpui", "window", "mouse"]

[[objectives]]
test = "header_press_starts_move"
label = "a left press on the header starts a window drag; a locked widget does not move"

[[hints]]
text = "Chain `.on_mouse_down(MouseButton::Left, cx.listener(|this, _, window, cx| { .. }))` onto the header. Inside, check `cx.global::<Settings>().widget.locked` first."
[[hints]]
text = "`.on_mouse_down(MouseButton::Left, cx.listener(|this, _, window, cx| { if cx.global::<Settings>().widget.locked { return; } this.moves_started += 1; (this.start_move)(window); }))`"

[[points]]
after = 2
prompt = "Why start the drag from on_mouse_down and not on every mouse move?"
pick = ["mouse moves have no window", "a move handler would start a new drag on every twitch", "on_mouse_down is faster", "Windows ignores moves"]
answer = 1
[[points]]
after = 6
prompt = "start_move is a field holding a function. How do you call it with window?"
pick = ["this.start_move(window)", "this.start_move.call(window)", "start_move!(window)", "(this.start_move)(window)"]
answer = 3
