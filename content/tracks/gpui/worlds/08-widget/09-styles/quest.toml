title = "Styles"
summary = "Bars, Graphs, Bars and graphs, or Minimal: one setting picks what each stat draws."
kind = "exercise"
xp = 30
minutes = 5
tags = ["match", "tuple"]

[[objectives]]
test = "minimal_draws_no_graphs"
label = "Minimal draws neither bars nor graphs; Bars and graphs draws both"

[[hints]]
text = "`parts` is a `match` on `style` giving a pair: (bars, graphs)."
[[hints]]
text = "`WidgetStyle::Bars => (true, false), WidgetStyle::Graphs => (false, true), WidgetStyle::Both => (true, true), WidgetStyle::Minimal => (false, false),`"

[[points]]
after = 2
prompt = "What does Graphs give?"
pick = ["(false, true)", "(true, false)", "(true, true)", "(false, false)"]
answer = 0
