title = "Styles"
summary = "Bars, Graphs, Bars and graphs, or Minimal: one setting picks what each stat draws."
kind = "exercise"
xp = 25
minutes = 3
tags = ["match", "tuple"]

[[objectives]]
test = "minimal_draws_no_graphs"
label = "Minimal draws neither bars nor graphs; Bars and graphs draws both"

[[hints]]
text = "Four arms: `WidgetStyle::Bars`, `WidgetStyle::Graphs`, `WidgetStyle::Both` and `WidgetStyle::Minimal`, each giving a pair `(bars, graphs)`."
[[hints]]
text = "`match style { WidgetStyle::Bars => (true, false), WidgetStyle::Graphs => (false, true), WidgetStyle::Both => (true, true), WidgetStyle::Minimal => (false, false) }`"

[[points]]
after = 1
prompt = "What does let (a, b) = (true, false); put in b?"
pick = ["true", "(true, false)", "false", "nothing"]
answer = 2
[[points]]
after = 3
prompt = "What does Graphs give?"
pick = ["(true, false)", "(false, true)", "(true, true)", "(false, false)"]
answer = 1
