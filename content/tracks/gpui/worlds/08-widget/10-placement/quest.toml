title = "Placement"
summary = "On the desktop behind your windows, a normal window, or always on top."
kind = "exercise"
xp = 35
minutes = 5
tags = ["win32", "match"]

[[objectives]]
test = "desktop_placement_sends_to_bottom"
label = "Desktop puts the widget at the bottom, On top at the top, Normal in between"

[[hints]]
text = "`let layer = match placement { Placement::Desktop => .., Placement::Normal => .., Placement::OnTop => .. };` then one call on `api`."
[[hints]]
text = "`let layer = match placement { Placement::Desktop => Layer::Bottom, Placement::Normal => Layer::Normal, Placement::OnTop => Layer::Top }; api.set_layer(hwnd, layer);`"

[[points]]
after = 2
prompt = "Which layer keeps the widget behind the window you are working in?"
pick = ["Top", "Normal", "none", "Bottom"]
answer = 3
[[points]]
after = 3
prompt = "Why does the test use FakeWin?"
pick = ["it records the call, so no real window is needed", "it is faster than Windows", "RealWin cannot set layers", "FakeWin draws the widget"]
answer = 0
