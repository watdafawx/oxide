title = "Groups"
summary = "Stats under headings: Processor, Graphics, Memory, Network, Storage, Battery."
kind = "exercise"
xp = 40
minutes = 5
tags = ["match", "gpui"]

[[objectives]]
test = "cpu_stats_under_processor"
label = "CPU usage and temperature sit under Processor, above Graphics"

[[hints]]
text = "Six arms, one per group. The first is `StatKind::CpuUsage | StatKind::CpuTemp => Group::Processor,`. Network has three kinds."
[[hints]]
text = "`match kind { StatKind::CpuUsage | StatKind::CpuTemp => Group::Processor, StatKind::GpuUsage | StatKind::GpuTemp => Group::Graphics, StatKind::RamUsed => Group::Memory, StatKind::NetDown | StatKind::NetUp | StatKind::Ping => Group::Network, StatKind::DiskFree => Group::Storage, StatKind::Battery => Group::Battery }`"

[[points]]
after = 2
prompt = "Under which heading does ping go?"
pick = ["Processor", "System", "Network", "Storage"]
answer = 2
[[points]]
after = 4
prompt = "Why no `_ =>` arm in group_of?"
pick = ["a new stat makes the compiler ask for its heading", "`_` is slower", "match forbids `_` with `|`", "it would put every stat under Battery"]
answer = 0
