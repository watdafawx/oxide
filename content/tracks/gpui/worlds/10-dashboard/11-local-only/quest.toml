title = "Local only"
summary = "By default only this PC can open the web dashboard; sharing on the network is a choice."
kind = "exercise"
xp = 25
minutes = 4
tags = ["network"]

[[objectives]]
test = "default_binds_localhost"
label = "not shared: 127.0.0.1; shared: 0.0.0.0; the port as set"

[[hints]]
text = "`let ip = if share_on_lan { .. } else { .. };`, then the lesson's `SocketAddr::from(..)` with `ip` and `port`."
[[hints]]
text = "`let ip = if share_on_lan { Ipv4Addr::UNSPECIFIED } else { Ipv4Addr::LOCALHOST }; SocketAddr::from((ip, port))`"

[[points]]
after = 1
prompt = "In 127.0.0.1:8787, what is 8787?"
pick = ["the PC's address", "the port", "the secret key", "a process id"]
answer = 1
[[points]]
after = 2
prompt = "Who can connect to a server listening on 127.0.0.1?"
pick = ["anyone on your Wi-Fi", "anyone on the internet", "nobody at all", "programs on this PC"]
answer = 3
