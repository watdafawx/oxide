title = "The layout editor"
summary = "Cards switched off on the Dashboard page are not drawn."
kind = "exercise"
xp = 30
minutes = 5
tags = ["iterator", "settings"]

[[objectives]]
test = "hidden_disk_card_is_gone"
label = "with Free disk hidden, nine cards and no disk card"

[[hints]]
text = "The lesson's example with a different test in the closure: \"not in `hidden`\" is `!hidden.contains(kind)`."
[[hints]]
text = "`ALL.into_iter().filter(|kind| !hidden.contains(kind)).collect()`"

[[points]]
after = 1
prompt = "Where does the list of hidden cards live?"
pick = ["in each Card", "in the DashboardView", "in the web page", "in Settings"]
answer = 3
[[points]]
after = 3
prompt = "hidden is [Battery]. What does hidden.contains(&StatKind::Battery) give?"
pick = ["false", "Some(0)", "true", "Battery"]
answer = 2
