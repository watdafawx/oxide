text = "`.grid().grid_cols(columns as u16)`"

[[points]]
after = 2
prompt = "What does .grid_cols(4) do to twelve children?"
pick = ["three rows of four", "one row of twelve", "four rows of three", "twelve rows"]
answer = 0
