title = "Fit the window"
summary = "As many columns as fit: the grid follows the window's width."
kind = "exercise"
xp = 40
minutes = 6
tags = ["gpui", "layout"]

[[objectives]]
test = "wide_window_has_four_columns"
label = "1400 px wide fits 4 columns; very narrow 1, very wide at most 6"

[[hints]]
text = "Three steps: the width as an `f32` divided by `CARD_MIN_WIDTH`; brackets around that and `as usize` to drop the fraction; then `.clamp(..)` between 1 and 6."
[[hints]]
text = "`((f32::from(width) / CARD_MIN_WIDTH) as usize).clamp(1, 6)`"

[[points]]
after = 3
prompt = "1400 px over 320 px, as usize, gives how many columns?"
pick = ["5", "4.375", "3", "4"]
answer = 3
[[points]]
after = 4
prompt = "Why clamp to at least 1?"
pick = ["grids count from one", "zero columns draw nothing", "320 rounds down to 1", "the gauge needs it"]
answer = 1
