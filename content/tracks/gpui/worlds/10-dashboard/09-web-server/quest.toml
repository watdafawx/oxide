title = "A web server"
summary = "axum answers /api/stats with the snapshot the app shares through a Mutex."
kind = "exercise"
xp = 45
minutes = 7
tags = ["axum", "tokio", "web"]
requires = ["10-dashboard/08-snapshot-json", "rust/10-apps/06-axum-json-api"]

[[objectives]]
test = "get_stats_returns_json"
label = "GET /api/stats answers 200 with the snapshot as JSON"

[[hints]]
text = "Like the lesson's `stat_count`, with `.unwrap_or_else(|p| p.into_inner())` in place of `.unwrap()` and `.clone()` in place of `.stats.len()`."
[[hints]]
text = "`let snapshot = state.snapshot.lock().unwrap_or_else(|p| p.into_inner()).clone(); Json(snapshot).into_response()`"

[[points]]
after = 1
prompt = "What does status 200 mean?"
pick = ["not found", "OK", "unauthorized", "server error"]
answer = 1
[[points]]
after = 4
prompt = "Why clone the snapshot in the same statement as lock()?"
pick = ["the app clones it too", "State needs a clone", "clones are cheaper locked", "the lock ends right after"]
answer = 3
