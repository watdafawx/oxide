title = "Boss: the dashboard"
summary = "The dashboard window drawn from scratch, and the web server started on its own thread."
kind = "boss"
xp = 450
minutes = 60
tags = ["boss", "gpui", "web"]

[[objectives]]
test = "window_cards_fit"
label = "cards fill as many columns as the width allows"
[[objectives]]
test = "cards_show_now_avg_peak"
label = "each card shows now, avg, peak, and a gauge for percentages"
[[objectives]]
test = "layout_editor_applies"
label = "hidden cards are not drawn"
[[objectives]]
test = "theme_switches"
label = "another theme still draws everything"
[[objectives]]
test = "web_json_matches_window"
label = "the web JSON and the window show the same text"
[[objectives]]
test = "key_required"
label = "the web API needs the key"
[[objectives]]
test = "server_answers_on_localhost"
label = "serve_dashboard answers on 127.0.0.1"

[[hints]]
text = "`render`: read the dashboard settings and the width first; then `columns_for`, the card width, `theme(..)`; then borrow the bar with `self.bar.read(cx)` and build one `Card` per `visible_cards(..)` kind."
[[hints]]
text = "Each `Card`: `kind`, `numbers: card_numbers(bar, kind)`, `share: value.and_then(|v| bar_share(kind, v))`, the history's values, the theme, `text_size: card_text_size(card_width)`. The outer `div` gets the theme background, `.grid().grid_cols(columns as u16)` and the cards."
[[hints]]
text = "`serve_dashboard`: `std::thread::spawn(move || { let runtime = tokio::runtime::Runtime::new()?; runtime.block_on(async move { let listener = tokio::net::TcpListener::bind(addr).await?; axum::serve(listener, router(state)).await }) })`"
