title = "Scale the text"
summary = "Bigger cards, bigger numbers: a tenth of the card's width, kept readable."
kind = "exercise"
xp = 25
minutes = 4
tags = ["clamp"]

[[objectives]]
test = "small_cards_shrink_text"
label = "a 320 px card gets 32 px text, 200 px gets 20, 100 px stays at 14"

[[hints]]
text = "Take the plain number out with `f32::from(..)`, divide by 10, clamp it, and wrap the answer in `px(..)` to make it a length again."
[[hints]]
text = "`px((f32::from(card_width) / 10.0).clamp(14.0, 32.0))`"

[[points]]
after = 1
prompt = "Why subtract 32 px before dividing by the columns?"
pick = ["for the gaps between cards", "p_4 padding, both sides", "cards have a 32 px border", "the title takes 32 px"]
answer = 1
[[points]]
after = 3
prompt = "Why clamp the low end at 14?"
pick = ["GPUI cannot draw any smaller", "14 is the default size", "it saves space", "too small to read from a chair"]
answer = 3
