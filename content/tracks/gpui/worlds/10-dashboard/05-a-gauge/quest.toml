title = "A gauge"
summary = "A half-circle dial: 0 % on the left, 50 % at the top, 100 % on the right."
kind = "exercise"
xp = 45
minutes = 7
tags = ["maths", "trigonometry"]

[[objectives]]
test = "fifty_percent_ends_at_top"
label = "on a radius 50 dial centred at (100, 100): 0 → (50, 100), 0.5 → (100, 50), 1 → (150, 100)"

[[hints]]
text = "The angle runs from π (left) down to 0 (right): `π × (1 − share)`. x adds `radius × cos`, y subtracts `radius × sin`."
[[hints]]
text = "`let angle = std::f32::consts::PI * (1.0 - share.clamp(0.0, 1.0)); point(center.x + radius * angle.cos(), center.y - radius * angle.sin())`"

[[points]]
after = 3
prompt = "Why subtract the sine for y?"
pick = ["screen y grows downward, so up is minus", "sine is negative here", "to flip left and right", "it is a GPUI rule"]
answer = 0
