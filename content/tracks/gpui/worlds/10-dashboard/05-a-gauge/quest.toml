title = "A gauge"
summary = "A half-circle dial: 0 % on the left, 50 % at the top, 100 % on the right."
kind = "exercise"
xp = 45
minutes = 7
tags = ["maths", "trigonometry"]

[[objectives]]
test = "fifty_percent_ends_at_top"
label = "on a radius 50 dial centred at (100, 100): 0 → (50, 100), 0.5 → (100, 50), 1 → (150, 100)"

[[hints]]
text = "First `let angle = ..` from `std::f32::consts::PI`, `1.0 - ..` and `share.clamp(0.0, 1.0)`. Then the same `point(..)` as the lesson's example, with your angle."
[[hints]]
text = "`let angle = std::f32::consts::PI * (1.0 - share.clamp(0.0, 1.0)); point(center.x + radius * angle.cos(), center.y - radius * angle.sin())`"

[[points]]
after = 1
prompt = "How many radians is half a turn?"
pick = ["π/2", "2π", "π", "180"]
answer = 2
[[points]]
after = 4
prompt = "Why subtract the sine part for y?"
pick = ["sine is negative here", "screen y grows downward", "to flip left and right", "GPUI measures from the top right"]
answer = 1
