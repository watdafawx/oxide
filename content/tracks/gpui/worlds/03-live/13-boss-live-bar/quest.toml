title = "Boss: the live bar"
summary = "Tick on a clamped interval, read real CPU and RAM, keep history, redraw only on change, stop when closed."
kind = "boss"
xp = 400
minutes = 50
tags = ["boss", "gpui", "async"]

[[objectives]]
test = "bar_starts_with_dashes"
label = "before the first tick every stat shows --"
[[objectives]]
test = "first_tick_fills_cpu"
label = "after one interval the CPU pill shows the first reading"
[[objectives]]
test = "ticks_follow_interval"
label = "ticks come every interval, clamped to at least 500 ms"
[[objectives]]
test = "history_grows_per_tick"
label = "each tick feeds the stat's history"
[[objectives]]
test = "unchanged_tick_skips_redraw"
label = "a tick that changes nothing does not notify"
[[objectives]]
test = "closing_stops_the_loop"
label = "dropping the bar stops the sensor reads"

[[hints]]
text = "Start with `start`: copy `self.interval`, `cx.spawn` a `loop` that awaits the timer and calls `this.update(cx, |bar, cx| bar.tick(cx))`, breaking on an error, and keep the task in `self._poll`."
[[hints]]
text = "Then `tick`: for each sensor, `Some(v)` inserts into `snapshot` and pushes into `histories` (with `entry(..).or_insert_with(|| History::new(60))`), `None` removes from `snapshot`. Add 1 to `ticks`."
[[hints]]
text = "End `tick` with `let items = bar_items(&default_order(), &self.snapshot, &Limits::default()); if items != self.items { self.items = items; cx.notify(); }`."
[[hints]]
text = "`with_interval` is `self.interval = clamp_interval(ms); self`, with `mut self` in the signature."
