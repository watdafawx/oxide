title = "Every second"
summary = "Loop: wait, read, repeat, and stop when the bar is gone."
kind = "exercise"
xp = 45
minutes = 7
tags = ["gpui", "async", "loop"]

[[objectives]]
test = "bar_reads_every_second"
label = "after 3 seconds the bar has read 3 times and shows the third value"

[[hints]]
text = "Wrap the timer and the update in `loop { ... }`, and turn `.ok();` into an `if` that breaks on an error."
[[hints]]
text = "`loop { cx.background_executor().timer(interval).await; if this.update(cx, |bar, cx| bar.tick(cx)).is_err() { break; } }`"

[[points]]
after = 3
prompt = "When does this.update(..) give back an error?"
pick = ["when the bar is gone", "when a sensor reads None", "every second time", "when the window is hidden"]
answer = 0
