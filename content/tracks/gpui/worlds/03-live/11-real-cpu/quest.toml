title = "Real CPU"
summary = "The first real sensor: this PC's CPU usage, through the sysinfo crate."
kind = "exercise"
xp = 40
minutes = 6
tags = ["sysinfo", "sensor"]

[[objectives]]
test = "cpu_usage_is_a_percentage"
label = "CpuSensor reads a number between 0 and 100 on this PC"

[[hints]]
text = "`read` needs two lines: refresh the CPU numbers, then give back the overall usage."
[[hints]]
text = "`self.system.refresh_cpu_usage(); Some(self.system.global_cpu_usage() as f64)`"

[[points]]
after = 3
prompt = "Why is the very first CPU reading 0?"
pick = ["usage is measured between two refreshes", "the CPU is idle at start", "sysinfo needs admin", "Windows hides it"]
answer = 0
