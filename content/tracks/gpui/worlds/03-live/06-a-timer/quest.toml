title = "A timer"
summary = "Wait one interval without freezing the window: await a GPUI timer."
kind = "exercise"
xp = 40
minutes = 6
tags = ["gpui", "async", "timer"]

[[objectives]]
test = "first_read_waits_one_interval"
label = "nothing is read at 999 ms; the first read happens at 1 s"

[[hints]]
text = "Add one line at the top of the `spawn` block, before `this.update(..)`."
[[hints]]
text = "`cx.background_executor().timer(interval).await;`"

[[points]]
after = 2
prompt = "Why not std::thread::sleep inside the spawn block?"
pick = ["it freezes the whole window", "it is not precise", "it needs admin", "it does not compile"]
answer = 0
[[points]]
after = 3
prompt = "Wait one interval."
code = "cx.background_executor().___(interval).await;"
blank = "timer"
