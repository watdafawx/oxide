title = "Update interval"
summary = "Kinetik updates every 0.5 to 5 seconds: clamp the setting into that range."
kind = "exercise"
xp = 25
minutes = 4
tags = ["clamp", "duration"]

[[objectives]]
test = "interval_clamps_to_half_second"
label = "100 ms becomes 500 ms, 9000 ms becomes 5 s, 1000 ms stays 1 s"

[[hints]]
text = "Clamp `ms` before making the `Duration`."
[[hints]]
text = "`Duration::from_millis(ms.clamp(500, 5000))`"

[[points]]
after = 2
prompt = "Why is the fastest interval half a second, not 1 ms?"
pick = ["reading sensors costs CPU, and nobody reads that fast", "Windows forbids faster timers", "GPUI cannot draw faster", "Duration has no smaller unit"]
answer = 0
