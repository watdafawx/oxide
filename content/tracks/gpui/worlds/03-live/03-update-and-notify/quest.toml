title = "Update and notify"
summary = "Change the bar through the app, then tell GPUI it needs drawing again."
kind = "exercise"
xp = 40
minutes = 6
tags = ["gpui", "notify"]

[[objectives]]
test = "new_reading_redraws_bar"
label = "set_reading changes the CPU text and notifies once"

[[hints]]
text = "One line is missing at the end of `set_reading`."
[[hints]]
text = "`cx.notify();`"

[[points]]
after = 2
prompt = "You change the bar's items but skip cx.notify(). What do you see?"
pick = ["the old numbers", "the new numbers", "a blank bar", "a compile error"]
answer = 0
