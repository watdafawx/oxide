title = "Locked"
summary = "A locked PC counts nothing, even with a game still full screen behind the lock."
kind = "exercise"
xp = 25
minutes = 4
tags = ["win32"]

[[objectives]]
test = "locked_pc_not_counted"
label = "locked: nothing counted, full screen or not"

[[hints]]
text = "Put `desk.locked() ||` in front of the `away(..)` call that is already in the `if`."
[[hints]]
text = "`if desk.locked() || away(desk.idle(), desk.fullscreen()) { return None; }`"

[[points]]
after = 2
prompt = "Why can full screen not mean 'someone is watching' here?"
pick = ["locking ends the game", "the game behind the lock still covers its monitor", "full screen turns off when locked", "it can"]
answer = 1
[[points]]
after = 3
prompt = "In a || b, when is b never looked at?"
pick = ["when a is false", "when b is slow", "never: both always run", "when a is true"]
answer = 3
