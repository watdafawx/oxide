title = "What's in front"
summary = "Ask Windows which program owns the window in front, and keep only its file name."
kind = "exercise"
xp = 25
minutes = 4
tags = ["win32", "strings"]
requires = ["10-dashboard/14-boss-dashboard"]

[[objectives]]
test = "exe_name_from_full_path"
label = "C:\\Games\\Minecraft.Windows.exe gives minecraft.windows.exe; the fake desk's program is counted by name"

[[hints]]
text = "Cut at both slashes from the right with `rsplit(['\\\\', '/'])`, take the first piece with `.next()`, fall back to `path`, then `.to_lowercase()`."
[[hints]]
text = "`path.rsplit(['\\\\', '/']).next().unwrap_or(path).to_lowercase()`"

[[points]]
after = 3
prompt = "Why lower-case the name?"
pick = ["JSON needs lower case", "it sorts faster", "Windows ignores case in file names", "to hide the path"]
answer = 2
[[points]]
after = 4
prompt = "What does \"a/b/c.exe\".rsplit(['/']).next() give?"
pick = ["Some(\"a\")", "Some(\"c.exe\")", "None", "Some(\"b\")"]
answer = 1
