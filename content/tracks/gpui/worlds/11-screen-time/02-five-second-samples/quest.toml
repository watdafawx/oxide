title = "Five-second samples"
summary = "Every 5 seconds, the program in front gets 5 more seconds, in its total and in this hour's."
kind = "exercise"
xp = 30
minutes = 5
tags = ["btreemap", "entry"]

[[objectives]]
test = "three_samples_add_15_seconds"
label = "three samples of Chrome at 21:00 add 15 seconds to chrome.exe and to hour 21"

[[hints]]
text = "Two lines: the lesson's `entry(..).or_insert(0)` line on `self.apps` with `app.to_string()` and `SAMPLE_SECS`, and `self.hours[..] += SAMPLE_SECS` with the hour as a `usize`."
[[hints]]
text = "`*self.apps.entry(app.to_string()).or_insert(0) += SAMPLE_SECS; self.hours[at.hour() as usize] += SAMPLE_SECS;`"

[[points]]
after = 2
prompt = "What does entry(..).or_insert(0) give back?"
pick = ["a copy of the count", "a &mut to the count", "the whole map", "a bool"]
answer = 1
[[points]]
after = 3
prompt = "Add 5 to the count the reference points at."
code = "___count += 5;"
blank = "*"
