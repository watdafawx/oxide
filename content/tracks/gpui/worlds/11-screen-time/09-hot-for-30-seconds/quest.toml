title = "Hot for 30 seconds"
summary = "Alert only when a stat stays over its limit for half a minute, and only once."
kind = "exercise"
xp = 45
minutes = 7
tags = ["gpui", "debounce", "hashmap"]

[[objectives]]
test = "short_spike_no_alert"
label = "a 10-second spike over the limit says nothing; the wait starts again after it"
[[objectives]]
test = "thirty_seconds_alerts_once"
label = "a minute over the limit gives exactly one alert"

[[hints]]
text = "Three parts: `if !is_warning(reading, limits) { .. return None; }` with two `remove(&kind)` calls; `let since = *self.over_since.entry(kind).or_insert(now);`; then `if now.duration_since(since) >= HOT_FOR && self.alerted.insert(kind)` giving back the alert, and `None` at the end."
[[hints]]
text = "`let kind = reading.kind; if !is_warning(reading, limits) { self.over_since.remove(&kind); self.alerted.remove(&kind); return None; } let since = *self.over_since.entry(kind).or_insert(now); if now.duration_since(since) >= HOT_FOR && self.alerted.insert(kind) { return reading.value.map(|value| Alert { kind, value }); } None`"

[[points]]
after = 2
prompt = "GPU goes over at 10:00:00 and is still over at 10:00:05. What does over_since hold for it?"
pick = ["10:00:05", "10:00:00", "both times", "nothing yet"]
answer = 1
[[points]]
after = 4
prompt = "What does HashSet::insert give back?"
pick = ["the value it replaced", "how many values it holds", "true if the value was new", "nothing at all"]
answer = 2
