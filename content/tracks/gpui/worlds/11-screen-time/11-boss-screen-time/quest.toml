title = "Boss: screen time"
summary = "The sampler and the screen time page, written from scratch, with alerts running beside them."
kind = "boss"
xp = 450
minutes = 60
tags = ["boss", "gpui", "files"]

[[objectives]]
test = "counts_foreground_app"
label = "the 5-second loop counts the program in front"
[[objectives]]
test = "idle_and_lock_pause"
label = "idle and locked time is not counted; idle in full screen is"
[[objectives]]
test = "files_per_day_pruned"
label = "each day gets its file, and a new day prunes old ones"
[[objectives]]
test = "summary_right"
label = "the page shows total, first and last use, most used and busiest hour"
[[objectives]]
test = "chart_drawn"
label = "24 bars stand on the chart's bottom edge, the busiest full height"
[[objectives]]
test = "alerts_debounced"
label = "alerts wait 30 seconds and say it once"

[[hints]]
text = "`sample`: take `desk.now()`. If its date is not `self.day.date`, start a new `Day` and `prune`. Then, if `app_to_count` gives a program, `add` it and `save_day`."
[[hints]]
text = "`render`: clone the day out of `self.screen.read(cx)`, then `summarize` and `bar_heights(&day.hours, CHART_HEIGHT)`. A column: a title, five `summary_line`s named total, first, last, most-used, busiest, then the chart."
[[hints]]
text = "The chart: `div().debug_selector(|| \"chart\".into()).flex_none().w_full().h(px(CHART_HEIGHT)).flex().items_end().gap_1()` with one `div().debug_selector(move || format!(\"hour-{hour}\")).flex_1().h(px(height))` per hour."
