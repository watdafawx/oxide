title = "A file per day"
summary = "Each day's totals as a small JSON file named by its date, on this PC only."
kind = "exercise"
xp = 40
minutes = 6
tags = ["files", "serde", "privacy"]

[[objectives]]
test = "day_file_named_by_date"
label = "22 October 2026 is saved as 2026-10-22.json and reads back the same"
[[objectives]]
test = "no_window_titles_saved"
label = "the file holds program names only: no paths, no window titles"

[[hints]]
text = "`day_path` is the lesson's example with `\"%Y-%m-%d\"` and `.json`. `save_day` is three lines, each of the first two ending in `?`: `create_dir_all`, `to_string_pretty`, then `std::fs::write(day_path(..), ..)` as the last line."
[[hints]]
text = "`dir.join(format!(\"{}.json\", date.format(\"%Y-%m-%d\")))`, and `std::fs::create_dir_all(dir)?; let text = serde_json::to_string_pretty(day)?; std::fs::write(day_path(dir, day.date), text)`"

[[points]]
after = 1
prompt = "Why name the files year-month-day?"
pick = ["Windows needs it", "it is shorter", "they sort by date as text", "JSON needs it"]
answer = 2
[[points]]
after = 4
prompt = "Why can save_day use plain ? on to_string_pretty?"
pick = ["its error converts into io::Error", "it never fails", "? ignores errors", "save_day returns a String"]
answer = 0
