title = "A day's summary"
summary = "Total time, first and last use, the most used program and the busiest hour."
kind = "exercise"
xp = 45
minutes = 7
tags = ["iterators", "max_by_key"]

[[objectives]]
test = "busiest_hour_is_21"
label = "Chrome 08:00 to 08:30 and Minecraft 20:30 to 22:15: busiest hour 21, total 2 h 15 min"
[[objectives]]
test = "most_used_is_minecraft"
label = "the most used program is minecraft.windows.exe; an empty day has none"

[[hints]]
text = "`most_used`: `day.apps.iter().max_by_key(..)` with `**secs` as the key, then `.map(..)` to clone the name. `busiest_hour`: `(0..24).filter(|&hour| ..)` with `day.hours[hour] > 0`, then `.max_by_key(..)`."
[[hints]]
text = "`most_used: day.apps.iter().max_by_key(|(_, secs)| **secs).map(|(name, _)| name.clone()), busiest_hour: (0..24).filter(|&hour| day.hours[hour] > 0).max_by_key(|&hour| day.hours[hour]),`"

[[points]]
after = 3
prompt = "Over day.apps.iter(), how many references deep is secs in |(_, secs)|?"
pick = ["none", "one", "two", "three"]
answer = 2
[[points]]
after = 6
prompt = "Why filter out empty hours first?"
pick = ["an empty day has no busiest hour", "max_by_key panics on zeros", "zeros would sort to the end", "so the chart lines up"]
answer = 0
