[package]
name = "kinetik_11_idle"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui = { version = "=0.2.2", features = ["test-support"] }
sysinfo = { version = "=0.39.6", default-features = false, features = ["system", "disk", "network"] }
nvml-wrapper = "=0.13.0"
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Power", "Win32_System_StationsAndDesktops", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
wmi = { version = "=0.18.4", default-features = false }
serde = { version = "1", features = ["derive"] }
raw-window-handle = "0.6"
tray-icon = "=0.26.1"
serde_json = "1"
global-hotkey = "=0.9.0"
ferrisetw = "=1.2.0"
axum = "=0.8.9"
tokio = { version = "1", features = ["rt-multi-thread", "net"] }
tower = { version = "0.5", features = ["util"] }
getrandom = "0.3"
chrono = { version = "0.4", features = ["serde"] }
tauri-winrt-notification = "=0.8.1"

[workspace]
