title = "Nobody there"
summary = "Five minutes without a key press means nobody is using the PC, unless a video or game fills the screen."
kind = "exercise"
xp = 30
minutes = 5
tags = ["win32", "duration"]

[[objectives]]
test = "idle_six_minutes_not_counted"
label = "6 minutes idle with a normal window: nothing counted; 4 minutes: still counted"
[[objectives]]
test = "fullscreen_video_still_counts"
label = "6 minutes idle with a full-screen window: still counted"

[[hints]]
text = "One line, two conditions joined with `&&`: `idle` compared with `IDLE_LIMIT`, and `fullscreen` with a `!` in front."
[[hints]]
text = "`idle >= IDLE_LIMIT && !fullscreen`"

[[points]]
after = 2
prompt = "Why does a full-screen window keep counting while idle?"
pick = ["games move the mouse", "Windows resets the idle time", "full-screen windows are never idle", "you may be watching a film"]
answer = 3
[[points]]
after = 4
prompt = "idle is 6 minutes and fullscreen is true. What does away give?"
pick = ["false", "true", "it panics", "None"]
answer = 0
