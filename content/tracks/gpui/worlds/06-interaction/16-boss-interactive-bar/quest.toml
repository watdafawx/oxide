title = "Boss: the interactive bar"
summary = "Click, hover card with graph and processes, actions, the right-click menu and the tray icon, all together."
kind = "boss"
xp = 400
minutes = 55
tags = ["boss", "gpui", "events"]

[[objectives]]
test = "left_click_runs_action"
label = "a left click runs the Left-click action: Task Manager, or Settings"
[[objectives]]
test = "hover_card_appears"
label = "resting on a pill sets ui.hovered and shows the card with its graph"
[[objectives]]
test = "card_shows_summary"
label = "the card's title, summary and points come from the bar"
[[objectives]]
test = "card_lists_top_processes"
label = "the card lists the top processes when it opens"
[[objectives]]
test = "menu_opens_on_right_click"
label = "a right click opens the menu with its rows"
[[objectives]]
test = "menu_exit_quits"
label = "Exit in the menu reaches the Exit handler"
[[objectives]]
test = "tray_open_settings"
label = "tray events map to OpenSettings and Exit"

[[hints]]
text = "Start with `interactive_pill`: `.id(..)`, then `.on_click(cx.listener(move |this, _, _, cx| this.on_pill_click(kind, cx)))`. That alone turns the first objective green once `bar_layer` gives back `bar`."
[[hints]]
text = "Before the chain: `let card = card_for(bar, kind); let top_processes = bar.ui.top_processes;`. The tooltip, as in quest 09: `.tooltip(move |_, cx| { let mut card = card.clone(); card.top = (top_processes)(); cx.new(|_| card).into() })`."
[[hints]]
text = "Hover: `.hover(|style| style.bg(rgba(0xffffff14)))` and the `.on_hover` from quest 04. Right click: `.on_mouse_down(MouseButton::Right, ..)` storing `event.position` in `this.ui.menu_at`, from quest 13."
[[hints]]
text = "`bar_layer`: the focus `match` from quest 10, the three `.on_action`s from quest 11, and `.when_some(this.ui.menu_at, |el, at| el.child(deferred(anchored().position(at).child(menu(cx)))))` from quest 12."
