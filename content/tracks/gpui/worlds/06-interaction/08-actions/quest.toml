title = "Actions"
summary = "Named commands: OpenSettings, OpenTaskManager, Exit. The bar handles them, wherever they come from."
kind = "exercise"
xp = 45
minutes = 7
tags = ["gpui", "actions", "focus"]

[[objectives]]
test = "open_settings_action_is_handled"
label = "dispatching OpenSettings reaches the bar; OpenTaskManager launches taskmgr"

[[hints]]
text = "In `bar_layer`, three `.on_action(cx.listener(..))` calls, one per action, after the focus line."
[[hints]]
text = "`.on_action(cx.listener(|this, _: &OpenSettings, _, cx| this.open_settings(cx)))`, then the same shape for `OpenTaskManager` (`this.ui.launcher.launch(\"taskmgr\")`) and `Exit` (push \"exit\", then `cx.quit()`)."

[[points]]
after = 3
prompt = "Why must the bar have focus for its on_action handlers to run?"
pick = ["actions travel from the focused element up to the window", "focus makes the bar visible", "actions need a keyboard", "on_action only runs on buttons"]
answer = 0
