title = "The tray icon"
summary = "Kinetik's tray icon: a click opens Settings, its menu has Settings and Exit. Turn tray events into actions."
kind = "exercise"
xp = 60
minutes = 8
tags = ["tray-icon", "match"]

[[objectives]]
test = "tray_click_maps_to_open_settings"
label = "a left-button release on the icon means OpenSettings; a press or a right click means nothing"
[[objectives]]
test = "tray_menu_maps_by_id"
label = "menu ids settings and exit map to their actions; others to nothing"

[[hints]]
text = "`tray_click_action` matches one pattern with named fields and `..`; `tray_menu_action` matches on the id string."
[[hints]]
text = "`TrayIconEvent::Click { button: tray_icon::MouseButton::Left, button_state: MouseButtonState::Up, .. } => Some(TrayAction::OpenSettings), _ => None` and `\"settings\" => Some(TrayAction::OpenSettings), \"exit\" => Some(TrayAction::Exit), _ => None`"

[[points]]
after = 3
prompt = "Why react to the button's release (Up), not the press?"
pick = ["a click is a press and a release; acting on release is what users expect", "Windows sends only releases", "Up is faster", "the press opens the menu"]
answer = 0
