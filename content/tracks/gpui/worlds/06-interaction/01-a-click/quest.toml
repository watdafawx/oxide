title = "A click"
summary = "Give each pill an id and an on_click: the bar learns which stat you clicked."
kind = "exercise"
xp = 25
minutes = 4
tags = ["gpui", "events"]
requires = ["05-taskbar/11-boss-docked-bar"]

[[objectives]]
test = "clicking_cpu_pill_is_seen"
label = "clicking the CPU pill sets ui.clicked to CpuUsage"

[[hints]]
text = "Two calls on the pill in `interactive_pill`: `.id(..)` first, then `.on_click(..)`."
[[hints]]
text = "`.id(SharedString::from(format!(\"pill-{kind:?}\")))` and `.on_click(cx.listener(move |this, _, _, cx| { this.ui.clicked = Some(kind); cx.notify(); }))`"

[[points]]
after = 2
prompt = "Why does a pill need .id(..) before .on_click?"
pick = ["clicks need state kept between frames, and the id names it", "ids make pills faster", "on_click only works on text", "Windows needs an id"]
answer = 0
