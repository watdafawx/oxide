title = "Draw the graph"
summary = "A canvas paints a line through the graph points, straight onto the window."
kind = "exercise"
xp = 60
minutes = 8
tags = ["gpui", "canvas", "paint"]

[[objectives]]
test = "card_has_graph"
label = "the hover card draws a graph between its title and its summary"

[[hints]]
text = "`graph` is written below; the card's `render` only needs to add it as a child."
[[hints]]
text = "Between the title child and the summary child: `.child(graph(self.points.clone()))`"

[[points]]
after = 2
prompt = "Which closure of canvas(..) does the drawing?"
pick = ["the second, which gets the bounds and the window", "the first", "neither: render draws", "the tooltip closure"]
answer = 0
