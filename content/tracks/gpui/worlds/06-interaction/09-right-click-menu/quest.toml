title = "The right-click menu"
summary = "Right-click opens a menu where you clicked, drawn on top of everything; a click elsewhere closes it."
kind = "exercise"
xp = 60
minutes = 8
tags = ["gpui", "menu", "deferred"]

[[objectives]]
test = "right_click_opens_menu"
label = "a right click on a pill opens the menu at the mouse"
[[objectives]]
test = "click_elsewhere_closes_it"
label = "a click outside the menu closes it"

[[hints]]
text = "Two places: `.on_mouse_down(MouseButton::Right, ..)` on the pill stores the position; `bar_layer` draws the menu while there is one."
[[hints]]
text = "Pill: `.on_mouse_down(MouseButton::Right, cx.listener(|this, event: &MouseDownEvent, _, cx| { this.ui.menu_at = Some(event.position); cx.notify(); }))`. Bar: `.when_some(this.ui.menu_at, |el, at| el.child(deferred(anchored().position(at).child(menu(cx)))))`."

[[points]]
after = 3
prompt = "What does deferred(..) do to the menu?"
pick = ["draws it after everything else, so it is on top", "waits half a second", "loads it later", "hides it until hovered"]
answer = 0
