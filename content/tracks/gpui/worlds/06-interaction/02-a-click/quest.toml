title = "A click"
summary = "Give each pill an id and an on_click: the bar learns which stat you clicked."
kind = "exercise"
xp = 25
minutes = 4
tags = ["gpui", "events"]

[[objectives]]
test = "clicking_cpu_pill_is_seen"
label = "clicking the CPU pill sets ui.clicked to CpuUsage"

[[hints]]
text = "Two calls on the pill in `interactive_pill`: `.id(..)` in place of `.id(\"pill\")`, then `.on_click(cx.listener(move |this, _, _, cx| { .. }))`."
[[hints]]
text = "`.id(SharedString::from(format!(\"pill-{kind:?}\")))` and `.on_click(cx.listener(move |this, _, _, cx| { this.ui.clicked = Some(kind); cx.notify(); }))`"

[[points]]
after = 2
prompt = "Why does a pill need its own .id(..) before .on_click?"
pick = ["ids make pills draw faster", "on_click only works on text", "a click spans two frames, and the id lets GPUI find the same pill again", "Windows needs an id for every element"]
answer = 2
