title = "The left-click action"
summary = "Kinetik's setting: a left click opens Task Manager, Settings, or nothing."
kind = "exercise"
xp = 30
minutes = 5
tags = ["match", "trait"]

[[objectives]]
test = "left_click_opens_task_manager"
label = "with TaskManager, a click launches taskmgr; with Nothing, it launches nothing"

[[hints]]
text = "In `on_pill_click`, after remembering the click, `match self.ui.left_click` with one arm per variant. `Nothing` does nothing: `{}`."
[[hints]]
text = "`match self.ui.left_click { LeftClick::TaskManager => self.ui.launcher.launch(\"taskmgr\"), LeftClick::Settings => self.open_settings(cx), LeftClick::Nothing => {} }`"

[[points]]
after = 3
prompt = "How does the test know Task Manager would have opened?"
pick = ["it looks for taskmgr.exe running", "a FakeLauncher writes down the program name", "it reads the screen", "it asks Windows"]
answer = 1
