title = "The overlay window"
summary = "A slim strip centred at the top of the screen, see-through, never taking focus from the game."
kind = "exercise"
xp = 40
minutes = 6
tags = ["gpui", "window", "geometry"]

[[objectives]]
test = "overlay_sits_top_centre"
label = "a 420 px strip on a 2560 px screen sits at x 1070, 8 px from the top"

[[hints]]
text = "The lesson's sum with widths for heights gives `x`. Then `Bounds::new(point(x, y), size(width, height))`, where `y` is the screen's top plus `px(8.)`."
[[hints]]
text = "`let x = screen.origin.x + (screen.size.width - width) / 2.0; Bounds::new(point(x, screen.origin.y + px(8.)), size(width, height))`"

[[points]]
after = 1
prompt = "Why does the overlay window never take focus?"
pick = ["the overlay has no keys", "it is faster", "pop-ups cannot focus", "taking focus would pull the keyboard away from the game"]
answer = 3
[[points]]
after = 3
prompt = "lock() on a poisoned Mutex gives an error. Why does the overlay take the frames anyway?"
pick = ["a half-changed list of frame times is harmless", "poisoned locks are always empty", "into_inner fixes the panic", "the overlay cannot read errors"]
answer = 0
