title = "Boss: the game overlay"
summary = "Frame stats from a window of frames, and the controller that shows, hides, closes, summarises and benchmarks."
kind = "boss"
xp = 500
minutes = 75
tags = ["boss", "fps", "state-machine"]

[[objectives]]
test = "fps_from_capture"
label = "FrameStats: FPS and base FPS from the capture"
[[objectives]]
test = "lows_from_capture"
label = "FrameStats: 1% and 0.1% lows"
[[objectives]]
test = "graph_marks_spikes"
label = "FrameStats: the last 3 seconds and their spikes"
[[objectives]]
test = "hotkey_toggles"
label = "ToggleOverlay from the bar opens the overlay"
[[objectives]]
test = "shows_for_game"
label = "the controller shows for a game and hides on Alt+Tab"
[[objectives]]
test = "closes_with_game"
label = "and closes when the game exits"
[[objectives]]
test = "summary_saved"
label = "the session summary has the minutes, FPS, low and peak GPU temperature"
[[objectives]]
test = "benchmark_rows"
label = "benchmark rows come from the controller's recording"
[[objectives]]
test = "live_or_needs_admin"
label = "the live trace starts or says it needs administrator"

[[hints]]
text = "Start with `FrameStats::compute`: `let ms: Vec<f64> = frames.iter().map(|f| f.ms).collect();`, the newest time, and `let recent_ms: Vec<f64> = frames.iter().filter(|f| f.time >= newest - 3.0).map(|f| f.ms).collect();`. Then fill the struct from `average_fps`, `base_fps`, `low_fps` twice (0.01 and 0.001) and `spikes(&recent_ms)`. Four objectives turn green."
[[hints]]
text = "`OverlayController::tick`: `if self.auto.game.is_some() { self.peak_gpu_temp = match (self.peak_gpu_temp, gpu_temp) { (Some(a), Some(b)) => Some(a.max(b)), (Some(a), None) => Some(a), (None, b) => b }; }` then `let step = self.auto.step(front, running);`."
[[hints]]
text = "`match step { Some(OverlayStep::Show) if self.started.is_none() => self.started = Some(now), Some(OverlayStep::Close) => { .. } _ => {} }` and give back `step`. On Close: `let started = self.started.take().unwrap_or(now);`, build a `SessionSummary` with `game: game_exe.to_string()`, `seconds: (now - started).max(0.0) as u64`, `stats.fps`, `stats.one_percent_low` and `self.peak_gpu_temp.take()`, and push its `csv_line()` to `self.sessions`."
