title = "Session summary"
summary = "When a game closes: how long, average FPS, 1% low, peak GPU temperature, as one CSV line."
kind = "exercise"
xp = 30
minutes = 5
tags = ["format", "csv"]

[[objectives]]
test = "summary_line_matches_header"
label = "the line has the header's five fields: game, minutes, FPS and low with one decimal, temperature"

[[hints]]
text = "`let temp = self.peak_gpu_temp.map(|t| format!(\"{t:.0}\")).unwrap_or_default();`, then one `format!` with five `{}` separated by commas, three of them `{:.1}`."
[[hints]]
text = "`format!(\"{},{:.1},{:.1},{:.1},{}\", self.game, self.seconds as f64 / 60.0, self.average_fps, self.one_percent_low, temp)`"

[[points]]
after = 3
prompt = "How is a missing GPU temperature written?"
pick = ["0", "--", "an empty cell", "the word none"]
answer = 2
[[points]]
after = 4
prompt = "What does None.map(|t| t + 1.0) give?"
pick = ["None", "Some(1.0)", "0.0", "it panics"]
answer = 0
