title = "Live frames"
summary = "Listen to DXGI's present events with ferrisetw; without administrator, say so instead of failing."
kind = "exercise"
xp = 60
minutes = 8
tags = ["etw", "errors"]

[[objectives]]
test = "access_denied_means_needs_admin"
label = "Windows error 5 from event tracing means NeedsAdmin; others keep their text"
[[objectives]]
test = "etw_starts_or_says_needs_admin"
label = "on your PC, the present trace either starts or says it needs administrator"

[[hints]]
text = "Two arms. The first nests the three layers, `TraceError::EtwNativeError(EvntraceNativeError::IoError(e))`, with a guard on `e.raw_os_error()`. The second catches everything else in a name."
[[hints]]
text = "`match error { TraceError::EtwNativeError(EvntraceNativeError::IoError(e)) if e.raw_os_error() == Some(5) => LiveError::NeedsAdmin, other => LiveError::Failed(format!(\"{other:?}\")) }`"

[[points]]
after = 2
prompt = "Why must on_present be Send + Sync + 'static?"
pick = ["it is called from ETW's own thread", "GPUI needs it sorted", "it returns a value", "it runs only once"]
answer = 0
[[points]]
after = 4
prompt = "What does `if` after a match pattern do?"
pick = ["it runs the arm twice", "it is an error", "the arm only matches when the condition also holds", "it negates the pattern"]
answer = 2
