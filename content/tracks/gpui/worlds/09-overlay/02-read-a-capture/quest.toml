title = "Read a capture"
summary = "A PresentMon-style CSV: find the columns by name, turn each line into a Frame."
kind = "exercise"
xp = 40
minutes = 6
tags = ["parsing", "iterator"]

[[objectives]]
test = "capture_has_1200_frames"
label = "the capture in fixtures/ reads as 1200 frames, the second one generated"

[[hints]]
text = "Follow the ping log example: split the line into `cells`, then build a `Frame` with three fields. `time` and `ms` are parsed, `generated` compares the `kind` cell with `\"Generated\"`."
[[hints]]
text = "`lines.filter_map(|line| { let cells: Vec<&str> = line.split(',').collect(); Some(Frame { time: cells.get(time)?.parse().ok()?, ms: cells.get(ms)?.parse().ok()?, generated: *cells.get(kind)? == \"Generated\" }) }).collect()`"

[[points]]
after = 2
prompt = "Why find the columns by name instead of by position?"
pick = ["names are faster", "positions start at 1", "other captures may order or add columns differently", "CSV has no positions"]
answer = 2
[[points]]
after = 3
prompt = "Inside filter_map's closure, what does ? do with a None?"
pick = ["panics", "gives back None for this line, so it is skipped", "turns it into 0", "ends the whole capture"]
answer = 1
