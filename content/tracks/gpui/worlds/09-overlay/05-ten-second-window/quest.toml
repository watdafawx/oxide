title = "The last ten seconds"
summary = "Lows over the whole session drift; Kinetik looks at the last ten seconds."
kind = "exercise"
xp = 35
minutes = 5
tags = ["vecdeque"]

[[objectives]]
test = "old_frames_are_dropped"
label = "after the whole capture, the window holds the 1181 frames of the last 10 s"

[[hints]]
text = "`self.frames.push_back(frame);`, then a `while` whose condition is `self.frames.front().is_some_and(|old| old.time < frame.time - WINDOW_SECONDS)`."
[[hints]]
text = "`self.frames.push_back(frame); while self.frames.front().is_some_and(|old| old.time < frame.time - WINDOW_SECONDS) { self.frames.pop_front(); }`"

[[points]]
after = 1
prompt = "Why keep 10 seconds of frames rather than a fixed number of them?"
pick = ["games draw frames at different speeds", "a number would not fit in memory", "VecDeque cannot count", "seconds sort faster"]
answer = 0
[[points]]
after = 4
prompt = "Why a while loop and not one pop_front?"
pick = ["pop_front only works in loops", "to sort them", "one long hitch can make several old frames expire at once", "VecDeque needs it"]
answer = 2
