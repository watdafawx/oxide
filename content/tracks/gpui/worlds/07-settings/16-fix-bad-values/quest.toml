title = "Fix bad values"
summary = "Load defensively: clamp what is out of range, back up what cannot be read, always start."
kind = "exercise"
xp = 30
minutes = 5
tags = ["serde", "files", "robustness"]

[[objectives]]
test = "interval_99_is_clamped"
label = "a file with an interval of 99 ms loads as 500 ms"
[[objectives]]
test = "unreadable_file_is_backed_up"
label = "a file that is not JSON is kept as .bak, and the defaults load"

[[hints]]
text = "Replace the `unwrap` line with a `match` on `serde_json::from_str::<Settings>(&text)`: `Ok(settings)` goes through `clamp_settings`, `Err(_)` renames the file to `.bak` and gives the defaults."
[[hints]]
text = "`match serde_json::from_str::<Settings>(&text) { Ok(settings) => clamp_settings(settings), Err(_) => { let _ = fs::rename(path, path.with_extension(\"bak\")); Settings::default() } }`"

[[points]]
after = 2
prompt = "Why keep the unreadable file as .bak instead of deleting it?"
pick = ["Windows locks it", "someone can still open it and recover their settings", "to load it next time", "it is smaller"]
answer = 1
