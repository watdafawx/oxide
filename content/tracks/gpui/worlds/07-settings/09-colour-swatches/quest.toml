title = "Colour swatches"
summary = "Fifteen swatches under the Arrange list; clicking one colours the selected stat on the bar."
kind = "exercise"
xp = 25
minutes = 4
tags = ["gpui", "colour"]

[[objectives]]
test = "picking_swatch_sets_cpu_colour"
label = "with CPU selected, clicking swatch 1 sets CPU's colour to 0xff5c5c"

[[hints]]
text = "Add `.on_click(cx.listener(..))` to the swatch; it updates the global's `colours`."
[[hints]]
text = "`.on_click(cx.listener(move |_, _, _, cx| { Settings::update_global(cx, |s, _| { s.colours.insert(kind, colour); }); cx.notify(); }))`"

[[points]]
after = 2
prompt = "Which call changes a global and tells its watchers?"
pick = ["Settings::update_global(cx, |s, _| ..)", "cx.global::<Settings>()", "cx.set_global(..) only", "cx.notify()"]
answer = 0
