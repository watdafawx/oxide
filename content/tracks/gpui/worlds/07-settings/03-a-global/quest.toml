title = "A global"
summary = "One Settings for the whole app: set it once, read it from anywhere with cx.global."
kind = "exercise"
xp = 30
minutes = 4
tags = ["gpui", "global"]

[[objectives]]
test = "bar_reads_global_interval"
label = "a bar made from the app's Settings uses its 2-second interval and its gap"

[[hints]]
text = "One line in `from_settings`: `settings` should come from `cx.global::<..>()` instead of `Settings::default()`."
[[hints]]
text = "`let settings = cx.global::<Settings>();`"

[[points]]
after = 4
prompt = "What happens if you call cx.global::<Settings>() before set_global?"
pick = ["it gives the defaults", "it gives None", "it panics: there is no Settings yet", "it opens Settings"]
answer = 2
