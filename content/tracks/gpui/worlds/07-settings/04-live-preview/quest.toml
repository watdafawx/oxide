title = "Live preview"
summary = "The bar watches Settings and redraws the moment anything changes."
kind = "exercise"
xp = 45
minutes = 7
tags = ["gpui", "global", "observe"]

[[objectives]]
test = "changing_font_size_redraws_bar"
label = "changing the font size in Settings changes the bar's look and redraws it"

[[hints]]
text = "In `watch_settings`, `cx.observe_global::<Settings>(..)` with a closure that applies and notifies; keep what it gives back."
[[hints]]
text = "`let watch = cx.observe_global::<Settings>(|bar, cx| { let settings = cx.global::<Settings>().clone(); bar.apply_settings(&settings); cx.notify(); }); self.settings_watch = Some(watch);`"

[[points]]
after = 3
prompt = "Why keep the Subscription in a field?"
pick = ["dropping it stops the watching", "GPUI needs it for drawing", "it holds the settings", "to save memory"]
answer = 0
