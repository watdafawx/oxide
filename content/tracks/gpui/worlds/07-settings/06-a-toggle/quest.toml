title = "A toggle"
summary = "An on/off switch component; the Stats page has one per stat, and switching it changes the bar."
kind = "exercise"
xp = 40
minutes = 6
tags = ["gpui", "component"]

[[objectives]]
test = "toggle_turns_battery_on"
label = "clicking the Battery toggle adds Battery to the bar's order"

[[hints]]
text = "In `Toggle::render`, the track is a `div` with `.id(..)`, the name, its size, colour by `on`, a white knob as a child, and an `.on_click` that calls `on_toggle(!on, ..)`."
[[hints]]
text = "`div().id(self.id).debug_selector(move || id.to_string()).w(px(36.)).h(px(20.)).p(px(2.)).flex().rounded_full().bg(if on { rgb(0x5ab0ff) } else { rgb(0x555555) }).when(on, |el| el.justify_end()).child(div().size(px(16.)).rounded_full().bg(rgb(0xffffff))).on_click(move |_, window, cx| on_toggle(!on, window, cx))`"

[[points]]
after = 3
prompt = "Who decides what a toggle click changes?"
pick = ["the on_toggle closure the Stats page passes in", "the Toggle itself", "the Settings global", "GPUI"]
answer = 0
