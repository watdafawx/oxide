title = "Drag to reorder"
summary = "Drag a row onto another: take it out where it was, put it in where it was dropped."
kind = "exercise"
xp = 60
minutes = 8
tags = ["gpui", "drag", "vec"]

[[objectives]]
test = "drop_cpu_after_gpu_reorders"
label = "move_slot from 0 to 3 puts CPU usage at 3 and shifts the others up"
[[objectives]]
test = "dragging_a_row_moves_it"
label = "dragging row 0 onto row 3 in the window does the same"

[[hints]]
text = "`move_slot`: return early when an index is out of range or the two are equal; otherwise `remove` then `insert`."
[[hints]]
text = "`if from >= order.len() || to >= order.len() || from == to { return; } let slot = order.remove(from); order.insert(to, slot);`"

[[points]]
after = 3
prompt = "Moving slot 0 to 3 in [A, B, C, D, E] gives..."
pick = ["[B, C, D, A, E]", "[D, B, C, A, E]", "[B, C, A, D, E]", "[A, B, C, D, E]"]
answer = 0
