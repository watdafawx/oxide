title = "Boss: Parallel file hasher"
summary = "Hash every file in a folder with a worker pool, track progress, then redo it with rayon."
kind = "boss"
xp = 400
minutes = 50
tags = ["threads", "channels", "mutex", "atomics", "rayon", "boss"]

[[objectives]]
test = "progress_counts_across_threads"
label = "Progress: an AtomicUsize counter with new / inc / done"
[[objectives]]
test = "fnv1a_matches_known_vectors"
label = "fnv1a(&[u8]) -> u64 gives the published FNV-1a values"
[[objectives]]
test = "walk_lists_every_file_sorted"
label = "walk(dir) lists all files in all subfolders, sorted by path"
[[objectives]]
test = "hash_all_matches_a_sequential_run"
label = "hash_all(files, workers) returns (path, hash) pairs sorted by path"
[[objectives]]
test = "hash_all_handles_edge_cases"
label = "No files, one worker, or more workers than files all work (and never hang)"
[[objectives]]
test = "hash_all_tracked_counts_every_file"
label = "hash_all_tracked bumps Progress once per hashed file"
[[objectives]]
test = "hash_all_rayon_matches_the_pool"
label = "hash_all_rayon gives the same sorted result using par_iter"
[[objectives]]
test = "report_lists_hex_hashes"
label = "report prints a count line and one '<16 hex digits>  <path>' line per file"

[[hints]]
text = "Do the small ones first: `fetch_add(1, Relaxed)` / `load(Relaxed)` for Progress. FNV-1a: start `h = 0xcbf29ce484222325`; for each byte `h ^= byte as u64; h = h.wrapping_mul(0x100000001b3)`."
[[hints]]
text = "`walk`: `fs::read_dir`, for each entry `path.is_dir()` -> recurse and `extend`, otherwise `push`. Sort at the end. An unreadable dir gives an empty Vec."
[[hints]]
text = "Pool in `hash_all_tracked`: one job channel (`Sender<PathBuf>` to the workers) and one result channel. Workers share the job `Receiver` as `Arc<Mutex<Receiver<_>>>`: `let job = rx.lock().unwrap().recv();` (the guard ends at the semicolon). Loop until `recv()` is `Err`, then exit."
[[hints]]
text = "Order matters: spawn the workers, send every path, then `drop(job_tx)` so workers see the end. Drop the extra result `Sender` in the parent too, then collect the results with `res_rx.iter()` and `sort()`. `thread::scope` lets workers borrow `progress` without moving it."
[[hints]]
text = "`hash_all` can be one line: call `hash_all_tracked` with a throwaway `&Progress::new()`. `hash_all_rayon`: `files.par_iter().map(|p| (p.clone(), hash_file(p))).collect()`, then sort."
