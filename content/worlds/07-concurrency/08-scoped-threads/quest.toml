title = "Scoped threads"
summary = "thread::scope lets threads borrow local data: no move, no Arc."
kind = "exercise"
xp = 60
minutes = 10
tags = ["scope", "borrowing", "threads"]

[[objectives]]
test = "parallel_sum_borrows_both_halves"
label = "parallel_sum sums two halves of a slice on two scoped threads"
[[objectives]]
test = "max_of_chunks_joins_inside_the_scope"
label = "max_of_chunks: one scoped thread per chunk, largest value wins"
[[objectives]]
test = "fill_in_parallel_writes_disjoint_halves"
label = "fill_in_parallel: two threads write to two halves of one &mut slice"

[[hints]]
text = "`data.split_at(mid)` gives two `&[i64]` halves. Inside `thread::scope(|s| { ... })` call `s.spawn(|| left.iter().sum::<i64>())`: no `move`, no clone."
[[hints]]
text = "`s.spawn` returns a handle too. `join().unwrap()` it inside the scope to get the value out. Scope's closure returns what you return."
[[hints]]
text = "For `&mut`, `buf.split_at_mut(mid)` gives two non-overlapping `&mut [u32]`. The right half starts at index `mid`, so element `i` there is global index `mid + i`."
