title = "Boss: Minecraft server pinger"
summary = "Speak the real Server List Ping protocol: frame packets, send a handshake, parse the status JSON."
kind = "boss"
xp = 450
minutes = 60
tags = ["tcp", "varint", "protocol", "serde_json", "boss"]

[[objectives]]
test = "packet_encode_frames_length_and_id"
label = "Packet::encode writes VarInt length, VarInt id, then the payload"
[[objectives]]
test = "status_request_is_two_bytes"
label = "status_request() is the empty packet with id 0: [0x01, 0x00]"
[[objectives]]
test = "handshake_matches_protocol_bytes"
label = "handshake(host, port) has the exact protocol layout (767, host, port, next state 1)"
[[objectives]]
test = "read_packet_parses_frames"
label = "read_packet reads one frame from a stream and stops there"
[[objectives]]
test = "read_packet_rejects_bad_frames"
label = "Truncated, zero, negative or absurd lengths are errors (no huge allocations)"
[[objectives]]
test = "parse_status_reads_fields"
label = "parse_status pulls version, protocol, players and description out of the JSON"
[[objectives]]
test = "parse_status_flattens_description_components"
label = "A description object with text and extra parts becomes one plain string"
[[objectives]]
test = "ping_talks_to_fake_server"
label = "ping(addr) completes the whole conversation with a server on 127.0.0.1"

[[hints]]
text = "Order that works: `Packet::encode` -> `status_request` -> `handshake` (the helpers `write_varint` and `write_string` are already written) -> `read_packet` -> `parse_status` -> `ping`. Each objective only needs the ones before it."
[[hints]]
text = "A packet is `[VarInt length][VarInt id][payload]`, and the length counts the id plus the payload. So `encode` builds the body first (id + payload), then puts `body.len()` in front."
[[hints]]
text = "`handshake` payload = VarInt(PROTOCOL_VERSION), string(host), `port.to_be_bytes()`, VarInt(1); wrap it in `Packet { id: 0, payload }.encode()`. `status_request` is `Packet { id: 0, payload: vec![] }.encode()`."
[[hints]]
text = "`read_packet`: read the length with `read_varint`, reject anything outside `1..=MAX_PACKET_LEN`, `read_exact` into a `vec![0; len]`, then read the id from a `Cursor` over that buffer."
[[hints]]
text = "`parse_status`: `let v: Value = serde_json::from_str(json)?` (map the error to `invalid(..)`), then `v[\"version\"][\"name\"].as_str()`, `v[\"players\"][\"online\"].as_u64()`, ... with `ok_or_else(|| invalid(\"...\"))?`. `flatten_text` for an object: `text` plus the flattened `extra` items."
[[hints]]
text = "`ping`: connect with timeouts, `write_all` handshake then status_request, `read_packet`, check `id == 0`, `read_string(&packet.payload)`, `parse_status`."
