title = "UDP: fire and forget"
summary = "Send a datagram, get a reply, and don't wait forever when nobody answers."
kind = "exercise"
xp = 45
minutes = 8
tags = ["udp", "sockets", "timeouts"]

[[objectives]]
test = "server_replies_uppercase"
label = "serve_once receives one datagram and sends it back in UPPERCASE to the sender"
[[objectives]]
test = "request_gets_reply"
label = "request sends a datagram to the server and returns the reply"
[[objectives]]
test = "request_times_out_when_nobody_answers"
label = "request returns an Err instead of hanging when there is no reply"

[[hints]]
text = "`serve_once`: `let (n, from) = socket.recv_from(&mut buf)?;` then `socket.send_to(&reply, from)?;` with `reply = buf[..n].to_ascii_uppercase()`."
[[hints]]
text = "`request`: `UdpSocket::bind(\"127.0.0.1:0\")?`, `send_to(msg, server)?`, `recv_from(&mut buf)?`, return `buf[..n].to_vec()`."
[[hints]]
text = "Before receiving, call `socket.set_read_timeout(Some(Duration::from_millis(500)))?`. Then `recv_from` returns an `Err` instead of waiting forever."
