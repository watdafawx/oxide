title = "What a mob drops, and what it is called"
summary = "Use an associated type Drop and an associated const ID on a Mob trait."

[[objectives]]
test = "celsius_converts_to_fahrenheit"
label = "Zombie::loot() returns rotten flesh as a u32 (2 + looting)"
[[objectives]]
test = "words_counts_words"
label = "Creeper::loot() returns a String: \"gunpowder\", or \"head\" when charged"
[[objectives]]
test = "names_are_set"
label = "Each mob sets its own ID const"
[[objectives]]
test = "label_uses_name_and_output"
label = "label() prints \"<ID>: <loot>\""

[[hints]]
text = "Zombie: `2 + self.looting`. Creeper: `if self.charged { \"head\" } else { \"gunpowder\" }.to_string()`."
[[hints]]
text = "`const ID: &str = \"zombie\";` and `\"creeper\"`."
[[hints]]
text = "`label`: `format!(\"{}: {}\", M::ID, mob.loot())`. Read the constant from the **type**, `M::ID`."
