title = "An inventory for any item"
summary = "Make a generic Inventory<T> and add methods only some item types get."

[[objectives]]
test = "new_and_swap"
label = "Inventory::new and swap_hands() work for any T"
[[objectives]]
test = "larger_picks_bigger"
label = "best() returns a reference to the better item"
[[objectives]]
test = "describe_larger_formats_text"
label = "describe_best() prints \"Best item: <x>\""

[[hints]]
text = "`new` is a plain struct literal: `Inventory { main_hand, off_hand }`. `swap_hands` builds a new `Inventory` with the fields crossed."
[[hints]]
text = "`best`: `if self.main_hand >= self.off_hand { &self.main_hand } else { &self.off_hand }`."
[[hints]]
text = "`describe_best`: `format!(\"Best item: {}\", self.best())`. It works because this impl block needs `Display` and `PartialOrd`."
