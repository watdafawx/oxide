title = "Arc: Rc for threads"
summary = "Share a read-only Vec between two threads. Concurrency proper comes in world 07."
kind = "exercise"
xp = 35
minutes = 5
tags = ["arc", "threads"]

[[objectives]]
test = "parallel_sum_adds_everything"
label = "parallel_sum splits the data across two threads and adds the halves"
[[objectives]]
test = "parallel_sum_handles_tiny_inputs"
label = "Empty and one-element inputs work too"

[[hints]]
text = "`let data = Arc::new(data);` then `let a = Arc::clone(&data);` for each thread."
[[hints]]
text = "`thread::spawn(move || a[..mid].iter().sum::<i32>())` returns a handle. `handle.join().unwrap()` is the result."
