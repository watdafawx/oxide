title = "Mod-prefixed item names"
summary = "Item names usually come ready to use. Allocate only when you must add the mod id."

[[objectives]]
test = "clean_input_is_borrowed"
label = "A name that already has a mod id (\"create:cogwheel\") comes back as Cow::Borrowed (no allocation)"
[[objectives]]
test = "tabs_become_single_spaces"
label = "A bare name gets the mod id in front: \"cogwheel\" becomes \"create:cogwheel\""
[[objectives]]
test = "changed_input_is_owned"
label = "A name that needed the prefix comes back as Cow::Owned"

[[hints]]
text = "Check first: `name.contains(':')`."
[[hints]]
text = "Already prefixed: `Cow::Borrowed(name)`. Bare name: `Cow::Owned(format!(\"{mod_id}:{name}\"))`."
