title = "Power pole back-links"
summary = "A machine that points back to its power pole must not own it. Use Weak."

[[objectives]]
test = "adopt_links_both_ways"
label = "connect(&pole, &machine) fills pole.machines and machine.pole"
[[objectives]]
test = "parent_link_is_weak"
label = "The pole's strong count stays 1 (only a weak count is added)"
[[objectives]]
test = "orphan_after_parent_dropped"
label = "pole_name returns None once the pole is gone (no unwrap!)"

[[hints]]
text = "`pole.machines.borrow_mut().push(Rc::clone(machine));` then set `*machine.pole.borrow_mut() = Rc::downgrade(pole);`"
[[hints]]
text = "`Rc::downgrade(&rc)` makes a `Weak`. It does not raise the strong count."
[[hints]]
text = "`machine.pole.borrow().upgrade()` returns `Option<Rc<PowerPole>>`. `.map(|p| p.name.clone())` finishes it."
