title = "Chest behind a shared handle"
summary = "Count swings and fill a chest through an immutable reference."

[[objectives]]
test = "hit_counts_through_shared_ref"
label = "Inserter::swing(&self) counts a swing even though self is not mut"
[[objectives]]
test = "add_item_mutates_in_place"
label = "put_in_chest(&RefCell<Vec<String>>, item) pushes onto the inventory"
[[objectives]]
test = "is_locked_detects_active_borrow"
label = "chest_busy is true only while a borrow is alive (use try_borrow_mut)"

[[hints]]
text = "`*self.swings.borrow_mut() += 1;` gives you `&mut u32` for one statement."
[[hints]]
text = "`chest.borrow_mut().push(item.to_string());`"
[[hints]]
text = "`chest.try_borrow_mut().is_err()` is true exactly when someone else holds a borrow."
