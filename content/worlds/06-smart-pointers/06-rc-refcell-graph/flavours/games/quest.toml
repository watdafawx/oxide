title = "Assemblers feeding assemblers"
summary = "Wire machines into a graph that can be shared and edited, then total its throughput."

[[objectives]]
test = "new_node_is_a_leaf"
label = "new_assembler(rate) makes a shared assembler with that rate and nothing downstream"
[[objectives]]
test = "add_child_links_parent"
label = "connect(&source, target) appends the target to source.feeds"
[[objectives]]
test = "shared_child_changes_show_up"
label = "Changing an assembler's rate through your own handle changes the total"
[[objectives]]
test = "total_sums_whole_tree"
label = "total_throughput(&assembler) adds the assembler and everything it feeds"

[[hints]]
text = "`Rc::new(RefCell::new(Assembler { rate, feeds: Vec::new() }))`"
[[hints]]
text = "`source.borrow_mut().feeds.push(target);` The `Rc` you pass in is moved into the Vec."
[[hints]]
text = "`let a = assembler.borrow(); a.rate + a.feeds.iter().map(total_throughput).sum::<u32>()`"
