title = "Shared and mutable: Rc<RefCell>"
summary = "Build a tree whose nodes can be shared and edited."
kind = "exercise"
xp = 70
minutes = 12
tags = ["rc", "refcell", "tree"]

[[objectives]]
test = "new_node_is_a_leaf"
label = "new_node(v) makes a shared node with value v and no children"
[[objectives]]
test = "add_child_links_parent"
label = "add_child(&parent, child) appends the child to parent.children"
[[objectives]]
test = "shared_child_changes_show_up"
label = "Editing a child through your own handle changes the tree"
[[objectives]]
test = "total_sums_whole_tree"
label = "total(&node) adds the node and all its descendants"

[[hints]]
text = "`Rc::new(RefCell::new(Node { value, children: Vec::new() }))`"
[[hints]]
text = "`parent.borrow_mut().children.push(child);` The `Rc` you pass in is moved into the Vec."
[[hints]]
text = "`let n = node.borrow(); n.value + n.children.iter().map(total).sum::<i32>()`"
