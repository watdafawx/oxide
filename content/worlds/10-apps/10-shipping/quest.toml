title = "Shipping an app"
summary = "Release profiles, small binaries, where installers land, and where user data lives."
kind = "read"
xp = 15
minutes = 4
tags = ["release", "lto", "bundle", "app-data"]

[[quiz]]
question = "You want a smaller, faster release binary and don't mind a longer build. Which Cargo.toml section does that?"
choices = [
  "[profile.release] with lto = true, codegen-units = 1 and strip = true",
  "[dependencies] with every crate set to default-features = false",
  "[profile.dev] with opt-level = 0",
]
answer = 0

[[quiz]]
question = "Where should your app keep the user's database and settings?"
choices = [
  "Next to the executable, so the app stays portable",
  "In the OS app-data directory (for example %APPDATA% on Windows), found with a crate like dirs",
  "In the current working directory, wherever the app was launched from",
]
answer = 1
