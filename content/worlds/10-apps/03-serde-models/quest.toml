title = "Structs to JSON and back"
summary = "Derive Serialize and Deserialize for the Profile Oxide's UI receives."
kind = "exercise"
xp = 55
minutes = 9
tags = ["serde", "json", "derive"]

[[objectives]]
test = "profile_serializes_with_api_field_names"
label = "to_json(&profile) produces the fields the UI expects"
[[objectives]]
test = "profile_round_trips"
label = "from_json(to_json(p)) gives back an equal Profile"
[[objectives]]
test = "missing_fields_fall_back_to_defaults"
label = "an old save with only {\"xp\": 120} still loads"
[[objectives]]
test = "status_is_lowercase_in_json"
label = "ObjectiveStatus::NotRun becomes \"notrun\""

[[hints]]
text = "Add `Serialize, Deserialize` to the `#[derive(...)]` lists of `Settings` and `Profile`. Then `to_json` is `serde_json::to_string(profile)` and `from_json` is `serde_json::from_str(json)`."
[[hints]]
text = "Put `#[serde(default)]` above `struct Profile`: any field missing from the JSON is taken from `Profile::default()`."
[[hints]]
text = "Put `#[serde(rename_all = \"lowercase\")]` above `enum ObjectiveStatus`, and use `serde_json::to_string(&status)` in `status_to_json`."
