title = "Tauri commands without a window"
summary = "Put the logic in plain functions, wrap it in #[tauri::command], and test it with the mock runtime."
kind = "exercise"
xp = 75
minutes = 14
tags = ["tauri", "commands", "state", "testing"]

[[objectives]]
test = "level_rises_every_100_xp"
label = "level_for(xp) is 1 at 0 XP and goes up every 100 XP"
[[objectives]]
test = "award_xp_adds_and_reports_level"
label = "award_xp_inner adds to the state and returns the new Profile"
[[objectives]]
test = "start_quest_rejects_blank_and_duplicate_ids"
label = "start_quest_inner records ids, and refuses blank or repeated ones"
[[objectives]]
test = "commands_work_through_the_mock_app"
label = "both commands answer when invoked through tauri::test::mock_builder"

[[hints]]
text = "Start with the plain functions: `xp / 100 + 1`, then `state.xp += amount; Profile { xp: state.xp, level: level_for(state.xp) }`. No Tauri involved yet."
[[hints]]
text = "`start_quest_inner`: `if id.trim().is_empty() { return Err(\"quest id is blank\".into()); }`, `if state.started.contains(&id) { return Err(...) }`, then `state.started.push(id)` and return `Ok(state.started.clone())`."
[[hints]]
text = "A command is a thin wrapper: `award_xp_inner(&mut state.lock().unwrap(), amount)`. `state` is `tauri::State<Mutex<AppState>>`; `.lock()` works on it directly. Do the same for `start_quest`."
