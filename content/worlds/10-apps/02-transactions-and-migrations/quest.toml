title = "All or nothing"
summary = "Group inserts in a transaction and upgrade old databases with user_version migrations."
kind = "exercise"
xp = 60
minutes = 10
tags = ["rusqlite", "transactions", "migrations"]

[[objectives]]
test = "migrate_builds_latest_schema"
label = "migrate() on a fresh database ends at version 2 with the notes table"
[[objectives]]
test = "migrate_upgrades_old_db_and_keeps_rows"
label = "migrate() upgrades a version-1 database without losing rows"
[[objectives]]
test = "add_many_inserts_all_bodies"
label = "add_many inserts every body in one transaction"
[[objectives]]
test = "add_many_rolls_back_on_error"
label = "if one insert fails, none of them stay"

[[hints]]
text = "`let tx = conn.transaction()?;` starts one. Use `tx` like a connection, and finish with `tx.commit()`. If `tx` is dropped without commit, everything rolls back."
[[hints]]
text = "In `migrate`: `let v = version(&tx)?;` then `if v < 1 { ... }` and `if v < 2 { ... }` run only the steps the database is missing. At the end `tx.pragma_update(None, \"user_version\", 2)?;`."
[[hints]]
text = "In `add_many`, prepare once: `let mut stmt = tx.prepare(\"INSERT INTO notes (body) VALUES (?1)\")?;` and call `stmt.execute(params![body])?` in a loop. Put the statement in its own `{ }` block so it is dropped before `tx.commit()`."
