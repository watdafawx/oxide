title = "Shared state: Mutex and RwLock"
summary = "Share one value between tasks with Arc<Mutex<T>>. Use tokio's Mutex when you hold it across an .await."
kind = "exercise"
xp = 60
minutes = 12
tags = ["async", "mutex", "rwlock", "arc"]

[[objectives]]
test = "counter_reaches_the_full_total"
label = "count_concurrently: 10 tasks x 20 bumps = 200, no lost updates"
[[objectives]]
test = "cache_insert_then_get"
label = "Cache::insert and Cache::get work (RwLock)"
[[objectives]]
test = "cache_is_shared_between_tasks"
label = "Many tasks can write to one Arc<Cache> and the count adds up"

[[hints]]
text = "`bump`: `let mut guard = counter.lock().await; let v = *guard; yield_now().await; *guard = v + 1;` — the lock is held across an `.await`."
[[hints]]
text = "`count_concurrently`: `let counter = Arc::new(Mutex::new(0));`, clone it into each spawned task, await all handles, then `*counter.lock().await`."
[[hints]]
text = "`Cache`: `self.inner.write().await.insert(k.to_string(), v.to_string())` to write, `self.inner.read().await.get(k).cloned()` to read."
