title = "Boss: todo list that remembers"
summary = "A todo list saved to a file, with typed errors inside and anyhow outside."
kind = "boss"
xp = 350
minutes = 50
tags = ["thiserror", "anyhow", "files", "result", "boss"]

[[objectives]]
test = "new_store_is_empty"
label = "Store::new() starts with no todos"
[[objectives]]
test = "add_assigns_increasing_ids"
label = "add returns ids 1, 2, ... and stores the todos"
[[objectives]]
test = "toggle_flips_done_and_reports_missing_ids"
label = "toggle flips done, unknown id gives TodoError::NotFound"
[[objectives]]
test = "parse_command_understands_all_three"
label = "parse_command reads add, done and list"
[[objectives]]
test = "parse_command_rejects_nonsense"
label = "Bad input gives TodoError::BadCommand"
[[objectives]]
test = "save_then_load_round_trips"
label = "save writes a file that load reads back identically"
[[objectives]]
test = "load_missing_file_gives_empty_store"
label = "load tolerates a file that does not exist yet"
[[objectives]]
test = "run_executes_commands"
label = "run adds, completes and lists, and errors keep their TodoError"

[[hints]]
text = "Start small: `Store::new()` is `Self::default()`. Then `add`: the next id is `self.todos.iter().map(|t| t.id).max().unwrap_or(0) + 1`."
[[hints]]
text = "`toggle`: `self.todos.iter_mut().find(|t| t.id == id).ok_or(TodoError::NotFound(id))?` gives you the todo to flip."
[[hints]]
text = "`parse_command`: `let input = input.trim();` then `split_once(' ').unwrap_or((input, \"\"))` gives verb and rest. `match verb { \"add\" => ..., \"done\" => ..., \"list\" => ..., _ => Err(TodoError::BadCommand(input.to_string())) }`."
[[hints]]
text = "`add` needs non-empty `rest`. `done` parses a number: `rest.parse().map(Command::Done).map_err(|_| TodoError::BadCommand(input.to_string()))`."
[[hints]]
text = "`load`: `match std::fs::read_to_string(path) { Ok(text) => text, Err(e) if e.kind() == std::io::ErrorKind::NotFound => return Ok(Store::new()), Err(e) => return Err(e).with_context(|| ...) }`."
[[hints]]
text = "Still in `load`: `text.lines().enumerate()`, then `parse_line(line).with_context(|| format!(\"line {}\", i + 1))` for each, collected into `Result<Vec<Todo>>` with `?`."
[[hints]]
text = "`save`: `self.todos.iter().map(format_line).collect::<Vec<_>>().join(\"\\n\")`, then `std::fs::write(path, text)` with the `with_context` from the TODO."
[[hints]]
text = "`run`: `match cmd { Command::Add(text) => Ok(format!(\"added {}\", store.add(&text))), Command::Done(id) => { store.toggle(id)?; Ok(format!(\"done {id}\")) } Command::List => ... }`."
