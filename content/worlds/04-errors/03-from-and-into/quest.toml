title = "From makes ? convert"
summary = "Teach ? to turn a ParseIntError into your own error type."
kind = "exercise"
xp = 30
minutes = 5
tags = ["from", "into", "question-mark"]

[[objectives]]
test = "from_wraps_the_parse_error"
label = "From<ParseIntError> wraps the error in MyError::Parse"
[[objectives]]
test = "sum_all_stops_at_first_bad_input"
label = "sum_all uses ? and returns the first error"

[[hints]]
text = "Inside `from`, build the variant: `MyError::Parse(e)`. Rename `_e` to `e` first."
[[hints]]
text = "In `sum_all`, loop over `inputs` and add `parse_small(input)?` to a running total."
