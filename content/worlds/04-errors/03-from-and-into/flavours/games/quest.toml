title = "Version numbers that convert"
summary = "Teach ? to turn a ParseIntError into a ManifestError."

[[objectives]]
test = "parse_error_wraps_into_bad_version"
label = "From<ParseIntError> wraps the error in ManifestError::BadVersion"
[[objectives]]
test = "pack_fingerprint_stops_at_first_error"
label = "pack_fingerprint uses ? and returns the first error"

[[hints]]
text = "Inside `from`, build the variant: `ManifestError::BadVersion(e)`. Rename `_e` to `e` first."
[[hints]]
text = "In `pack_fingerprint`, loop over `builds` and add `parse_build(build)?` to a running total."
