title = "Parse a mod line with ?"
summary = "Read the numbers in a manifest and bail out early on a bad one."

[[objectives]]
test = "parse_and_double_doubles_a_number"
label = "mods_for_client_and_server(\"21\") returns Ok(42)"
[[objectives]]
test = "parse_and_double_passes_the_error_up"
label = "A bad mod count comes back as Err, not a crash"
[[objectives]]
test = "first_char_upper_uses_question_mark_on_option"
label = "mod_initial works on Option too"

[[hints]]
text = "Put `?` after the fallible call: `let n = count.parse::<i32>()?;`. If it is an Err, the function returns it right there."
[[hints]]
text = "After the `?` line, the rest is plain: `Ok(n * 2)`. Client and server both need every mod."
[[hints]]
text = "For the Option one: `let c = name.chars().next()?;` then `c.to_uppercase().next()`."
