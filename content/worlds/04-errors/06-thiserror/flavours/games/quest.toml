title = "thiserror: ManifestError without the boilerplate"
summary = "Derive Display, Error and From with a few attributes."

[[objectives]]
test = "missing_key_message_names_the_key"
label = "MissingMod(name) displays \"mod not in manifest: <name>\""
[[objectives]]
test = "bad_port_converts_with_from"
label = "A bad version becomes ManifestError::BadVersion via ? and #[from]"
[[objectives]]
test = "read_port_finds_a_valid_port"
label = "find_version returns the parsed version number"

[[hints]]
text = "Put `#[error(\"mod not in manifest: {0}\")]` above `MissingMod`. `{0}` is the first field."
[[hints]]
text = "On `BadVersion`: `#[error(\"version is not a number: {0}\")]` and mark the field `#[from] ParseIntError`. That generates the `From` impl, so `?` works."
[[hints]]
text = "In `find_version`: find the pair with `.iter().find(..)`, `.ok_or_else(|| ManifestError::MissingMod(mod_name.to_string()))?`, then `Ok(version.parse()?)`."
