title = "Your own error type"
summary = "An enum of everything that can go wrong, with a readable message for each."
kind = "exercise"
xp = 55
minutes = 10
tags = ["enum", "display", "error-trait"]

[[objectives]]
test = "display_gives_readable_messages"
label = "Display prints a clear message for each ParseError"
[[objectives]]
test = "parse_age_reports_each_failure"
label = "parse_age returns Empty, NotANumber or Negative"
[[objectives]]
test = "parse_error_works_as_dyn_error"
label = "ParseError can be used as a &dyn Error"

[[hints]]
text = "In `fmt`, `match self` and use `write!(f, \"...\")` in each arm. Variants with data bind it: `ParseError::Negative(n) => write!(f, \"{n} is negative\")`."
[[hints]]
text = "In `parse_age`: if `s.trim().is_empty()` return `Err(ParseError::Empty)`. Then `s.trim().parse::<i64>().map_err(|_| ParseError::NotANumber(s.to_string()))?`."
[[hints]]
text = "Last step: if the number is below 0 return `Err(ParseError::Negative(n))`, otherwise `Ok(n as u32)`."
