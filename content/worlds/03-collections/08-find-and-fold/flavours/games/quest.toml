title = "Find, check, fold your drops"
summary = "find, position, any, all, fold and max_by_key: answers from an inventory."

[[objectives]]
test = "find_and_position_search"
label = "first_stack_over uses find and slot_of uses position"
[[objectives]]
test = "any_and_all_check"
label = "has_fragile_tool uses any and all_full_stacks uses all"
[[objectives]]
test = "fold_builds_a_total"
label = "damage_after_armor folds a hit through each armor reduction"
[[objectives]]
test = "max_by_key_picks_longest"
label = "biggest_stack returns the stack with the most items, or None if empty"

[[hints]]
text = "`stacks.iter().copied().find(|n| *n > limit)` gives `Option<u32>`. For the slot: `items.iter().position(|n| n == name)` (compare `n.as_str() == name`)."
[[hints]]
text = "`any` and `all` take a closure and return `bool`: `durability.iter().any(|d| *d <= 1)`."
[[hints]]
text = "`fold(start, |acc, item| new_acc)`: `reductions.iter().fold(damage, |d, off| d * (1.0 - off / 100.0))`. And `stacks.iter().max_by_key(|s| s.count)`."
