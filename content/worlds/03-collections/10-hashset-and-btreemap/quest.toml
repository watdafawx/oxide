title = "Sets and sorted maps"
summary = "HashSet for uniqueness and overlap, BTreeMap for output that stays in order."
kind = "exercise"
xp = 40
minutes = 7
tags = ["hashset", "btreemap"]

[[objectives]]
test = "unique_count_uses_a_set"
label = "unique_count counts distinct numbers"
[[objectives]]
test = "common_uses_intersection"
label = "common returns the sorted numbers present in both slices"
[[objectives]]
test = "letter_counts_are_sorted"
label = "letter_counts counts letters in a BTreeMap, so keys come out a to z"

[[hints]]
text = "`numbers.iter().collect::<HashSet<_>>().len()`. A set silently ignores duplicates."
[[hints]]
text = "Make a `HashSet` of each side: `a.iter().copied().collect::<HashSet<i32>>()`. Then `set_a.intersection(&set_b).copied().collect::<Vec<_>>()`, and `sort()` it since sets have no order."
[[hints]]
text = "Same as the word counter, but `BTreeMap::new()`. Skip non-letters, lowercase the rest: `*counts.entry(c.to_ascii_lowercase()).or_insert(0) += 1;`."
