title = "Boss: Modpack stats"
summary = "Parse a modpack's mod list (CSV) and answer questions about it with iterator chains."

[[objectives]]
test = "mod_size_kb_is_mb_times_1024"
label = "Mod::size_kb is size_mb times 1024"
[[objectives]]
test = "parse_mod_reads_fields_and_rejects_bad_ones"
label = "parse_mod reads one line into a Mod, or says what is wrong"
[[objectives]]
test = "parse_modlist_skips_header_and_blanks"
label = "parse_modlist skips the header and blank lines and returns every Mod"
[[objectives]]
test = "parse_modlist_reports_line_number"
label = "parse_modlist fails with \"line N: ...\" for the first bad line"
[[objectives]]
test = "downloads_by_loader_sums_per_loader"
label = "downloads_by_loader sums downloads per loader, sorted by name"
[[objectives]]
test = "top_n_picks_most_downloaded"
label = "top_n returns the n most downloaded mods, biggest first"
[[objectives]]
test = "smallest_in_filters_a_loader"
label = "smallest_in returns the smallest mod of a loader by size_mb, or None"
[[objectives]]
test = "report_aligns_mod_columns"
label = "report prints a header, one aligned line per mod, and a footer"

[[hints]]
text = "Start small: `Mod::size_kb` is `self.size_mb * 1024.0`. Then `parse_mod`: `line.split(',').map(str::trim).collect::<Vec<_>>()` gives the fields. Check `fields.len()` first."
[[hints]]
text = "Parsing a field: `fields[2].parse().map_err(|_| format!(\"bad downloads '{}'\", fields[2]))?`. The `?` at the end returns the `Err` from your function right away, or gives you the number."
[[hints]]
text = "`parse_modlist`: `modlist.lines().enumerate().skip(1)` gives `(index, line)` pairs without the header. `.filter` out blank lines, `.map` each to `parse_mod(line).map_err(|e| format!(\"line {}: {e}\", i + 1))`, then `.collect()`. Collecting an iterator of `Result`s into `Result<Vec<_>, _>` stops at the first `Err`."
[[hints]]
text = "`downloads_by_loader`: a `BTreeMap` and `*totals.entry(m.loader.clone()).or_insert(0) += m.downloads;`. `top_n`: `mods.iter().collect::<Vec<_>>()`, `sort_by_key(|m| std::cmp::Reverse(m.downloads))`, then `.into_iter().take(n).collect()`."
[[hints]]
text = "`smallest_in`: `.iter().filter(|m| m.loader == loader).min_by(|a, b| a.size_mb.total_cmp(&b.size_mb))`. `report`: `vec![header]`, `extend` it with a `map` of `format!(\"{:<10} {:<9} {:>9} {:>7.1}\", ...)`, push the footer, `join(\"\\n\")`."
