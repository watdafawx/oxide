title = "Inventory tricks"
summary = "Shift items to the hotbar, tidy loot, check for an elytra and trash small stacks."

[[objectives]]
test = "move_to_front_removes_then_inserts"
label = "move_to_hotbar takes the item in a slot and puts it first"
[[objectives]]
test = "sorted_unique_sorts_and_dedups"
label = "tidy_loot returns item names sorted with no repeats"
[[objectives]]
test = "has_admin_uses_contains"
label = "has_elytra checks the inventory for \"elytra\""
[[objectives]]
test = "drop_short_uses_retain"
label = "drop_small_stacks removes stacks smaller than min_count"

[[hints]]
text = "`let item = inventory.remove(slot);` returns the removed item. Then `inventory.insert(0, item);`."
[[hints]]
text = "`dedup` only removes **neighbours** that are equal. Sort first: `drops.sort(); drops.dedup();`."
[[hints]]
text = "`items.contains(&\"elytra\".to_string())` compares a `&String`. `retain` takes a closure: `stacks.retain(|s| s.count >= min_count);`."
