title = "Measure before you optimise"
summary = "What a flamegraph shows, and what to check first."
kind = "read"
xp = 15
minutes = 3
tags = ["profiling", "performance"]

[[quiz]]
question = "What does a flamegraph (from samply, cargo-flamegraph or perf) show you?"
choices = [
  "How much memory each variable uses",
  "Which functions the program spends its time in, as stacked bars where width is time",
  "Which lines of code the compiler rejected",
]
answer = 1

[[quiz]]
question = "Your code feels slow. What do you do first?"
choices = [
  "Rewrite the hot loop with unsafe",
  "Measure with a release build and a profiler to find where the time goes",
  "Add #[inline(always)] everywhere",
]
answer = 1
