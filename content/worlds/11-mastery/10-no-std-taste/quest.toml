title = "A taste of no_std"
summary = "A fixed-size ring buffer that uses only `core`, no heap, no std."
kind = "exercise"
xp = 55
minutes = 10
tags = ["no_std", "const-generics", "embedded"]

[[objectives]]
test = "push_and_pop_in_order"
label = "pop returns items first-in, first-out"
[[objectives]]
test = "push_to_full_returns_err"
label = "push on a full buffer gives the value back as Err"
[[objectives]]
test = "wraps_around_the_end"
label = "Indices wrap, so the buffer can be reused forever"

[[hints]]
text = "Fields: `buf` is the storage, `head` is where the oldest item sits, `len` is how many are stored. The next free slot is `(head + len) % N`."
[[hints]]
text = "`push`: if `len == N` return `Err(value)`. Otherwise write at `(head + len) % N`, bump `len`, return `Ok(())`."
[[hints]]
text = "`pop`: if `len == 0` return `None`. Otherwise read `buf[head]`, move `head = (head + 1) % N`, decrease `len`, return `Some(value)`. `len()` returns `self.len`, `is_full()` compares with `N`."
