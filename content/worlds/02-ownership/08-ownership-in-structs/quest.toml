title = "Structs that own, structs that borrow"
summary = "A struct with String owns its text. A struct with &str needs a lifetime."
kind = "exercise"
xp = 40
minutes = 6
tags = ["structs", "lifetimes", "ownership"]

[[objectives]]
test = "as_borrowed_points_into_owned"
label = "Owned::as_borrowed gives a Borrowed view without copying"

[[hints]]
text = "You are building a `Borrowed` that points into `self`. Look at how the `Borrowed` struct is declared: which fields does it need?"
[[hints]]
text = "as_borrowed: `Borrowed { name: &self.name, level: self.level }`. `&self.name` (a `&String`) becomes `&str` automatically."
