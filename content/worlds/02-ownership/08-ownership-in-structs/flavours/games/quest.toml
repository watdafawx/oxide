title = "Players that own, views that borrow"
summary = "A Player with a String owns its name. A PlayerRef with &str needs a lifetime."

[[objectives]]
test = "view_borrows_from_player"
label = "Player::view gives a PlayerRef without copying"

[[hints]]
text = "You are building a `PlayerRef` that points into `self`. Look at how the `PlayerRef` struct is declared: which fields does it need?"
[[hints]]
text = "view: `PlayerRef { name: &self.name, level: self.level }`. `&self.name` (a `&String`) becomes `&str` automatically."
