title = "Your first 'a"
summary = "Return the longer of two &str and tell the compiler how long the answer lives."
kind = "exercise"
xp = 50
minutes = 8
tags = ["lifetimes"]

[[objectives]]
test = "longest_returns_the_longer"
label = "longest(a, b) returns the longer text"
[[objectives]]
test = "tie_returns_first"
label = "On a tie, longest returns the first argument"
[[objectives]]
test = "result_usable_while_inputs_live"
label = "The result can be used as long as both inputs are alive"

[[hints]]
text = "Compare `a.len()` and `b.len()`. A plain `if` expression is enough."
[[hints]]
text = "On a tie return `a`: use `>=` when checking a against b."
[[hints]]
text = "`if a.len() >= b.len() { a } else { b }`"
