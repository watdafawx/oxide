title = "Command<'a> borrows the line"
summary = "Pick the longer argument of two commands and tell the compiler how long the answer lives."

[[objectives]]
test = "longest_arg_picks_longer_argument"
label = "longest_arg(a, b) returns the longer argument"
[[objectives]]
test = "longest_arg_tie_keeps_first_command"
label = "On a tie, longest_arg returns the first command's argument"
[[objectives]]
test = "argument_usable_while_console_lines_live"
label = "The result can be used as long as both console lines are alive"

[[hints]]
text = "Compare `a.arg.len()` and `b.arg.len()`. A plain `if` expression is enough."
[[hints]]
text = "On a tie return `a.arg`: use `>=` when checking a against b."
[[hints]]
text = "`if a.arg.len() >= b.arg.len() { a.arg } else { b.arg }`"
