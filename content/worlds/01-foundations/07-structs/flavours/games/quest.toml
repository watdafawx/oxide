title = "Build an ItemStack"
summary = "Structs, impl blocks, methods and a `new` constructor."

[[objectives]]
test = "cobblestone_stack_starts_full"
label = "ItemStack::new(\"cobblestone\") holds 64 items"
[[objectives]]
test = "taking_items_shrinks_the_stack"
label = "take removes items from the stack"
[[objectives]]
test = "stack_count_stops_at_zero"
label = "count stops at 0 instead of overflowing"
[[objectives]]
test = "has_items_only_while_count_positive"
label = "has_items is true only while count > 0"

[[hints]]
text = "A struct literal: `ItemStack { name: name.to_string(), count: 64 }`."
[[hints]]
text = "`&mut self` lets a method change fields: `self.count -= amount`. But `u32` cannot go below 0..."
[[hints]]
text = "`self.count = self.count.saturating_sub(amount);` stops at 0."
