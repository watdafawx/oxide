title = "Boss: crafting calculator"
summary = "Finish the calculator: raw material totals for a whole crafting tree, driven by scripted input."

[[objectives]]
test = "new_game_starts_with_zero_attempts"
label = "Calculator::new() starts with 0 recipes"
[[objectives]]
test = "guess_reports_too_low_and_too_high"
label = "find_recipe returns Some for a crafted item and None for a raw one"
[[objectives]]
test = "guess_reports_correct"
label = "batches_needed rounds up: 5 planks need 2 crafts"
[[objectives]]
test = "attempts_are_counted"
label = "raw_totals walks the tree: 8 torches need coal x2 and log x1"
[[objectives]]
test = "parse_guess_accepts_numbers"
label = "parse_recipe(\"stick x4 = plank x2\") is Ok(Recipe { .. })"
[[objectives]]
test = "parse_guess_rejects_bad_input"
label = "parse_recipe(\"pizza\") is Err(\"'pizza' is not a recipe\")"
[[objectives]]
test = "play_reports_each_guess"
label = "run turns scripted lines into messages; bad lines change nothing"
[[objectives]]
test = "play_stops_after_correct_guess"
label = "run stops at quit and says \"1 recipe\" in the singular"

[[hints]]
text = "Start with `Calculator::new`: `Calculator { recipes: Vec::new() }`. Then `find_recipe`: `self.recipes.iter().find(|r| r.output == item)` gives an `Option<&Recipe>`."
[[hints]]
text = "`batches_needed`: `match self.find_recipe(item) { Some(recipe) => wanted.div_ceil(recipe.yields), None => 0 }`. `div_ceil` divides and rounds up."
[[hints]]
text = "`expand` calls itself: a raw item adds `wanted` to `totals`, a crafted item calls `expand` for each ingredient with `count * batches`. Do the `None` arm first and test the easy cases."
[[hints]]
text = "`parse_recipe`: `line.split_once('=')` gives `Option<(&str, &str)>`. Use `parse_part` on the left side, then on each piece of `right.split(',')`. Any `None` becomes `Err(bad)`."
[[hints]]
text = "`run`: make a `Calculator` and a `Vec<String>`. `for input in inputs`, trim it, then check `\"quit\"`, `starts_with(\"need \")`, else `parse_recipe`. `break` after quit."
[[hints]]
text = "Plural: `let s = if n == 1 { \"\" } else { \"s\" };` then `format!(\"Bye! {n} recipe{s} learned\")`."
