title = "Rarity and stack actions"
summary = "match with ranges and guards, plus if let for one case."

[[objectives]]
test = "rarity_follows_enchant_ranges"
label = "rarity(enchants) maps ranges to common, uncommon, rare, epic"
[[objectives]]
test = "stack_state_guards_corrupt_empty_full_partial"
label = "stack_state uses guards: corrupt, empty, full, partial"
[[objectives]]
test = "every_stack_action_is_handled"
label = "apply handles every StackAction variant"
[[objectives]]
test = "new_name_is_pulled_out_with_if_let"
label = "new_name pulls the name out with if let"

[[hints]]
text = "Ranges work in patterns: `1..=2 => \"uncommon\"`. The catch-all arm is `_ => \"epic\"`."
[[hints]]
text = "A guard adds a condition to an arm: `n if n < 0 => \"corrupt\"`. Order matters: first match wins."
[[hints]]
text = "`if let StackAction::Rename(name) = action { name.clone() } else { String::new() }`."
