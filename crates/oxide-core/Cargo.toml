[package]
name = "oxide-core"
description = "Content model, grader, workspace and progress engine for Oxide"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
log.workspace = true
rusqlite = { version = "0.37", features = ["bundled"] }
notify = "8"
notify-debouncer-mini = "0.6"
directories = "6"
regex = "1"
roxmltree = "0.20"
chrono = "0.4"
# Embedded Lua 5.2 (Factorio's version) for the lua runner; no system Lua needed.
mlua = { version = "0.12", features = ["lua52", "vendored"] }

[dev-dependencies]
tempfile = "3"
